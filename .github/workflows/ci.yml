name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: schema, template syntax, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: pip install -r requirements.txt pytest
      - name: Validate every row and its template
        working-directory: generator
        run: python -m shorlist validate
      - name: Tests
        run: python -m pytest -q tests

  qrp-mcp-informational:
    # Information only: a row is never rejected because a scanner misses it.
    name: qrp-mcp run (informational)
    runs-on: ubuntu-24.04
    needs: validate
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt qrp-mcp==0.44.0
      - name: Measure
        working-directory: generator
        run: |
          python -m shorlist run --adapter qrp-mcp --out ../qrp-mcp.json --md ../qrp-mcp.md
          cat ../qrp-mcp.md >> "$GITHUB_STEP_SUMMARY"
