id: "SL-6022"
title: "M2Crypto: EVP.Cipher(\"aes_128_ecb\", ...)"
family: "AES"
parameter_set: null
role: "encryption"
form_kind: "api_string"
language_or_product: "Python / M2Crypto"
negative: false
row_kind: "defect"
literal: "c = EVP.Cipher(\"aes_128_ecb\", key, b\"\", 1)"
context_filename: "enc.py"
context_template: |
  from M2Crypto import EVP


  def encrypt(key, data):
      c = EVP.Cipher("aes_128_ecb", key, b"", 1)
      return c.update(data) + c.final()
right_template: |
  import os

  from M2Crypto import EVP


  def encrypt(key, data):
      iv = os.urandom(16)
      c = EVP.Cipher("aes_128_cbc", key, iv, 1)
      return iv + c.update(data) + c.final()
