id: "SL-2089"
title: "BoringSSL TLS: group id SSL_GROUP_X25519_MLKEM768"
family: "ML-KEM"
parameter_set: "X25519MLKEM768"
role: "key_establishment"
form_kind: "api_call"
language_or_product: "C / BoringSSL"
negative: false
literal: "static const uint16_t kGroups[] = {SSL_GROUP_X25519_MLKEM768};"
context_filename: "tls.c"
context_template: |
  #include <openssl/base.h>
  #include <openssl/ssl.h>

  static const uint16_t kGroups[] = {SSL_GROUP_X25519_MLKEM768};

  int groups(SSL_CTX *ctx)
  {
      return SSL_CTX_set1_group_ids(ctx, kGroups, 1);
  }
expected:
  family: "ML-KEM"
  role: "key_establishment"
  size: "undetermined"
source:
  - url: "https://github.com/google/boringssl/blob/0.20261020.0/include/openssl/ssl.h"
    section: "include/openssl/ssl.h: SSL_GROUP_X25519_MLKEM768"
    read_at: "2026-11-05"
    quote: "#define SSL_GROUP_X25519_MLKEM768 0x11ec"
  - url: "https://github.com/google/boringssl/blob/0.20261020.0/include/openssl/ssl.h"
    section: "include/openssl/ssl.h: SSL_CTX_set1_group_ids"
    read_at: "2026-11-05"
    quote: "SSL_CTX_set1_group_ids sets the preferred groups for `ctx` to `group_ids`."
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-05"
notes: "Hybrid: scored on the post-quantum half (ML-KEM), as the README and SL-0011 define. openssl/base.h is BoringSSL's own header; with OpenSSL headers installed it is missing, so the syntax check falls back to delimiters instead of resolving SSL_GROUP_* against OpenSSL's ssl.h."
