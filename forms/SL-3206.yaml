id: "SL-3206"
title: "cert-manager Certificate spec.privateKey.algorithm ECDSA"
family: "ECDSA"
parameter_set: "P-256"
role: "signature"
form_kind: "config_value"
language_or_product: "cert-manager 1.21 / Certificate"
negative: false
literal: "    algorithm: ECDSA"
context_filename: "certificate.yaml"
context_template: |
  apiVersion: cert-manager.io/v1
  kind: Certificate
  metadata:
    name: web
  spec:
    secretName: web-tls
    dnsNames:
      - example.com
    issuerRef:
      name: ca-issuer
    privateKey:
      algorithm: ECDSA
expected:
  family: "ECDSA"
  role: "signature"
  size: 256
source:
  - url: "https://github.com/cert-manager/cert-manager/blob/v1.21.3/pkg/apis/certmanager/v1/types_certificate.go"
    section: "CertificatePrivateKey.Algorithm"
    read_at: "2026-11-05"
    quote: "// If provided, allowed values are either `RSA`, `ECDSA` or `Ed25519`."
  - url: "https://github.com/cert-manager/cert-manager/blob/v1.21.3/pkg/apis/certmanager/v1/types_certificate.go"
    section: "PrivateKeyAlgorithm constants"
    read_at: "2026-11-05"
    quote: "ECDSAKeyAlgorithm PrivateKeyAlgorithm = \"ECDSA\""
  - url: "https://github.com/cert-manager/cert-manager/blob/v1.21.3/pkg/apis/certmanager/v1/types_certificate.go"
    section: "CertificatePrivateKey.Algorithm"
    read_at: "2026-11-05"
    quote: "// key size of 2048 will be used for `RSA` key algorithm and // key size of 256 will be used for `ECDSA` key algorithm."
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-05"
notes: "No size is given; the documented default for ECDSA is 256."
