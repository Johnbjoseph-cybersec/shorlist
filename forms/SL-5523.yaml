literal: "private_key = ec.derive_private_key(0x1b6e8a5c03f74d9e1b2a5f3a9c0e7b214d86a1c4e93f0b72d5168e4a07c3f9d2, ec.SECP256R1())"
context_filename: "key.py"
context_template: |
  from cryptography.hazmat.primitives.asymmetric import ec

  private_key = ec.derive_private_key(0x1b6e8a5c03f74d9e1b2a5f3a9c0e7b214d86a1c4e93f0b72d5168e4a07c3f9d2, ec.SECP256R1())
right_template: |
  import os

  from cryptography.hazmat.primitives import serialization

  with open(os.environ["EC_KEY_FILE"], "rb") as f:
      private_key = serialization.load_pem_private_key(f.read(), password=None)
