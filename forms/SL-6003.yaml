id: "SL-6003"
title: "JCA: PBEKeySpec with a hard-coded password"
family: "PBKDF2"
parameter_set: null
role: "n.a."
form_kind: "api_call"
language_or_product: "Java / JCA"
negative: false
row_kind: "defect"
literal: "PBEKeySpec spec = new PBEKeySpec(\"correct-horse-battery\".toCharArray(), salt, 600000, 256);"
context_filename: "Kdf.java"
context_template: |
  import javax.crypto.SecretKeyFactory;
  import javax.crypto.spec.PBEKeySpec;

  public class Kdf {
      static byte[] derive(byte[] salt) throws Exception {
          PBEKeySpec spec = new PBEKeySpec("correct-horse-battery".toCharArray(), salt, 600000, 256);
          return SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256").generateSecret(spec).getEncoded();
      }
  }
right_template: |
  import javax.crypto.SecretKeyFactory;
  import javax.crypto.spec.PBEKeySpec;

  public class Kdf {
      static byte[] derive(char[] password, byte[] salt) throws Exception {
          PBEKeySpec spec = new PBEKeySpec(password, salt, 600000, 256);
          return SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256").generateSecret(spec).getEncoded();
      }
  }
