id: "SL-5034"
title: "JCA: SHA-256 of the password used as an AES key"
family: "SHA-2"
parameter_set: null
role: "hash"
form_kind: "api_call"
language_or_product: "Java / JCA"
negative: false
row_kind: "defect"
literal: "byte[] key = MessageDigest.getInstance(\"SHA-256\").digest(password.getBytes(StandardCharsets.UTF_8));"
context_filename: "Kdf.java"
context_template: |
  import java.nio.charset.StandardCharsets;
  import java.security.MessageDigest;
  import javax.crypto.spec.SecretKeySpec;

  public class Kdf {
      static SecretKeySpec derive(String password) throws Exception {
          byte[] key = MessageDigest.getInstance("SHA-256").digest(password.getBytes(StandardCharsets.UTF_8));
          return new SecretKeySpec(key, "AES");
      }
  }
right_template: |
  import javax.crypto.SecretKeyFactory;
  import javax.crypto.spec.PBEKeySpec;
  import javax.crypto.spec.SecretKeySpec;

  public class Kdf {
      static SecretKeySpec derive(String password, byte[] salt) throws Exception {
          PBEKeySpec spec = new PBEKeySpec(password.toCharArray(), salt, 600000, 256);
          byte[] key = SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256").generateSecret(spec).getEncoded();
          return new SecretKeySpec(key, "AES");
      }
  }
expected:
  family: "SHA-2"
  role: "hash"
  size: "undetermined"
defect:
  cwe: "CWE-916"
source:
  - url: "https://cwe.mitre.org/data/definitions/916.html"
    section: "CWE-916 Use of Password Hash With Insufficient Computational Effort: Description"
    read_at: "2026-11-06"
    quote: "The product generates a hash for a password, but it uses a scheme that does not provide a sufficient level of computational effort that would make password cracking attacks infeasible or expensive."
  - url: "https://cwe.mitre.org/data/definitions/916.html"
    section: "CWE-916: Extended Description"
    read_at: "2026-11-06"
    quote: "Many hash algorithms are designed to execute quickly with minimal overhead, even cryptographic hashes."
  - url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/security/MessageDigest.html"
    section: "Method digest(byte[] input)"
    read_at: "2026-11-06"
    quote: "Performs a final update on the digest using the specified array of bytes, then completes the digest"
  - url: "https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html"
    section: "OWASP Password Storage Cheat Sheet: Background"
    read_at: "2026-11-06"
    quote: "are not suitable for password storage because they allow attackers to perform large numbers of guesses quickly."
status: "verified-source"
