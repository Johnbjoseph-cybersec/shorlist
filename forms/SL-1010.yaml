id: "SL-1010"
title: "OpenSSL: object lookup by long name rsassaPss"
family: "RSA"
cyclonedx_family: "RSASSA-PSS"
parameter_set: null
role: "signature"
form_kind: "api_string"
language_or_product: "C / OpenSSL 3.5"
negative: false
literal: "    int nid = OBJ_txt2nid(\"rsassaPss\");"
context_filename: "obj.c"
context_template: |
  #include <openssl/objects.h>

  int main(void)
  {
      int nid = OBJ_txt2nid("rsassaPss");
      return nid == NID_undef;
  }
