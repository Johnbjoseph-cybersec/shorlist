id: "SL-5044"
title: "Go: pbkdf2.Key with a constant salt"
family: "PBKDF2"
parameter_set: null
role: "n.a."
form_kind: "api_call"
language_or_product: "Go / stdlib"
negative: false
row_kind: "defect"
literal: "return pbkdf2.Key(sha256.New, password, []byte(\"static-salt-1234\"), 600000, 32)"
context_filename: "kdf.go"
context_template: |
  package crypt

  import (
  	"crypto/pbkdf2"
  	"crypto/sha256"
  )

  func Derive(password string) ([]byte, error) {
  	return pbkdf2.Key(sha256.New, password, []byte("static-salt-1234"), 600000, 32)
  }
right_template: |
  package crypt

  import (
  	"crypto/pbkdf2"
  	"crypto/rand"
  	"crypto/sha256"
  )

  func Derive(password string) ([]byte, []byte, error) {
  	salt := make([]byte, 16)
  	rand.Read(salt)
  	key, err := pbkdf2.Key(sha256.New, password, salt, 600000, 32)
  	return salt, key, err
  }
