id: "SL-4586"
title: "OpenSSH sshd: MACs hmac-sha1"
family: "SHA-1"
parameter_set: null
role: "mac"
form_kind: "config_value"
language_or_product: "OpenSSH sshd"
negative: false
literal: "MACs hmac-sha1"
context_filename: "sshd_config"
context_template: |
  Port 22
  MACs hmac-sha1
expected:
  family: "SHA-1"
  role: "mac"
  size: "undetermined"
weakness:
  status: "deprecated"
  anchor: "BSI TR-02102-4 (2026-01), Table 1: Document history, version 2020-01"
  quote: "2020-01 2020-01-31 Adjustment of the periods of use, discontinuation of HMAC-SHA-1"
source:
  - url: "https://man.openbsd.org/sshd_config"
    section: "MACs: the supported MACs (OpenBSD-current, October 30, 2026)"
    read_at: "2026-11-06"
    quote: "The supported MACs are: hmac-md5 hmac-md5-96 hmac-sha1 hmac-sha1-96 hmac-sha2-256"
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "HMAC construction: the weak primitive is the hash inside the MAC, so the row is scored on SHA-1 with role mac. NIST SP 800-131A Rev. 2 still treats HMAC-SHA-1 as acceptable; the anchor is BSI TR-02102-4, which dropped HMAC-SHA-1 from its recommendations in 2020."
