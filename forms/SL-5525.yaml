id: "SL-5525"
title: "Node.js crypto: ecdh.setPrivateKey with a key in the source"
family: "ECDH"
parameter_set: "P-256"
role: "key_establishment"
form_kind: "api_call"
language_or_product: "JavaScript / Node.js crypto"
row_kind: "defect"
negative: false
literal: "ecdh.setPrivateKey('1b6e8a5c03f74d9e1b2a5f3a9c0e7b214d86a1c4e93f0b72d5168e4a07c3f9d2', 'hex');"
context_filename: "kex.js"
context_template: |
  const crypto = require('crypto');

  const ecdh = crypto.createECDH('prime256v1');
  ecdh.setPrivateKey('1b6e8a5c03f74d9e1b2a5f3a9c0e7b214d86a1c4e93f0b72d5168e4a07c3f9d2', 'hex');

  module.exports = { ecdh };
right_template: |
  const crypto = require('crypto');

  const ecdh = crypto.createECDH('prime256v1');
  ecdh.setPrivateKey(require('fs').readFileSync(process.env.ECDH_KEY_FILE));

  module.exports = { ecdh };
