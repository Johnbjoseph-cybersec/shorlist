id: "SL-4131"
title: "Decoy: .NET TripleDES.Create() in a comment"
family: "3DES"
parameter_set: null
role: "n.a."
form_kind: "api_call"
language_or_product: "C# / .NET System.Security.Cryptography"
negative: true
decoy_class: "comment"
literal: "// TripleDES.Create() was removed in 3.0; payloads are sent in clear to the HSM."
context_filename: "Crypto.cs"
context_template: |
  class Crypto
  {
