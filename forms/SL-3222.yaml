id: "SL-3222"
title: "Decoy: Cloud KMS algorithm name in a REST body's labels"
family: "ECDSA"
parameter_set: "P-384"
role: "n.a."
form_kind: "api_string"
language_or_product: "Google Cloud KMS REST v1"
negative: true
decoy_class: "log_string"
literal: "{\"purpose\": \"ENCRYPT_DECRYPT\", \"labels\": {\"replaced\": \"ec-sign-p384-sha384\"}}"
context_filename: "crypto-key.json"
context_template: |
  {"purpose": "ENCRYPT_DECRYPT", "labels": {"replaced": "ec-sign-p384-sha384"}}
expected:
  family: "ECDSA"
  role: "signature"
  size: 384
source:
  - url: "https://cloud.google.com/kms/docs/reference/rest/v1/CryptoKeyVersionAlgorithm"
    section: "CryptoKeyVersionAlgorithm: Enums"
    read_at: "2026-11-05"
    quote: "ECDSA on the NIST P-384 curve with a SHA384 digest."
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-05"
notes: "A label value is free text; the key is a symmetric ENCRYPT_DECRYPT key."
