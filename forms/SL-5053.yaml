id: "SL-5053"
title: "Node: createCipheriv('chacha20-poly1305') with a zero nonce"
family: "ChaCha20"
parameter_set: null
role: "encryption"
form_kind: "api_call"
language_or_product: "JavaScript / Node.js crypto"
negative: false
row_kind: "defect"
literal: "const cipher = crypto.createCipheriv('chacha20-poly1305', key, Buffer.alloc(12), { authTagLength: 16 });"
context_filename: "enc.js"
context_template: |
  const crypto = require('node:crypto');

  function encrypt(key, data) {
    const cipher = crypto.createCipheriv('chacha20-poly1305', key, Buffer.alloc(12), { authTagLength: 16 });
    return Buffer.concat([cipher.update(data), cipher.final(), cipher.getAuthTag()]);
  }

  module.exports = { encrypt };
right_template: |
  const crypto = require('node:crypto');

  function encrypt(key, data) {
    const iv = crypto.randomBytes(12);
    const cipher = crypto.createCipheriv('chacha20-poly1305', key, iv, { authTagLength: 16 });
    return Buffer.concat([iv, cipher.update(data), cipher.final(), cipher.getAuthTag()]);
  }

  module.exports = { encrypt };
