id: "SL-6025"
title: "M2Crypto: EVP.pbkdf2 with a constant salt"
family: "PBKDF2"
parameter_set: null
role: "n.a."
form_kind: "api_call"
language_or_product: "Python / M2Crypto"
negative: false
row_kind: "defect"
literal: "return EVP.pbkdf2(password, b\"static-salt-1234\", 600000, 32)"
context_filename: "kdf.py"
context_template: |
  from M2Crypto import EVP


  def derive(password):
      return EVP.pbkdf2(password, b"static-salt-1234", 600000, 32)
right_template: |
  import os

  from M2Crypto import EVP


  def derive(password):
      salt = os.urandom(16)
      return salt, EVP.pbkdf2(password, salt, 600000, 32)
