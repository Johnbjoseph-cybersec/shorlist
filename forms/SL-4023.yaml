id: "SL-4023"
title: "JCA MessageDigest alias SHA1"
family: "SHA-1"
parameter_set: null
role: "hash"
form_kind: "api_string"
language_or_product: "Java / JCA"
negative: false
literal: "MessageDigest md = MessageDigest.getInstance(\"SHA1\");"
context_filename: "Digest.java"
context_template: |
  import java.security.MessageDigest;

  public class Digest {
      public static void main(String[] args) throws Exception {
          MessageDigest md = MessageDigest.getInstance("SHA1");
          System.out.println(md.getAlgorithm());
      }
  }
expected:
  family: "SHA-1"
  role: "hash"
  size: "undetermined"
weakness:
  status: "legacy_use"
  anchor: "OWASP ASVS 5.0.0, Appendix C, Hash Functions for General Use Cases: SHA-1 (L)"
  quote: "| SHA-1 | [RFC 3174](https://www.rfc-editor.org/info/rfc3174) & [RFC 6194](https://www.rfc-editor.org/info/rfc6194) | L | Not suitable for HMAC, KDF, RBG, digital signatures |"
source:
  - url: "https://github.com/openjdk/jdk/blob/jdk-25-ga/src/java.base/share/classes/sun/security/util/KnownOIDs.java"
    section: "KnownOIDs: SHA_1 and its aliases"
    read_at: "2026-11-06"
    quote: "SHA_1(\"1.3.14.3.2.26\", \"SHA-1\", \"SHA\", \"SHA1\"),"
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "SHA-1 status: the form does not pin the use. SP 800-131A Rev. 2 Table 8 rates SHA-1 by use (signature generation disallowed, verification legacy use, non-signature applications acceptable) and has no general statement; ASVS 5.0 Appendix C rates SHA-1 as a whole L (legacy), which is the status taken here. \"SHA1\" is an alias of SHA-1 in the JDK providers, not a standard name."
