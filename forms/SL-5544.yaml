right_template: |
  using System.Net;
  using System.Net.Security;

  public static class Tls
  {
      public static void Configure()
      {
          ServicePointManager.ServerCertificateValidationCallback = (sender, cert, chain, errors) => errors == SslPolicyErrors.None;
      }
  }
