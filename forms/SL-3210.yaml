id: "SL-3210"
title: "cert-manager Certificate spec.privateKey ECDSA size 384"
family: "ECDSA"
parameter_set: "P-384"
role: "signature"
form_kind: "config_value"
language_or_product: "cert-manager 1.21 / Certificate"
negative: false
literal: "    size: 384"
context_filename: "certificate.yaml"
context_template: |
  apiVersion: cert-manager.io/v1
  kind: Certificate
  metadata:
    name: web
  spec:
    secretName: web-tls
    dnsNames:
      - example.com
    issuerRef:
      name: ca-issuer
    privateKey:
      algorithm: ECDSA
      size: 384
expected:
  family: "ECDSA"
  role: "signature"
  size: 384
source:
  - url: "https://github.com/cert-manager/cert-manager/blob/v1.21.3/pkg/apis/certmanager/v1/types_certificate.go"
    section: "CertificatePrivateKey.Size"
    read_at: "2026-11-05"
    quote: "// If `algorithm` is set to `ECDSA`, valid values are `256`, `384` or `521`,"
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
