id: "SL-1192"
title: "Decoy: commented-out Apache Curves directive"
family: "ECDH"
parameter_set: "P-384"
role: "n.a."
form_kind: "config_value"
language_or_product: "Apache httpd mod_ssl"
negative: true
decoy_class: "comment"
literal: "    #SSLOpenSSLConfCmd Curves P-384"
context_filename: "httpd.conf"
context_template: |
  Listen 443
  <VirtualHost *:443>
      SSLEngine on
      SSLCertificateFile cert.pem
      SSLCertificateKeyFile key.pem
      #SSLOpenSSLConfCmd Curves P-384
  </VirtualHost>
