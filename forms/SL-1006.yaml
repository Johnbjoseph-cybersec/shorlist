id: "SL-1006"
title: "OpenSSL CLI: genpkey RSASSA-PSS alias"
family: "RSA"
cyclonedx_family: "RSASSA-PSS"
parameter_set: null
role: "signature"
form_kind: "cli"
language_or_product: "OpenSSL CLI"
negative: false
literal: "openssl genpkey -algorithm RSASSA-PSS -out key.pem"
context_filename: "genkey.sh"
context_template: |
  #!/bin/sh
  openssl genpkey -algorithm RSASSA-PSS -out key.pem
expected:
  family: "RSA"
  role: "signature"
  size: "undetermined"
source:
  - url: "https://github.com/openssl/openssl/blob/openssl-3.5.0/providers/implementations/include/prov/names.h"
    section: "providers/implementations/include/prov/names.h: PROV_NAMES_RSA_PSS"
    read_at: "2026-11-05"
    quote: "#define PROV_NAMES_RSA_PSS \"RSA-PSS:RSASSA-PSS:1.2.840.113549.1.1.10\""
  - url: "https://docs.openssl.org/3.5/man1/openssl-genpkey/"
    section: "OPTIONS: -algorithm alg"
    read_at: "2026-11-05"
    quote: "Engines or providers may add algorithms in addition to the standard built-in ones."
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
