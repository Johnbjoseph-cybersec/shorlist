id: "SL-4621"
title: "Decoy: commented-out openssl genrsa 1024"
family: "RSA"
parameter_set: "1024"
role: "n.a."
form_kind: "cli"
language_or_product: "OpenSSL CLI"
negative: true
decoy_class: "comment"
literal: "# openssl genrsa -out key.pem 1024   (old CA key, retired)"
context_filename: "genkey.sh"
context_template: |
  #!/bin/sh
  # openssl genrsa -out key.pem 1024   (old CA key, retired)
expected:
  family: "RSA"
  role: "undetermined"
  size: 1024
weakness:
  status: "disallowed"
  anchor: "NIST SP 800-131A Rev. 2, Section 3 (Table 2), digital signature generation"
  quote: "RSA: The length of the modulus n shall be 2048 bits or more to meet the minimum security-strength requirement of 112 bits for Federal Government use."
source:
  - url: "https://docs.openssl.org/3.5/man1/openssl-genrsa/"
    section: "OPTIONS: numbits"
    read_at: "2026-11-06"
    quote: "The size of the private key to generate in bits. This must be the last option specified."
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "The command is commented out; the script runs nothing."
