id: "SL-5543"
title: ".NET: HttpClientHandler.SslProtocols = SslProtocols.Tls"
family: "TLS"
parameter_set: null
role: "n.a."
form_kind: "api_call"
language_or_product: "C# / .NET System.Net.Http"
row_kind: "defect"
negative: false
literal: "handler.SslProtocols = SslProtocols.Tls;"
context_filename: "Http.cs"
context_template: |
  using System.Net.Http;
  using System.Security.Authentication;

  public static class Http
  {
      public static HttpClient Create()
      {
          var handler = new HttpClientHandler();
          handler.SslProtocols = SslProtocols.Tls;
          return new HttpClient(handler);
      }
  }
right_template: |
  using System.Net.Http;
  using System.Security.Authentication;

  public static class Http
  {
      public static HttpClient Create()
      {
          var handler = new HttpClientHandler();
          handler.SslProtocols = SslProtocols.Tls12 | SslProtocols.Tls13;
          return new HttpClient(handler);
      }
  }
