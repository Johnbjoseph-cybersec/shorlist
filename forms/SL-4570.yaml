id: "SL-4570"
title: "nginx: ssl_ciphers NULL-MD5 (MD5)"
family: "MD5"
parameter_set: null
role: "mac"
form_kind: "config_value"
language_or_product: "nginx"
negative: false
literal: "ssl_ciphers NULL-MD5;"
context_filename: "nginx.conf"
context_template: |
  events {}

  http {
      server {
          listen 443 ssl;
          ssl_certificate     cert.pem;
          ssl_certificate_key key.pem;
          ssl_protocols TLSv1.2;
          ssl_ciphers NULL-MD5;
      }
  }
expected:
  family: "MD5"
  role: "mac"
  size: "undetermined"
weakness:
  status: "deprecated"
  anchor: "RFC 6151, Section 2"
  quote: "since MD5 must not be used for digital signatures, new protocol designs should not employ HMAC-MD5."
source:
  - url: "https://nginx.org/en/docs/http/ngx_http_ssl_module.html"
    section: "ssl_ciphers"
    read_at: "2026-11-06"
    quote: "The ciphers are specified in the format understood by the OpenSSL library"
  - url: "https://docs.openssl.org/3.5/man1/openssl-ciphers/"
    section: "CIPHER SUITE NAMES"
    read_at: "2026-11-06"
    quote: "TLS_RSA_WITH_NULL_MD5 NULL-MD5"
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "The OpenSSL name NULL-MD5 is TLS_RSA_WITH_NULL_MD5; its key exchange and authentication are on the quantum axis, this row is scored on MD5. NULL encryption with an HMAC-MD5 MAC; scored on MD5. OpenSSL offers NULL suites only at security level 0. The certificate file names are placeholders and carry no algorithm."
