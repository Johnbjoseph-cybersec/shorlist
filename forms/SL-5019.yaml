id: "SL-5019"
title: "PyCryptodome: MODE_GCM with a constant nonce="
family: "AES"
parameter_set: null
role: "encryption"
form_kind: "api_call"
language_or_product: "Python / PyCryptodome"
negative: false
row_kind: "defect"
literal: "cipher = AES.new(key, AES.MODE_GCM, nonce=b\"\\x00\" * 12)"
context_filename: "enc.py"
context_template: |
  from Crypto.Cipher import AES


  def encrypt(key, data):
      cipher = AES.new(key, AES.MODE_GCM, nonce=b"\x00" * 12)
      ciphertext, tag = cipher.encrypt_and_digest(data)
      return cipher.nonce + ciphertext + tag
right_template: |
  from Crypto.Cipher import AES


  def encrypt(key, data):
      cipher = AES.new(key, AES.MODE_GCM)
      ciphertext, tag = cipher.encrypt_and_digest(data)
      return cipher.nonce + ciphertext + tag
