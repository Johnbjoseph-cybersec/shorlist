notes: "The literal names no algorithm: ECDSA is pinned by the product, whose only signer for this method checks the curve against secp256r1/secp384r1/secp521r1 and signs with ec.ECDSA. The curve is chosen by the key file, so the size is undetermined. The README spreads the call over three lines; the template has it on one."
