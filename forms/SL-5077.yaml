id: "SL-5077"
title: "OpenSSL: EVP_EncryptInit_ex with a hard-coded key"
family: "AES"
parameter_set: "AES-256"
role: "encryption"
form_kind: "api_call"
language_or_product: "C / OpenSSL EVP"
negative: false
row_kind: "defect"
literal: "EVP_EncryptInit_ex(ctx, EVP_aes_256_gcm(), NULL, (const unsigned char *)\"0123456789abcdef0123456789abcdef\", out);"
context_filename: "enc.c"
context_template: |
  #include <openssl/evp.h>
  #include <openssl/rand.h>

  int encrypt(const unsigned char *in, int inlen, unsigned char *out)
  {
      EVP_CIPHER_CTX *ctx = EVP_CIPHER_CTX_new();
      int len = 0, total = 12;

      if (ctx == NULL)
          return -1;
      if (RAND_bytes(out, 12) != 1) {
          EVP_CIPHER_CTX_free(ctx);
          return -1;
      }
      EVP_EncryptInit_ex(ctx, EVP_aes_256_gcm(), NULL, (const unsigned char *)"0123456789abcdef0123456789abcdef", out);
      EVP_EncryptUpdate(ctx, out + total, &len, in, inlen);
      total += len;
      EVP_EncryptFinal_ex(ctx, out + total, &len);
      total += len;
      EVP_CIPHER_CTX_ctrl(ctx, EVP_CTRL_AEAD_GET_TAG, 16, out + total);
      total += 16;
      EVP_CIPHER_CTX_free(ctx);
      return total;
  }
right_template: |
  #include <openssl/evp.h>
  #include <openssl/rand.h>

  int encrypt(const unsigned char *key, const unsigned char *in, int inlen, unsigned char *out)
  {
      EVP_CIPHER_CTX *ctx = EVP_CIPHER_CTX_new();
      int len = 0, total = 12;

      if (ctx == NULL)
          return -1;
      if (RAND_bytes(out, 12) != 1) {
          EVP_CIPHER_CTX_free(ctx);
          return -1;
      }
      EVP_EncryptInit_ex(ctx, EVP_aes_256_gcm(), NULL, key, out);
      EVP_EncryptUpdate(ctx, out + total, &len, in, inlen);
      total += len;
      EVP_EncryptFinal_ex(ctx, out + total, &len);
      total += len;
      EVP_CIPHER_CTX_ctrl(ctx, EVP_CTRL_AEAD_GET_TAG, 16, out + total);
      total += 16;
      EVP_CIPHER_CTX_free(ctx);
      return total;
  }
expected:
  family: "AES"
  role: "encryption"
  size: 256
defect:
  cwe: "CWE-321"
source:
  - url: "https://cwe.mitre.org/data/definitions/321.html"
    section: "CWE-321 Use of Hard-coded Cryptographic Key: Description"
    read_at: "2026-11-06"
    quote: "The product uses a hard-coded, unchangeable cryptographic key."
  - url: "https://docs.openssl.org/3.5/man3/EVP_EncryptInit/"
    section: "EVP_EncryptInit_ex: SYNOPSIS"
    read_at: "2026-11-06"
    quote: "int EVP_EncryptInit_ex(EVP_CIPHER_CTX *ctx, const EVP_CIPHER *type, ENGINE *impl, const unsigned char *key, const unsigned char *iv);"
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "The fixed file takes the key as a parameter; where it comes from is outside the file."
