id: "SL-5506"
title: "Node.js crypto: publicEncrypt with padding crypto.constants.RSA_NO_PADDING"
family: "RSA"
parameter_set: null
role: "encryption"
form_kind: "api_call"
language_or_product: "JavaScript / Node.js crypto"
row_kind: "defect"
negative: false
literal: "return crypto.publicEncrypt({ key: publicKey, padding: crypto.constants.RSA_NO_PADDING }, data);"
context_filename: "wrap.js"
context_template: |
  const crypto = require('crypto');

  function wrap(publicKey, data) {
    return crypto.publicEncrypt({ key: publicKey, padding: crypto.constants.RSA_NO_PADDING }, data);
  }

  module.exports = { wrap };
right_template: |
  const crypto = require('crypto');

  function wrap(publicKey, data) {
    return crypto.publicEncrypt({ key: publicKey, padding: crypto.constants.RSA_PKCS1_OAEP_PADDING, oaepHash: 'sha256' }, data);
  }

  module.exports = { wrap };
expected:
  family: "RSA"
  role: "encryption"
  size: "undetermined"
defect:
  cwe: "CWE-780"
source:
  - url: "https://cwe.mitre.org/data/definitions/780.html"
    section: "CWE-780, Description"
    read_at: "2026-11-06"
    quote: "The product uses the RSA algorithm but does not incorporate Optimal Asymmetric Encryption Padding (OAEP)."
  - url: "https://www.rfc-editor.org/rfc/rfc8017.txt"
    section: "RFC 8017, Section 7 (Encryption Schemes)"
    read_at: "2026-11-06"
    quote: "RSAES-OAEP is REQUIRED to be supported for new applications; RSAES-PKCS1-v1_5 is included only for compatibility with existing applications."
  - url: "https://nodejs.org/api/crypto.html"
    section: "crypto.publicEncrypt(key, buffer)"
    read_at: "2026-11-06"
    quote: "padding <crypto.constants> An optional padding value defined in crypto.constants, which may be: crypto.constants.RSA_NO_PADDING, crypto.constants.RSA_PKCS1_PADDING, or crypto.constants.RSA_PKCS1_OAEP_PADDING."
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
