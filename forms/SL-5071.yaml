id: "SL-5071"
title: ".NET: System.Random.NextBytes for a key"
family: "RNG"
parameter_set: null
role: "n.a."
form_kind: "api_call"
language_or_product: "C# / .NET"
negative: false
row_kind: "defect"
literal: "new Random().NextBytes(key);"
context_filename: "Keys.cs"
context_template: |
  using System;

  static class Keys
  {
      public static byte[] NewKey()
      {
          byte[] key = new byte[32];
          new Random().NextBytes(key);
          return key;
      }
  }
right_template: |
  using System.Security.Cryptography;

  static class Keys
  {
      public static byte[] NewKey()
      {
          byte[] key = new byte[32];
          RandomNumberGenerator.Fill(key);
          return key;
      }
  }
