title: "MicroPython: cryptolib.aes(key, 1) (ECB)"
family: "AES"
parameter_set: null
role: "encryption"
form_kind: "api_call"
language_or_product: "Python / MicroPython cryptolib"
negative: false
row_kind: "defect"
literal: "cipher = cryptolib.aes(key, 1)"
context_filename: "enc.py"
context_template: |
  import cryptolib


  def encrypt(key, padded):
      cipher = cryptolib.aes(key, 1)
      return cipher.encrypt(padded)
right_template: |
  import os

  import cryptolib


  def encrypt(key, padded):
      iv = os.urandom(16)
      cipher = cryptolib.aes(key, 2, iv)
      return iv + cipher.encrypt(padded)
