id: "SL-6021"
title: "MicroPython: cryptolib.aes with a hard-coded key"
family: "AES"
parameter_set: null
role: "encryption"
form_kind: "api_call"
language_or_product: "Python / MicroPython cryptolib"
negative: false
row_kind: "defect"
literal: "cipher = cryptolib.aes(b\"0123456789abcdef\", 2, iv)"
context_filename: "enc.py"
context_template: |
  import os

  import cryptolib


  def encrypt(padded):
      iv = os.urandom(16)
      cipher = cryptolib.aes(b"0123456789abcdef", 2, iv)
      return iv + cipher.encrypt(padded)
right_template: |
  import os

  import cryptolib


  def encrypt(key, padded):
      iv = os.urandom(16)
      cipher = cryptolib.aes(key, 2, iv)
      return iv + cipher.encrypt(padded)
