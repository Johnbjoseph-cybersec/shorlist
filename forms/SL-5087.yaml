id: "SL-5087"
title: "Decoy: Java log string naming AES/ECB/PKCS5Padding"
family: "AES"
parameter_set: null
role: "n.a."
form_kind: "api_string"
language_or_product: "Java / JCA"
negative: true
decoy_class: "log_string"
row_kind: "defect"
literal: "LOG.warning(\"Cipher transformation AES/ECB/PKCS5Padding rejected by policy\");"
context_filename: "Policy.java"
context_template: |
  import java.util.logging.Logger;

  public class Policy {
      private static final Logger LOG = Logger.getLogger("crypto");

      static boolean allowed(String transformation) {
          if (transformation.contains("/ECB/")) {
              LOG.warning("Cipher transformation AES/ECB/PKCS5Padding rejected by policy");
              return false;
          }
          return true;
      }
  }
