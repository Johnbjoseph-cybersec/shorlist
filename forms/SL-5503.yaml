id: "SL-5503"
title: "PyCryptodome: RSA encryption with PKCS1_v1_5.new(rsa_key)"
family: "RSA"
cyclonedx_family: "RSAES-PKCS1"
parameter_set: null
role: "encryption"
form_kind: "api_call"
language_or_product: "Python / PyCryptodome"
row_kind: "defect"
negative: false
literal: "cipher = PKCS1_v1_5.new(rsa_key)"
context_filename: "wrap.py"
context_template: |
  from Crypto.Cipher import PKCS1_v1_5
  from Crypto.PublicKey import RSA


  def wrap(pubkey_der, session_key):
      rsa_key = RSA.import_key(pubkey_der)
      cipher = PKCS1_v1_5.new(rsa_key)
      return cipher.encrypt(session_key)
right_template: |
  from Crypto.Cipher import PKCS1_OAEP
  from Crypto.PublicKey import RSA


  def wrap(pubkey_der, session_key):
      rsa_key = RSA.import_key(pubkey_der)
      cipher = PKCS1_OAEP.new(rsa_key)
      return cipher.encrypt(session_key)
