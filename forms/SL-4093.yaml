id: "SL-4093"
title: "OpenSSL low-level SHA1_Init()"
family: "SHA-1"
parameter_set: null
role: "hash"
form_kind: "api_call"
language_or_product: "C / OpenSSL 3.5"
negative: false
literal: "SHA1_Init(&c);"
context_filename: "fp.c"
context_template: |
  #include <openssl/sha.h>

  int main(void)
  {
      SHA_CTX c;
      SHA1_Init(&c);
      return 0;
  }
expected:
  family: "SHA-1"
  role: "hash"
  size: "undetermined"
weakness:
  status: "legacy_use"
  anchor: "OWASP ASVS 5.0.0, Appendix C, Hash Functions for General Use Cases: SHA-1 (L)"
  quote: "| SHA-1 | [RFC 3174](https://www.rfc-editor.org/info/rfc3174) & [RFC 6194](https://www.rfc-editor.org/info/rfc6194) | L | Not suitable for HMAC, KDF, RBG, digital signatures |"
source:
  - url: "https://docs.openssl.org/3.5/man3/SHA256_Init/"
    section: "SYNOPSIS (deprecated since OpenSSL 3.0)"
    read_at: "2026-11-06"
    quote: "int SHA1_Init(SHA_CTX *c);"
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "SHA-1 status: the form does not pin the use. SP 800-131A Rev. 2 Table 8 rates SHA-1 by use (signature generation disallowed, verification legacy use, non-signature applications acceptable) and has no general statement; ASVS 5.0 Appendix C rates SHA-1 as a whole L (legacy), which is the status taken here. Deprecated low-level API; it still compiles against OpenSSL 3.5 headers with a deprecation warning."
