context_filename: "fetch.py"
context_template: |
  import ssl
  import urllib.request


  def fetch(url):
      ctx = ssl._create_unverified_context()
      return urllib.request.urlopen(url, context=ctx).read()
right_template: |
  import ssl
  import urllib.request


  def fetch(url):
      ctx = ssl.create_default_context()
      return urllib.request.urlopen(url, context=ctx).read()
