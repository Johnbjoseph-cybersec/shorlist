id: "SL-5074"
title: "OpenSSL: EVP_aes_256_ctr() with a constant counter block"
family: "AES"
parameter_set: "AES-256"
role: "encryption"
form_kind: "api_call"
language_or_product: "C / OpenSSL EVP"
negative: false
row_kind: "defect"
literal: "EVP_EncryptInit_ex(ctx, EVP_aes_256_ctr(), NULL, key, (const unsigned char *)\"fixed-counter-01\");"
context_filename: "enc.c"
context_template: |
  #include <openssl/evp.h>

  int encrypt(const unsigned char *key, const unsigned char *in, int inlen, unsigned char *out)
  {
      EVP_CIPHER_CTX *ctx = EVP_CIPHER_CTX_new();
      int len = 0, total = 0;

      if (ctx == NULL)
          return -1;
      EVP_EncryptInit_ex(ctx, EVP_aes_256_ctr(), NULL, key, (const unsigned char *)"fixed-counter-01");
      EVP_EncryptUpdate(ctx, out + total, &len, in, inlen);
      total += len;
      EVP_EncryptFinal_ex(ctx, out + total, &len);
      total += len;
      EVP_CIPHER_CTX_free(ctx);
      return total;
  }
right_template: |
  #include <openssl/evp.h>
  #include <openssl/rand.h>

  int encrypt(const unsigned char *key, const unsigned char *in, int inlen, unsigned char *out)
  {
      EVP_CIPHER_CTX *ctx = EVP_CIPHER_CTX_new();
      int len = 0, total = 16;

      if (ctx == NULL)
          return -1;
      if (RAND_bytes(out, 16) != 1) {
          EVP_CIPHER_CTX_free(ctx);
          return -1;
      }
      EVP_EncryptInit_ex(ctx, EVP_aes_256_ctr(), NULL, key, out);
      EVP_EncryptUpdate(ctx, out + total, &len, in, inlen);
      total += len;
      EVP_EncryptFinal_ex(ctx, out + total, &len);
      total += len;
      EVP_CIPHER_CTX_free(ctx);
      return total;
  }
expected:
  family: "AES"
  role: "encryption"
  size: 256
defect:
  cwe: "CWE-1204"
source:
  - url: "https://cwe.mitre.org/data/definitions/1204.html"
    section: "CWE-1204 Generation of Weak Initialization Vector (IV): Description"
    read_at: "2026-11-06"
    quote: "The product uses a cryptographic primitive that uses an Initialization Vector (IV), but the product does not generate IVs that are sufficiently unpredictable or unique according to the expected cryptographic requirements for that primitive."
  - url: "https://docs.openssl.org/3.5/man3/EVP_aes_128_gcm/"
    section: "EVP_aes_128_gcm: DESCRIPTION"
    read_at: "2026-11-06"
    quote: "EVP_aes_128_ctr(), EVP_aes_192_ctr(), EVP_aes_256_ctr()"
  - url: "https://docs.openssl.org/3.5/man3/EVP_EncryptInit/"
    section: "EVP_EncryptInit_ex: SYNOPSIS"
    read_at: "2026-11-06"
    quote: "int EVP_EncryptInit_ex(EVP_CIPHER_CTX *ctx, const EVP_CIPHER *type, ENGINE *impl, const unsigned char *key, const unsigned char *iv);"
  - url: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-38a.pdf"
    section: "NIST SP 800-38A, Section 6.5 The Counter Mode"
    read_at: "2026-11-06"
    quote: "across all of the messages that are encrypted under the given key, all of the counters must be distinct."
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "CTR counter block constant: CWE-1204 (IV not unique as the primitive requires) is taken; CWE-323 (nonce reuse) would be the runner-up."
