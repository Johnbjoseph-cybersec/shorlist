id: "SL-5017"
title: "PyCryptodome: MODE_CBC with a constant iv="
family: "AES"
parameter_set: null
role: "encryption"
form_kind: "api_call"
language_or_product: "Python / PyCryptodome"
negative: false
row_kind: "defect"
literal: "cipher = AES.new(key, AES.MODE_CBC, iv=b\"0123456789abcdef\")"
context_filename: "enc.py"
context_template: |
  from Crypto.Cipher import AES
  from Crypto.Util.Padding import pad


  def encrypt(key, data):
      cipher = AES.new(key, AES.MODE_CBC, iv=b"0123456789abcdef")
      return cipher.encrypt(pad(data, AES.block_size))
right_template: |
  from Crypto.Cipher import AES
  from Crypto.Util.Padding import pad


  def encrypt(key, data):
      cipher = AES.new(key, AES.MODE_CBC)
      return cipher.iv + cipher.encrypt(pad(data, AES.block_size))
expected:
  family: "AES"
  role: "encryption"
  size: "undetermined"
defect:
  cwe: "CWE-329"
source:
