id: "SL-5526"
title: "Java JCA: ECPrivateKeySpec with a private scalar in the source"
family: "EC"
parameter_set: "P-256"
role: "both"
form_kind: "api_call"
language_or_product: "Java / JCA"
row_kind: "defect"
negative: false
literal: "ECPrivateKeySpec spec = new ECPrivateKeySpec(new BigInteger(\"1b6e8a5c03f74d9e1b2a5f3a9c0e7b214d86a1c4e93f0b72d5168e4a07c3f9d2\", 16), params);"
context_filename: "Main.java"
context_template: |
  import java.math.BigInteger;
  import java.security.AlgorithmParameters;
  import java.security.KeyFactory;
  import java.security.PrivateKey;
  import java.security.spec.ECGenParameterSpec;
  import java.security.spec.ECParameterSpec;
  import java.security.spec.ECPrivateKeySpec;

  public class Main {
      static PrivateKey load() throws Exception {
          AlgorithmParameters ap = AlgorithmParameters.getInstance("EC");
          ap.init(new ECGenParameterSpec("secp256r1"));
          ECParameterSpec params = ap.getParameterSpec(ECParameterSpec.class);
          ECPrivateKeySpec spec = new ECPrivateKeySpec(new BigInteger("1b6e8a5c03f74d9e1b2a5f3a9c0e7b214d86a1c4e93f0b72d5168e4a07c3f9d2", 16), params);
          return KeyFactory.getInstance("EC").generatePrivate(spec);
      }
  }
right_template: |
  import java.nio.file.Files;
  import java.nio.file.Path;
  import java.security.KeyFactory;
  import java.security.PrivateKey;
  import java.security.spec.PKCS8EncodedKeySpec;

  public class Main {
      static PrivateKey load() throws Exception {
          byte[] der = Files.readAllBytes(Path.of(System.getenv("EC_KEY_FILE")));
          return KeyFactory.getInstance("EC").generatePrivate(new PKCS8EncodedKeySpec(der));
      }
  }
