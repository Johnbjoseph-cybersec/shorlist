id: "SL-5030"
title: "JCA: SecretKeySpec from a string literal"
family: "AES"
parameter_set: null
role: "encryption"
form_kind: "api_call"
language_or_product: "Java / JCA"
negative: false
row_kind: "defect"
literal: "SecretKeySpec key = new SecretKeySpec(\"0123456789abcdef\".getBytes(StandardCharsets.UTF_8), \"AES\");"
context_filename: "Enc.java"
context_template: |
  import java.nio.charset.StandardCharsets;
  import java.security.SecureRandom;
  import javax.crypto.Cipher;
  import javax.crypto.spec.GCMParameterSpec;
  import javax.crypto.spec.SecretKeySpec;

  public class Enc {
      static byte[][] encrypt(byte[] data) throws Exception {
          SecretKeySpec key = new SecretKeySpec("0123456789abcdef".getBytes(StandardCharsets.UTF_8), "AES");
          byte[] iv = new byte[12];
          new SecureRandom().nextBytes(iv);
          Cipher c = Cipher.getInstance("AES/GCM/NoPadding");
          c.init(Cipher.ENCRYPT_MODE, key, new GCMParameterSpec(128, iv));
          return new byte[][] {iv, c.doFinal(data)};
      }
  }
right_template: |
  import java.security.SecureRandom;
  import java.util.Base64;
  import javax.crypto.Cipher;
  import javax.crypto.spec.GCMParameterSpec;
  import javax.crypto.spec.SecretKeySpec;

  public class Enc {
      static byte[][] encrypt(byte[] data) throws Exception {
          SecretKeySpec key = new SecretKeySpec(Base64.getDecoder().decode(System.getenv("DATA_KEY")), "AES");
          byte[] iv = new byte[12];
          new SecureRandom().nextBytes(iv);
          Cipher c = Cipher.getInstance("AES/GCM/NoPadding");
          c.init(Cipher.ENCRYPT_MODE, key, new GCMParameterSpec(128, iv));
          return new byte[][] {iv, c.doFinal(data)};
      }
  }
expected:
