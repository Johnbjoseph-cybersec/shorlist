id: "SL-5020"
title: "PyCryptodome: ChaCha20_Poly1305 with a constant nonce"
family: "ChaCha20"
parameter_set: null
role: "encryption"
form_kind: "api_call"
language_or_product: "Python / PyCryptodome"
negative: false
row_kind: "defect"
literal: "cipher = ChaCha20_Poly1305.new(key=key, nonce=b\"\\x00\" * 12)"
context_filename: "enc.py"
context_template: |
  from Crypto.Cipher import ChaCha20_Poly1305


  def encrypt(key, data):
      cipher = ChaCha20_Poly1305.new(key=key, nonce=b"\x00" * 12)
      ciphertext, tag = cipher.encrypt_and_digest(data)
      return cipher.nonce + ciphertext + tag
right_template: |
  from Crypto.Cipher import ChaCha20_Poly1305


  def encrypt(key, data):
      cipher = ChaCha20_Poly1305.new(key=key)
      ciphertext, tag = cipher.encrypt_and_digest(data)
      return cipher.nonce + ciphertext + tag
