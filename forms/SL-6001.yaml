id: "SL-6001"
title: "JCA: PBEParameterSpec with a constant salt"
family: "PBKDF2"
parameter_set: null
role: "n.a."
form_kind: "api_call"
language_or_product: "Java / JCA"
negative: false
row_kind: "defect"
literal: "c.init(Cipher.ENCRYPT_MODE, pbeKey, new PBEParameterSpec(\"static-salt-1234\".getBytes(StandardCharsets.UTF_8), 600000));"
context_filename: "Pbe.java"
context_template: |
  import java.nio.charset.StandardCharsets;
  import javax.crypto.Cipher;
  import javax.crypto.SecretKey;
  import javax.crypto.spec.PBEParameterSpec;

  public class Pbe {
      static byte[] encrypt(SecretKey pbeKey, byte[] data) throws Exception {
          Cipher c = Cipher.getInstance("PBEWithHmacSHA256AndAES_256");
          c.init(Cipher.ENCRYPT_MODE, pbeKey, new PBEParameterSpec("static-salt-1234".getBytes(StandardCharsets.UTF_8), 600000));
          return c.doFinal(data);
      }
  }
right_template: |
  import java.security.SecureRandom;
  import javax.crypto.Cipher;
  import javax.crypto.SecretKey;
  import javax.crypto.spec.PBEParameterSpec;

  public class Pbe {
      static byte[][] encrypt(SecretKey pbeKey, byte[] data) throws Exception {
          Cipher c = Cipher.getInstance("PBEWithHmacSHA256AndAES_256");
          byte[] salt = new byte[16];
          new SecureRandom().nextBytes(salt);
          c.init(Cipher.ENCRYPT_MODE, pbeKey, new PBEParameterSpec(salt, 600000));
          return new byte[][] {salt, c.getIV(), c.doFinal(data)};
      }
  }
