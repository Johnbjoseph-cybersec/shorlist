notes: "PBEParameterSpec, not PBEKeySpec (SL-5032): the salt reaches the PBES2 cipher through Cipher.init. Family PBKDF2 because PBEWith<prf>And<encryption> derives the key with PBKDF2 (PKCS #5 PBES2). The fixed file draws a 16-byte salt from SecureRandom and returns it with the IV."
