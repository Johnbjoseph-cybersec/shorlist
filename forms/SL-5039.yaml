id: "SL-5039"
title: "Go: cipher.NewCTR with a zero counter block"
family: "AES"
parameter_set: null
role: "encryption"
form_kind: "api_call"
language_or_product: "Go / stdlib"
negative: false
row_kind: "defect"
literal: "stream := cipher.NewCTR(block, make([]byte, aes.BlockSize))"
context_filename: "enc.go"
context_template: |
  package crypt

  import (
  	"crypto/aes"
  	"crypto/cipher"
  )

  func Encrypt(key, data []byte) ([]byte, error) {
  	block, err := aes.NewCipher(key)
  	if err != nil {
  		return nil, err
  	}
  	out := make([]byte, len(data))
  	stream := cipher.NewCTR(block, make([]byte, aes.BlockSize))
  	stream.XORKeyStream(out, data)
  	return out, nil
  }
right_template: |
  package crypt

  import (
  	"crypto/aes"
  	"crypto/cipher"
  	"crypto/rand"
  )

  func Encrypt(key, data []byte) ([]byte, error) {
  	block, err := aes.NewCipher(key)
  	if err != nil {
  		return nil, err
  	}
  	out := make([]byte, aes.BlockSize+len(data))
  	iv := out[:aes.BlockSize]
  	rand.Read(iv)
  	stream := cipher.NewCTR(block, iv)
  	stream.XORKeyStream(out[aes.BlockSize:], data)
  	return out, nil
  }
expected:
  family: "AES"
  role: "encryption"
  size: "undetermined"
defect:
  cwe: "CWE-1204"
  taxonomy:
    - "Go detectors study (Andersson & Monperrus): Static or predictable IV"
source:
  - url: "https://cwe.mitre.org/data/definitions/1204.html"
    section: "CWE-1204 Generation of Weak Initialization Vector (IV): Description"
    read_at: "2026-11-06"
    quote: "The product uses a cryptographic primitive that uses an Initialization Vector (IV), but the product does not generate IVs that are sufficiently unpredictable or unique according to the expected cryptographic requirements for that primitive."
  - url: "https://github.com/golang/go/blob/go1.25.0/src/crypto/cipher/ctr.go"
    section: "crypto/cipher: NewCTR"
    read_at: "2026-11-06"
    quote: "NewCTR returns a [Stream] which encrypts/decrypts using the given [Block] in"
  - url: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-38a.pdf"
    section: "NIST SP 800-38A, Section 6.5 The Counter Mode"
    read_at: "2026-11-06"
    quote: "across all of the messages that are encrypted under the given key, all of the counters must be distinct."
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "CTR counter block constant: CWE-1204 (IV not unique as the primitive requires) is taken; CWE-323 (nonce reuse) would be the runner-up."
