id: "SL-3118"
title: "Decoy: Cloud KMS algorithm name in google_kms_crypto_key labels"
family: "RSA"
cyclonedx_family: "RSASSA-PKCS1"
parameter_set: "2048"
role: "n.a."
form_kind: "config_value"
language_or_product: "Terraform / hashicorp/google 8.10"
negative: true
decoy_class: "log_string"
literal: "    replaced_algorithm = \"rsa-sign-pkcs1-2048-sha256\""
context_filename: "main.tf"
context_template: |
  resource "google_kms_crypto_key" "key" {
    name     = "data-key"
    key_ring = "projects/example/locations/global/keyRings/app"

    labels = {
      replaced_algorithm = "rsa-sign-pkcs1-2048-sha256"
    }
  }
expected:
  family: "RSA"
  role: "undetermined"
  size: 2048
source:
  - url: "https://cloud.google.com/sdk/gcloud/reference/kms/keys/create"
    section: "Flags: --default-algorithm"
    read_at: "2026-11-05"
    quote: "rsa-sign-pkcs1-2048-sha256,"
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-05"
notes: "A label value is free text; the key has the default purpose ENCRYPT_DECRYPT (symmetric)."
