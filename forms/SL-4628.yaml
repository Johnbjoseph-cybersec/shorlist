id: "SL-4628"
title: "keytool: RSA key pair, -keysize 1024"
family: "RSA"
parameter_set: "1024"
role: "both"
form_kind: "cli"
language_or_product: "Java / keytool (JDK 24)"
negative: false
literal: "keytool -keystore ks -storepass changeit -genkeypair -alias server -keyalg RSA -keysize 1024 -dname CN=server"
context_filename: "keystore.sh"
context_template: |
  #!/bin/sh
  keytool -keystore ks -storepass changeit -genkeypair -alias server -keyalg RSA -keysize 1024 -dname CN=server
expected:
  family: "RSA"
  role: "undetermined"
  size: 1024
weakness:
  status: "disallowed"
  anchor: "NIST SP 800-131A Rev. 2, Section 3 (Table 2), digital signature generation"
  quote: "RSA: The length of the modulus n shall be 2048 bits or more to meet the minimum security-strength requirement of 112 bits for Federal Government use."
source:
  - url: "https://docs.oracle.com/en/java/javase/24/docs/specs/man/keytool.html"
    section: "keytool(1) JDK 24, -genkeypair: -keysize"
    read_at: "2026-11-06"
    quote: "The -keysize value specifies the size of each key to be generated."
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "keytool warns that the key is a security risk and generates it."
