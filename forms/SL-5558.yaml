id: "SL-5558"
title: "Decoy: CI shell check that fails on curl --insecure"
family: "TLS"
parameter_set: null
role: "n.a."
form_kind: "cli"
language_or_product: "curl"
row_kind: "defect"
negative: true
decoy_class: "ban_list"
literal: "if grep -rn -- '--insecure' scripts/; then exit 1; fi"
context_filename: "check.sh"
context_template: |
  #!/bin/sh
  # fail the build if any script turns off curl certificate checks
  if grep -rn -- '--insecure' scripts/; then exit 1; fi
