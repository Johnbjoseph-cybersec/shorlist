id: "SL-4612"
title: "OpenSSL CLI: genrsa, 512-bit RSA key"
family: "RSA"
parameter_set: "512"
role: "both"
form_kind: "cli"
language_or_product: "OpenSSL CLI"
negative: false
literal: "openssl genrsa -out key.pem 512"
context_filename: "genkey.sh"
context_template: |
  #!/bin/sh
  openssl genrsa -out key.pem 512
expected:
  family: "RSA"
  role: "undetermined"
  size: 512
weakness:
  status: "disallowed"
  anchor: "NIST SP 800-131A Rev. 2, Section 3 (Table 2), digital signature generation"
  quote: "RSA: The length of the modulus n shall be 2048 bits or more to meet the minimum security-strength requirement of 112 bits for Federal Government use."
source:
  - url: "https://docs.openssl.org/3.5/man1/openssl-genrsa/"
    section: "OPTIONS: numbits"
    read_at: "2026-11-06"
    quote: "The default is 2048 and values less than 512 are not allowed."
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "512 is the smallest size genrsa accepts."
