notes: "The body is real test material, published on purpose and used nowhere: the P-256 public key of a throwaway key as SubjectPublicKeyInfo (`openssl ec -pubout`), relabelled: pem.h defines this label but OpenSSL 3 neither writes nor reads it; made by tools/make_test_keys.sh (README, \"Test keys\"). expected.size stays undetermined: the literal is the label, which does not pin a size."
