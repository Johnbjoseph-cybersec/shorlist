literal: "const DENIED_CIPHERS = new Set(['aes-128-ecb', 'aes-256-ecb']);"
context_filename: "policy.js"
context_template: |
  const DENIED_CIPHERS = new Set(['aes-128-ecb', 'aes-256-ecb']);

  function allowed(name) {
    return !DENIED_CIPHERS.has(name.toLowerCase());
  }

  module.exports = { allowed };
