id: "SL-6514"
title: "Java Bouncy Castle JSSE: jdk.tls.namedGroups=MLKEM512"
family: "ML-KEM"
parameter_set: "ML-KEM-512"
role: "key_establishment"
form_kind: "cli"
language_or_product: "Java / Bouncy Castle JSSE 1.86"
negative: false
literal: "java -Djdk.tls.namedGroups=\"MLKEM512\" -jar app.jar"
context_filename: "run.sh"
context_template: |
  #!/bin/sh
  java -Djdk.tls.namedGroups="MLKEM512" -jar app.jar
expected:
  family: "ML-KEM"
