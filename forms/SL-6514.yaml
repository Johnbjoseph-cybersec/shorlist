  size: "undetermined"
source:
  - url: "https://arxiv.org/pdf/2605.17955"
    section: "Section V-C2, Hybrid PQC at the API gateway layer, Listing 1"
    read_at: "2026-11-06"
    quote: "X25519MLKEM768 or MLKEM512 key exchange groups"
  - url: "https://github.com/bcgit/bc-java/blob/r1rv86/tls/src/main/java/org/bouncycastle/jsse/provider/NamedGroupInfo.java"
    section: "NamedGroupInfo: PROPERTY_NAMED_GROUPS and the note on pure ML-KEM groups"
    read_at: "2026-11-06"
    quote: "private static final String PROPERTY_NAMED_GROUPS = \"jdk.tls.namedGroups\";"
  - url: "https://github.com/bcgit/bc-java/blob/r1rv86/tls/src/main/java/org/bouncycastle/tls/NamedGroup.java"
    section: "NamedGroup.getName"
    read_at: "2026-11-06"
    quote: "return \"MLKEM512\";"
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "Pure ML-KEM group, offered by BCJSSE only when named. The JDK's own JSSE (JDK 24) lists no ML-KEM group; the name is resolved by the BCJSSE provider the paper registers. app.jar is a placeholder."
