id: "SL-6024"
title: "M2Crypto: EVP.Cipher key_as_bytes=1 (default salt, one MD5 round)"
family: "AES"
parameter_set: null
role: "encryption"
form_kind: "api_call"
language_or_product: "Python / M2Crypto"
negative: false
row_kind: "defect"
literal: "c = EVP.Cipher(\"aes_128_cbc\", password, iv, 1, key_as_bytes=1)"
context_filename: "enc.py"
context_template: |
  from M2Crypto import EVP


  def encrypt(password, iv, data):
      c = EVP.Cipher("aes_128_cbc", password, iv, 1, key_as_bytes=1)
      return c.update(data) + c.final()
right_template: |
  from M2Crypto import EVP


  def encrypt(key, iv, data):
      c = EVP.Cipher("aes_128_cbc", key, iv, 1)
      return c.update(data) + c.final()
expected:
  family: "AES"
  role: "encryption"
  size: "undetermined"
defect:
  cwe: "CWE-916"
  taxonomy:
    - "LICMA: §5"
    - "LICMA: §4"
source:
  - url: "https://cwe.mitre.org/data/definitions/916.html"
    section: "CWE-916 Use of Password Hash With Insufficient Computational Effort: Description"
    read_at: "2026-11-06"
    quote: "The product generates a hash for a password, but it uses a scheme that does not provide a sufficient level of computational effort that would make password cracking attacks infeasible or expensive."
  - url: "https://arxiv.org/pdf/2109.01109"
    section: "Wickert et al. (LICMA), Table 1, rule §5"
    read_at: "2026-11-06"
    quote: "Do not use fewer than 1,000 iterations for PBE."
  - url: "https://arxiv.org/pdf/2109.01109"
    section: "Wickert et al. (LICMA), Section 3.2 Implementation"
    read_at: "2026-11-06"
    quote: "For Python, we cover 5 different crypto modules: cryptography, M2Crypto, PyCrypto, PyNaCl, ucryptolib."
  - url: "https://m2crypto.readthedocs.io/en/latest/M2Crypto.html"
    section: "M2Crypto.EVP.Cipher"
    read_at: "2026-11-06"
    quote: "class M2Crypto.EVP.Cipher(alg: str, key: bytes, iv: bytes, op: int, key_as_bytes: int = 0, d: str = 'md5', salt: bytes = b'12345678', i: int = 1, padding: int = 1)[source]"
  - url: "https://gitlab.com/m2crypto/m2crypto/-/blob/0.46.2/src/M2Crypto/EVP.py"
    section: "M2Crypto/EVP.py: class Cipher.__init__"
    read_at: "2026-11-06"
    quote: "key = m2.bytes_to_key(self.cipher, kmd(), key, salt, iv, i)"
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "With key_as_bytes=1 the key is derived by OpenSSL EVP_BytesToKey with the signature defaults d='md5', salt=b'12345678', i=1: one MD5 round over a constant salt. CWE-916 is taken (the work factor); CWE-760 (constant salt) is the runner-up. The fixed file passes a key, not a password."
