id: "SL-5036"
title: "SecureRandom.setSeed(constant) before first use"
family: "RNG"
parameter_set: null
role: "n.a."
form_kind: "api_call"
language_or_product: "Java / JCA"
negative: false
row_kind: "defect"
literal: "rng.setSeed(42L);"
context_filename: "Keys.java"
context_template: |
  import java.security.SecureRandom;

  public class Keys {
      static byte[] newKey() throws Exception {
          SecureRandom rng = SecureRandom.getInstance("DRBG");
          rng.setSeed(42L);
          byte[] key = new byte[32];
          rng.nextBytes(key);
          return key;
      }
  }
right_template: |
  import java.security.SecureRandom;

  public class Keys {
      static byte[] newKey() throws Exception {
          SecureRandom rng = SecureRandom.getInstance("DRBG");
          byte[] key = new byte[32];
          rng.nextBytes(key);
          return key;
      }
  }
expected:
  family: "RNG"
  role: "undetermined"
  size: "undetermined"
defect:
  cwe: "CWE-337"
  taxonomy:
    - "CryptoAPI-Bench: Seed in PRNG"
    - "CryptoGuard: Predictable/constant PRNG seeds"
    - "MASC: Using static seeds for Secure RNG"
    - "MASC: Using Setseed"
source:
  - url: "https://cwe.mitre.org/data/definitions/337.html"
    section: "CWE-337 Predictable Seed in Pseudo-Random Number Generator (PRNG): Description"
    read_at: "2026-11-06"
    quote: "A Pseudo-Random Number Generator (PRNG) is initialized from a predictable seed, such as the process ID or system time."
  - url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/security/SecureRandom.html"
    section: "Method setSeed(long seed)"
    read_at: "2026-11-06"
    quote: "A PRNG SecureRandom will not seed itself automatically if setSeed is called before any nextBytes or reseed calls. The caller should make sure that the seed argument contains enough entropy for the security of this SecureRandom."
  - url: "https://docs.oracle.com/en/java/javase/25/docs/specs/security/standard-names.html"
    section: "SecureRandom Number Generation Algorithms: DRBG"
    read_at: "2026-11-06"
    quote: "| DRBG | An algorithm using DRBG mechanisms as defined in NIST SP 800-90Ar1."
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "The fixed file drops the setSeed call, so the DRBG seeds itself from its entropy source on first use."
