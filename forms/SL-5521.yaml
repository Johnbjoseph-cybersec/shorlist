  import os
  from pathlib import Path

  from cryptography.hazmat.primitives.asymmetric.x25519 import X25519PrivateKey

  private_key = X25519PrivateKey.from_private_bytes(Path(os.environ["X25519_KEY_FILE"]).read_bytes())
