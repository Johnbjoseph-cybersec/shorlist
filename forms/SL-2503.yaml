id: "SL-2503"
title: "PHP openssl_pkey_new with OPENSSL_KEYTYPE_EC"
family: "EC"
parameter_set: "P-256"
role: "both"
form_kind: "api_call"
language_or_product: "PHP / ext/openssl"
negative: false
literal: "$key = openssl_pkey_new([\"private_key_type\" => OPENSSL_KEYTYPE_EC, \"curve_name\" => \"prime256v1\"]);"
context_filename: "keys.php"
context_template: |
  <?php

  $key = openssl_pkey_new(["private_key_type" => OPENSSL_KEYTYPE_EC, "curve_name" => "prime256v1"]);
expected:
  family: "EC"
  role: "undetermined"
  size: 256
source:
  - url: "https://www.php.net/manual/en/function.openssl-pkey-new.php"
    section: "openssl_pkey_new(): Parameters (options)"
    read_at: "2026-11-05"
    quote: "Among those options only private_key_bits, private_key_type, curve_name, and config are used for key generation."
  - url: "https://www.php.net/manual/en/openssl.key-types.php"
    section: "OpenSSL key type constants: OPENSSL_KEYTYPE_EC"
    read_at: "2026-11-05"
    quote: "OPENSSL_KEYTYPE_EC (int) Elliptic curve key type."
  - url: "https://www.php.net/manual/en/function.openssl-get-curve-names.php"
    section: "openssl_get_curve_names(): Description"
    read_at: "2026-11-05"
    quote: "The two most widely standardized/supported curves are prime256v1 (NIST P-256) and secp384r1 (NIST P-384)."
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-05"
notes: "The EC key type alone names no curve; this line pins P-256 through curve_name."
