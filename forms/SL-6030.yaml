literal: "var deniedSSHCiphers = []string{\"aes128-cbc\"}"
context_filename: "policy.go"
context_template: |
  package policy

  var deniedSSHCiphers = []string{"aes128-cbc"}

  func Denied(name string) bool {
  	for _, c := range deniedSSHCiphers {
  		if c == name {
  			return true
  		}
  	}
  	return false
  }
