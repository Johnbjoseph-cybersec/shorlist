id: "SL-5022"
title: "PyCryptodome: PBKDF2 with a constant salt"
family: "PBKDF2"
parameter_set: null
role: "n.a."
form_kind: "api_call"
language_or_product: "Python / PyCryptodome"
negative: false
row_kind: "defect"
literal: "return PBKDF2(password, b\"static-salt-1234\", 32, count=600_000, hmac_hash_module=SHA256)"
context_filename: "kdf.py"
context_template: |
  from Crypto.Hash import SHA256
  from Crypto.Protocol.KDF import PBKDF2


  def derive(password):
      return PBKDF2(password, b"static-salt-1234", 32, count=600_000, hmac_hash_module=SHA256)
right_template: |
  from Crypto.Hash import SHA256
  from Crypto.Protocol.KDF import PBKDF2
  from Crypto.Random import get_random_bytes


  def derive(password):
      salt = get_random_bytes(16)
      return salt, PBKDF2(password, salt, 32, count=600_000, hmac_hash_module=SHA256)
