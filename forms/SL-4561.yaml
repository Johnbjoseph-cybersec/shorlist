id: "SL-4561"
title: "Decoy: RC4 cipher suite named in a refusal log message"
family: "RC4"
parameter_set: null
role: "n.a."
form_kind: "registry_id"
language_or_product: "IANA TLS"
negative: true
decoy_class: "log_string"
literal: "logging.warning(\"peer offered TLS_RSA_WITH_RC4_128_SHA; refused by policy\")"
context_filename: "tls_policy.py"
context_template: |
  import logging

  logging.warning("peer offered TLS_RSA_WITH_RC4_128_SHA; refused by policy")
expected:
  family: "RC4"
  role: "encryption"
  size: "undetermined"
weakness:
  status: "disallowed"
  anchor: "RFC 7465, Section 2"
  quote: "TLS servers MUST NOT select an RC4 cipher suite when a TLS client sends such a cipher suite in the ClientHello message."
source:
  - url: "https://www.iana.org/assignments/tls-parameters/tls-parameters.xhtml#tls-parameters-4"
    section: "TLS Cipher Suites registry (CSV tls-parameters-4.csv): 0x00,0x05"
    read_at: "2026-11-06"
    quote: "\"0x00,0x05\",TLS_RSA_WITH_RC4_128_SHA,N,D,[RFC 5246]; [RFC 6347]; [RFC 10015],"
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "The suite name is text in a log message about refusing it; the file configures nothing."
