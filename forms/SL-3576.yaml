id: "SL-3576"
title: "keytool: ML-KEM-768 key pair (-keyalg)"
family: "ML-KEM"
parameter_set: "ML-KEM-768"
role: "key_establishment"
form_kind: "cli"
language_or_product: "Java / keytool (JDK 24)"
negative: false
literal: "keytool -keystore ks -storepass changeit -genkeypair -alias mlkem2 -keyalg ML-KEM-768 -dname CN=ML-KEM2 -signer ec"
