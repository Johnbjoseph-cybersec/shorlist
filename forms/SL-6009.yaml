id: "SL-6009"
title: "Android Kotlin: SecretKeySpec from a string literal"
family: "AES"
parameter_set: null
role: "encryption"
form_kind: "api_call"
language_or_product: "Kotlin / Android JCA"
negative: false
row_kind: "defect"
literal: "val key = SecretKeySpec(\"0123456789abcdef\".toByteArray(), \"AES\")"
context_filename: "Crypto.kt"
context_template: |
  import javax.crypto.Cipher
  import javax.crypto.spec.SecretKeySpec

  fun encrypt(data: ByteArray): ByteArray {
      val key = SecretKeySpec("0123456789abcdef".toByteArray(), "AES")
      val cipher = Cipher.getInstance("AES/GCM/NoPadding")
      cipher.init(Cipher.ENCRYPT_MODE, key)
      return cipher.iv + cipher.doFinal(data)
  }
right_template: |
  import javax.crypto.Cipher
  import javax.crypto.SecretKey

  fun encrypt(key: SecretKey, data: ByteArray): ByteArray {
          val cipher = Cipher.getInstance("AES/GCM/NoPadding")
      cipher.init(Cipher.ENCRYPT_MODE, key)
      return cipher.iv + cipher.doFinal(data)
  }
