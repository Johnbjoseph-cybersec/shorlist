notes: "SP 800-131A Rev. 2 Table 1's encryption status is taken (decryption alone would be legacy use). Two-key TDEA encryption is disallowed as well, so the status holds whichever keying option the key length selects. The primitives namespace keeps TripleDES as a deprecated alias; the docs say it moves to the decrepit module."
