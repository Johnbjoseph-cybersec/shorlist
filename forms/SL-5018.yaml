id: "SL-5018"
title: "PyCryptodome: MODE_CTR with a constant nonce="
family: "AES"
parameter_set: null
role: "encryption"
form_kind: "api_call"
language_or_product: "Python / PyCryptodome"
negative: false
row_kind: "defect"
literal: "cipher = AES.new(key, AES.MODE_CTR, nonce=b\"\\x00\" * 8)"
context_filename: "enc.py"
context_template: |
  from Crypto.Cipher import AES


  def encrypt(key, data):
      cipher = AES.new(key, AES.MODE_CTR, nonce=b"\x00" * 8)
      return cipher.encrypt(data)
right_template: |
  from Crypto.Cipher import AES


  def encrypt(key, data):
      cipher = AES.new(key, AES.MODE_CTR)
      return cipher.nonce + cipher.encrypt(data)
expected:
  family: "AES"
  role: "encryption"
  size: "undetermined"
defect:
  cwe: "CWE-1204"
source:
  - url: "https://cwe.mitre.org/data/definitions/1204.html"
    section: "CWE-1204 Generation of Weak Initialization Vector (IV): Description"
    read_at: "2026-11-06"
    quote: "The product uses a cryptographic primitive that uses an Initialization Vector (IV), but the product does not generate IVs that are sufficiently unpredictable or unique according to the expected cryptographic requirements for that primitive."
  - url: "https://www.pycryptodome.org/src/cipher/aes"
    section: "API: Crypto.Cipher.AES.new"
    read_at: "2026-11-06"
    quote: "Crypto.Cipher.AES.new(key, mode, *args, **kwargs)"
  - url: "https://www.pycryptodome.org/src/cipher/classic"
    section: "CTR mode: new(), nonce"
    read_at: "2026-11-06"
    quote: "MODE_CTR nonce (bytes) – the value of the fixed nonce. It must be unique for the combination message/key."
  - url: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-38a.pdf"
    section: "NIST SP 800-38A, Section 6.5 The Counter Mode"
    read_at: "2026-11-06"
    quote: "across all of the messages that are encrypted under the given key, all of the counters must be distinct."
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "CTR counter block constant: CWE-1204 (IV not unique as the primitive requires) is taken; CWE-323 (nonce reuse) would be the runner-up."
