negative: false
literal: "Cipher c = Cipher.getInstance(\"DESede/ECB/PKCS5Padding\");"
context_filename: "Enc.java"
context_template: |
  import javax.crypto.Cipher;

  public class Enc {
      public static void main(String[] args) throws Exception {
          Cipher c = Cipher.getInstance("DESede/ECB/PKCS5Padding");
          System.out.println(c.getAlgorithm());
      }
  }
expected:
  family: "3DES"
  role: "encryption"
  size: "undetermined"
weakness:
  status: "disallowed"
  anchor: "NIST SP 800-131A Rev. 2, Section 2, Table 1: three-key TDEA encryption"
  quote: "After December 31, 2023, three-key TDEA is disallowed for encryption unless specifically allowed by other NIST guidance."
source:
