id: "SL-7020"
title: "Sigstore trusted root: ctlogs[].publicKey.keyDetails PKIX_RSA_PKCS1V15_2048_SHA256"
family: "RSA"
parameter_set: "2048"
role: "signature"
form_kind: "config_value"
language_or_product: "Sigstore trusted root JSON"
negative: false
literal: "\"keyDetails\": \"PKIX_RSA_PKCS1V15_2048_SHA256\""
context_filename: "trusted_root.json"
context_template: |
  {
    "mediaType": "application/vnd.dev.sigstore.trustedroot+json;version=0.1",
    "ctlogs": [
      {
        "baseUrl": "https://rekor.example.internal",
        "publicKey": {
          "keyDetails": "PKIX_RSA_PKCS1V15_2048_SHA256",
          "validFor": {
            "start": "2026-01-01T00:00:00Z"
          }
        },
        "logId": {
          "keyId": "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        }
      }
    ]
  }
expected:
  family: "RSA"
  role: "signature"
  size: 2048
source:
  - url: "https://github.com/sigstore/protobuf-specs/blob/v0.5.2/protos/sigstore_common.proto#L73"
    section: "enum PublicKeyDetails"
    read_at: "2026-11-07"
    quote: "PKIX_RSA_PKCS1V15_2048_SHA256 = 9;"
  - url: "https://github.com/sigstore/protobuf-specs/blob/v0.5.2/protos/sigstore_common.proto#L173"
    section: "message PublicKey"
    read_at: "2026-11-07"
    quote: "PublicKeyDetails key_details = 2;"
  - url: "https://github.com/sigstore/architecture-docs/blob/60730f3251c28a96920c718bc65a59ad69ef2dc4/algorithm-registry.md"
    section: "Sigstore Algorithm Registry, Signature Algorithms (RSA)"
    read_at: "2026-11-07"
