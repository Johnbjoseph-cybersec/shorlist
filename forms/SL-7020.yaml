status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-07"
notes: "The registry marks this one verify only, not recommended; it is still a use (verification) and 2048-bit RSA is not a weak parameter, so no weakness block. The same object is the trustedRoot member of the client trust config that model_signing sign/verify take through --trust_config (README, Model Signing CLI). raw_bytes is optional in the message and is left out so that no encoded key stands in the template; the keyId is a placeholder."
