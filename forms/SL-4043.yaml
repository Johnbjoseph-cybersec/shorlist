id: "SL-4043"
title: "Android Cipher DESede/CBC/PKCS5Padding (Kotlin)"
family: "3DES"
parameter_set: null
role: "encryption"
form_kind: "api_string"
language_or_product: "Kotlin / Android JCA"
negative: false
literal: "val x = Cipher.getInstance(\"DESede/CBC/PKCS5Padding\")"
context_filename: "Crypto.kt"
context_template: |
  import javax.crypto.Cipher

  fun main() {
      val x = Cipher.getInstance("DESede/CBC/PKCS5Padding")
      println(x.algorithm)
  }
expected:
  family: "3DES"
  role: "encryption"
  size: "undetermined"
weakness:
  status: "disallowed"
  anchor: "NIST SP 800-131A Rev. 2, Section 2, Table 1: three-key TDEA encryption"
  quote: "After December 31, 2023, three-key TDEA is disallowed for encryption unless specifically allowed by other NIST guidance."
source:
  - url: "https://developer.android.com/reference/javax/crypto/Cipher"
    section: "Cipher: algorithm table, DESede"
    read_at: "2026-11-06"
    quote: "| DESede | CBC CFB CTR CTS ECB OFB |"
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "SP 800-131A Rev. 2 Table 1's encryption status is taken (decryption alone would be legacy use). Two-key TDEA encryption is disallowed as well, so the status holds whichever keying option the key length selects."
