id: "SL-6007"
title: "Android Kotlin: Cipher.getInstance(\"AES/ECB/PKCS5Padding\")"
family: "AES"
parameter_set: null
role: "encryption"
form_kind: "api_string"
language_or_product: "Kotlin / Android JCA"
negative: false
row_kind: "defect"
literal: "val cipher = Cipher.getInstance(\"AES/ECB/PKCS5Padding\")"
context_filename: "Crypto.kt"
context_template: |
  import javax.crypto.Cipher
  import javax.crypto.SecretKey

  fun encrypt(key: SecretKey, data: ByteArray): ByteArray {
      val cipher = Cipher.getInstance("AES/ECB/PKCS5Padding")
      cipher.init(Cipher.ENCRYPT_MODE, key)
      return cipher.doFinal(data)
  }
right_template: |
  import javax.crypto.Cipher
  import javax.crypto.SecretKey

  fun encrypt(key: SecretKey, data: ByteArray): ByteArray {
      val cipher = Cipher.getInstance("AES/GCM/NoPadding")
      cipher.init(Cipher.ENCRYPT_MODE, key)
      return cipher.iv + cipher.doFinal(data)
  }
expected:
  family: "AES"
  role: "encryption"
  size: "undetermined"
defect:
  cwe: "CWE-327"
  taxonomy:
