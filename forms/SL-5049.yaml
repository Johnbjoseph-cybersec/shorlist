id: "SL-5049"
title: "Node: createCipheriv('aes-256-ecb')"
family: "AES"
parameter_set: "AES-256"
role: "encryption"
form_kind: "api_string"
language_or_product: "JavaScript / Node.js crypto"
negative: false
row_kind: "defect"
literal: "const cipher = crypto.createCipheriv('aes-256-ecb', key, null);"
context_filename: "enc.js"
context_template: |
  const crypto = require('node:crypto');

  function encrypt(key, data) {
    const cipher = crypto.createCipheriv('aes-256-ecb', key, null);
    return Buffer.concat([cipher.update(data), cipher.final()]);
  }

  module.exports = { encrypt };
right_template: |
  const crypto = require('node:crypto');

  function encrypt(key, data) {
    const iv = crypto.randomBytes(12);
    const cipher = crypto.createCipheriv('aes-256-gcm', key, iv);
    return Buffer.concat([iv, cipher.update(data), cipher.final(), cipher.getAuthTag()]);
  }

  module.exports = { encrypt };
