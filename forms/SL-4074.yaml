id: "SL-4074"
title: "Node createCipheriv('rc4')"
family: "RC4"
parameter_set: null
role: "encryption"
form_kind: "api_string"
language_or_product: "JavaScript / Node.js crypto"
negative: false
literal: "const c = crypto.createCipheriv('rc4', key, null);"
context_filename: "enc.js"
context_template: |
  const crypto = require('node:crypto');

  function run(key, iv, data) {
    const c = crypto.createCipheriv('rc4', key, null);
    return Buffer.concat([c.update(data), c.final()]);
  }

  module.exports = { run };
