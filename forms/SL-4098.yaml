id: "SL-4098"
title: "PHP sha1_file()"
family: "SHA-1"
parameter_set: null
role: "hash"
form_kind: "api_call"
language_or_product: "PHP / standard"
negative: false
literal: "$digest = sha1_file($path);"
context_filename: "fp.php"
context_template: |
  <?php

  function run($data, $path)
  {
      $digest = sha1_file($path);
      return $digest;
  }
expected:
  family: "SHA-1"
  role: "hash"
  size: "undetermined"
weakness:
  status: "legacy_use"
  anchor: "OWASP ASVS 5.0.0, Appendix C, Hash Functions for General Use Cases: SHA-1 (L)"
  quote: "| SHA-1 | [RFC 3174](https://www.rfc-editor.org/info/rfc3174) & [RFC 6194](https://www.rfc-editor.org/info/rfc6194) | L | Not suitable for HMAC, KDF, RBG, digital signatures |"
source:
