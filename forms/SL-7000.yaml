form_kind: "cli"
language_or_product: "CLI / model_signing (sigstore/model-transparency)"
negative: false
literal: "model_signing sign key bert-base-uncased --private_key key.priv"
context_filename: "sign.sh"
context_template: |
  #!/bin/sh
