added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-07"
notes: "The literal names no algorithm: ECDSA is pinned by the product, whose only signer for this method checks the curve against secp256r1/secp384r1/secp521r1 and signs with ec.ECDSA. The curve is chosen by the key file, so the size is undetermined. The README's key-generation line (openssl ecparam -name prime256v1) is left out of the template: it is a second form."
