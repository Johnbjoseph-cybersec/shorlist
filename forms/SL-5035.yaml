id: "SL-5035"
title: "java.util.Random.nextBytes() for a key"
family: "RNG"
parameter_set: null
role: "n.a."
form_kind: "api_call"
language_or_product: "Java / JCA"
negative: false
row_kind: "defect"
literal: "new Random().nextBytes(key);"
context_filename: "Keys.java"
context_template: |
  import java.util.Random;

  public class Keys {
      static byte[] newKey() {
          byte[] key = new byte[32];
          new Random().nextBytes(key);
          return key;
      }
  }
right_template: |
  import java.security.SecureRandom;

  public class Keys {
      static byte[] newKey() {
          byte[] key = new byte[32];
          new SecureRandom().nextBytes(key);
          return key;
      }
  }
expected:
  family: "RNG"
  role: "undetermined"
  size: "undetermined"
defect:
  cwe: "CWE-338"
  taxonomy:
    - "CryptoAPI-Bench: PRNG"
    - "CryptoGuard: Cryptographically insecure PRNGs (e.g., java.util.Random)"
    - "MASC: Not using Secure (Pseudo) RNG"
source:
  - url: "https://cwe.mitre.org/data/definitions/338.html"
    section: "CWE-338 Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG): Description"
    read_at: "2026-11-06"
    quote: "The product uses a Pseudo-Random Number Generator (PRNG) in a security context, but the PRNG's algorithm is not cryptographically strong."
  - url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Random.html"
    section: "Class Random"
    read_at: "2026-11-06"
    quote: "Instances of java.util.Random are not cryptographically secure. Consider instead using SecureRandom to get a cryptographically secure pseudo-random number generator for use by security-sensitive applications."
  - url: "https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Random.html"
    section: "Method nextBytes(byte[] bytes)"
    read_at: "2026-11-06"
    quote: "Generates random bytes and places them into a user-supplied byte array."
