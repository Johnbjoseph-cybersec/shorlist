id: "SL-5004"
title: "pyca: ChaCha20Poly1305.encrypt with a constant nonce"
family: "ChaCha20"
parameter_set: null
role: "encryption"
form_kind: "api_call"
language_or_product: "Python / pyca cryptography"
negative: false
row_kind: "defect"
literal: "return ChaCha20Poly1305(key).encrypt(b\"\\x00\" * 12, data, None)"
context_filename: "enc.py"
context_template: |
  from cryptography.hazmat.primitives.ciphers.aead import ChaCha20Poly1305


  def encrypt(key, data):
      return ChaCha20Poly1305(key).encrypt(b"\x00" * 12, data, None)
right_template: |
  import os

  from cryptography.hazmat.primitives.ciphers.aead import ChaCha20Poly1305


  def encrypt(key, data):
      nonce = os.urandom(12)
      return nonce + ChaCha20Poly1305(key).encrypt(nonce, data, None)
