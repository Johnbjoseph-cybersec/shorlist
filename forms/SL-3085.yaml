id: "SL-3085"
title: "Terraform google_kms_crypto_key algorithm RSA_SIGN_PSS_4096_SHA256"
family: "RSA"
cyclonedx_family: "RSASSA-PSS"
parameter_set: "4096"
role: "signature"
form_kind: "config_value"
language_or_product: "Terraform / hashicorp/google 8.10"
negative: false
literal: "    algorithm = \"RSA_SIGN_PSS_4096_SHA256\""
context_filename: "main.tf"
context_template: |
  resource "google_kms_crypto_key" "key" {
    name     = "app-key"
    key_ring = "projects/example/locations/global/keyRings/app"
    purpose  = "ASYMMETRIC_SIGN"

    version_template {
      algorithm = "RSA_SIGN_PSS_4096_SHA256"
    }
  }
expected:
  family: "RSA"
  role: "signature"
  size: 4096
source:
