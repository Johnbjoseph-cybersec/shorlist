id: "SL-4040"
title: "JCA Signature MD5withRSA (signing)"
family: "MD5"
parameter_set: null
role: "hash"
form_kind: "api_string"
language_or_product: "Java / JCA"
negative: false
literal: "Signature sig = Signature.getInstance(\"MD5withRSA\");"
context_filename: "Signer.java"
context_template: |
  import java.security.PrivateKey;
  import java.security.Signature;

  public class Signer {
      static byte[] sign(PrivateKey key, byte[] data) throws Exception {
          Signature sig = Signature.getInstance("MD5withRSA");
          sig.initSign(key);
          sig.update(data);
          return sig.sign();
      }
  }
