id: "SL-4122"
title: "CryptoKit Insecure.SHA1() incremental"
family: "SHA-1"
parameter_set: null
role: "hash"
form_kind: "api_call"
language_or_product: "Swift / Apple CryptoKit"
negative: false
literal: "var hasher = Insecure.SHA1()"
context_filename: "Hash.swift"
context_template: |
  import CryptoKit
  import Foundation

  func run(_ data: Data) {
      var hasher = Insecure.SHA1()
      hasher.update(data: data)
      print(hasher.finalize())
  }
expected:
  family: "SHA-1"
  role: "hash"
  size: "undetermined"
