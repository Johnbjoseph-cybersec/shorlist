id: "SL-5067"
title: ".NET: HMACSHA256.HashData with a hard-coded key"
family: "HMAC"
parameter_set: null
role: "mac"
form_kind: "api_call"
language_or_product: "C# / .NET"
negative: false
row_kind: "defect"
literal: "return HMACSHA256.HashData(Encoding.UTF8.GetBytes(\"hardcoded-mac-key\"), data);"
context_filename: "Mac.cs"
context_template: |
  using System.Security.Cryptography;
  using System.Text;

  static class Mac
  {
      public static byte[] Sign(byte[] data)
      {
          return HMACSHA256.HashData(Encoding.UTF8.GetBytes("hardcoded-mac-key"), data);
      }
  }
right_template: |
  using System;
  using System.Security.Cryptography;

  static class Mac
  {
      public static byte[] Sign(byte[] data)
      {
          return HMACSHA256.HashData(Convert.FromBase64String(Environment.GetEnvironmentVariable("MAC_KEY")!), data);
      }
  }
