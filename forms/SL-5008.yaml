id: "SL-5008"
title: "hashlib.pbkdf2_hmac with a constant salt"
family: "PBKDF2"
parameter_set: null
role: "n.a."
form_kind: "api_call"
language_or_product: "Python / stdlib"
negative: false
row_kind: "defect"
literal: "return hashlib.pbkdf2_hmac(\"sha256\", password, b\"static-salt-1234\", 600_000)"
context_filename: "kdf.py"
context_template: |
  import hashlib


  def derive(password):
      return hashlib.pbkdf2_hmac("sha256", password, b"static-salt-1234", 600_000)
right_template: |
  import hashlib
  import os


  def derive(password):
      salt = os.urandom(16)
      return salt, hashlib.pbkdf2_hmac("sha256", password, salt, 600_000)
