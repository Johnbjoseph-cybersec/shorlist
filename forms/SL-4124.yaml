id: "SL-4124"
title: "Decoy: SHA-1 named in a Python log string"
family: "SHA-1"
parameter_set: null
role: "n.a."
form_kind: "api_string"
language_or_product: "Python / hashlib"
negative: true
decoy_class: "log_string"
literal: "logging.warning(\"peer requested sha1 digests; refused\")"
context_filename: "peer.py"
context_template: |
  import logging


  def refuse():
      logging.warning("peer requested sha1 digests; refused")
expected:
  family: "SHA-1"
  role: "hash"
  size: "undetermined"
weakness:
  status: "legacy_use"
  anchor: "OWASP ASVS 5.0.0, Appendix C, Hash Functions for General Use Cases: SHA-1 (L)"
  quote: "| SHA-1 | [RFC 3174](https://www.rfc-editor.org/info/rfc3174) & [RFC 6194](https://www.rfc-editor.org/info/rfc6194) | L | Not suitable for HMAC, KDF, RBG, digital signatures |"
source:
  - url: "https://docs.python.org/3.14/library/hashlib.html"
    section: "Hash algorithms: named constructors"
    read_at: "2026-11-06"
    quote: "hashlib.sha1([data, ]*, usedforsecurity=True)"
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "SHA-1 status: the form does not pin the use. SP 800-131A Rev. 2 Table 8 rates SHA-1 by use (signature generation disallowed, verification legacy use, non-signature applications acceptable) and has no general statement; ASVS 5.0 Appendix C rates SHA-1 as a whole L (legacy), which is the status taken here."
