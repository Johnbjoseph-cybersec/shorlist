id: "SL-5043"
title: "Go: hmac.New with a hard-coded key"
family: "HMAC"
parameter_set: null
role: "mac"
form_kind: "api_call"
language_or_product: "Go / stdlib"
negative: false
row_kind: "defect"
literal: "mac := hmac.New(sha256.New, []byte(\"hardcoded-mac-key\"))"
context_filename: "mac.go"
context_template: |
  package crypt

  import (
  	"crypto/hmac"
  	"crypto/sha256"
  )

  func Sign(msg []byte) []byte {
  	mac := hmac.New(sha256.New, []byte("hardcoded-mac-key"))
  	mac.Write(msg)
  	return mac.Sum(nil)
  }
right_template: |
  package crypt

  import (
  	"crypto/hmac"
  	"crypto/sha256"
  	"os"
  )

  func Sign(msg []byte) []byte {
  	mac := hmac.New(sha256.New, []byte(os.Getenv("MAC_KEY")))
  	mac.Write(msg)
  	return mac.Sum(nil)
  }
expected:
  family: "HMAC"
  role: "mac"
  size: "undetermined"
defect:
  cwe: "CWE-321"
source:
  - url: "https://cwe.mitre.org/data/definitions/321.html"
    section: "CWE-321 Use of Hard-coded Cryptographic Key: Description"
    read_at: "2026-11-06"
    quote: "The product uses a hard-coded, unchangeable cryptographic key."
  - url: "https://github.com/golang/go/blob/go1.25.0/src/crypto/hmac/hmac.go"
    section: "crypto/hmac: New"
    read_at: "2026-11-06"
    quote: "New returns a new HMAC hash using the given [hash.Hash] type and key."
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "The fixed file reads the key from the environment; any key-management source that is not in the code would do."
