notes: "The production Rekor v2 log (log2025-1) is listed with this value in the bundled trusted root. The same object is the trustedRoot member of the client trust config that model_signing sign/verify take through --trust_config (README, Model Signing CLI). raw_bytes is optional in the message and is left out so that no encoded key stands in the template; the keyId is a placeholder."
