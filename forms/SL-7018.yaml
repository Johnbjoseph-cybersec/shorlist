            "start": "2026-01-01T00:00:00Z"
          }
        },
        "logId": {
          "keyId": "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        }
      }
    ]
  }
expected:
  family: "EdDSA"
  role: "signature"
  size: "undetermined"
source:
  - url: "https://github.com/sigstore/protobuf-specs/blob/v0.5.2/protos/sigstore_common.proto#L88"
    section: "enum PublicKeyDetails"
    read_at: "2026-11-07"
    quote: "PKIX_ED25519 = 7; // See RFC8032"
  - url: "https://github.com/sigstore/protobuf-specs/blob/v0.5.2/protos/sigstore_common.proto#L173"
    section: "message PublicKey"
    read_at: "2026-11-07"
    quote: "PublicKeyDetails key_details = 2;"
  - url: "https://github.com/sigstore/sigstore-python/blob/v4.5.1/sigstore/_store/https%253A%252F%252Ftuf-repo-cdn.sigstore.dev/trusted_root.json"
