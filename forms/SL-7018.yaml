id: "SL-7018"
title: "Sigstore trusted root: tlogs[].publicKey.keyDetails PKIX_ED25519"
family: "EdDSA"
parameter_set: "Ed25519"
role: "signature"
form_kind: "config_value"
language_or_product: "Sigstore trusted root JSON"
negative: false
literal: "\"keyDetails\": \"PKIX_ED25519\""
context_filename: "trusted_root.json"
context_template: |
  {
    "mediaType": "application/vnd.dev.sigstore.trustedroot+json;version=0.1",
