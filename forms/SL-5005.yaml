id: "SL-5005"
title: "pyca: AESGCM with a hard-coded key"
family: "AES"
parameter_set: null
role: "encryption"
form_kind: "api_call"
language_or_product: "Python / pyca cryptography"
negative: false
row_kind: "defect"
literal: "aead = AESGCM(b\"0123456789abcdef0123456789abcdef\")"
context_filename: "enc.py"
context_template: |
  import os

  from cryptography.hazmat.primitives.ciphers.aead import AESGCM


  def encrypt(data):
      aead = AESGCM(b"0123456789abcdef0123456789abcdef")
      nonce = os.urandom(12)
      return nonce + aead.encrypt(nonce, data, None)
right_template: |
  import os

  from cryptography.hazmat.primitives.ciphers.aead import AESGCM


  def encrypt(data):
      aead = AESGCM(bytes.fromhex(os.environ["DATA_KEY"]))
      nonce = os.urandom(12)
      return nonce + aead.encrypt(nonce, data, None)
