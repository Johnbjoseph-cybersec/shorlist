id: "SL-5042"
title: "Go: aes.NewCipher with a hard-coded key"
family: "AES"
parameter_set: null
role: "encryption"
form_kind: "api_call"
language_or_product: "Go / stdlib"
negative: false
row_kind: "defect"
literal: "block, err := aes.NewCipher([]byte(\"0123456789abcdef0123456789abcdef\"))"
context_filename: "enc.go"
context_template: |
  package crypt

  import (
  	"crypto/aes"
  	"crypto/cipher"
  	"crypto/rand"
  )

  func Encrypt(data []byte) ([]byte, error) {
  	block, err := aes.NewCipher([]byte("0123456789abcdef0123456789abcdef"))
  	if err != nil {
  		return nil, err
  	}
  	gcm, err := cipher.NewGCM(block)
  	if err != nil {
  		return nil, err
  	}
  	nonce := make([]byte, gcm.NonceSize())
  	rand.Read(nonce)
  	return gcm.Seal(nonce, nonce, data, nil), nil
  }
right_template: |
  package crypt

  import (
  	"crypto/aes"
  	"crypto/cipher"
  	"crypto/rand"
  	"encoding/hex"
  	"os"
  )

  func Encrypt(data []byte) ([]byte, error) {
  	key, err := hex.DecodeString(os.Getenv("DATA_KEY"))
  	if err != nil {
  		return nil, err
  	}
  	block, err := aes.NewCipher(key)
  	if err != nil {
  		return nil, err
  	}
  	gcm, err := cipher.NewGCM(block)
  	if err != nil {
  		return nil, err
  	}
  	nonce := make([]byte, gcm.NonceSize())
  	rand.Read(nonce)
  	return gcm.Seal(nonce, nonce, data, nil), nil
  }
expected:
  family: "AES"
  role: "encryption"
  size: "undetermined"
defect:
  cwe: "CWE-321"
  taxonomy:
    - "Go detectors study (Andersson & Monperrus): Constant/predictable key"
source:
  - url: "https://cwe.mitre.org/data/definitions/321.html"
    section: "CWE-321 Use of Hard-coded Cryptographic Key: Description"
    read_at: "2026-11-06"
    quote: "The product uses a hard-coded, unchangeable cryptographic key."
  - url: "https://github.com/golang/go/blob/go1.25.0/src/crypto/aes/aes.go"
    section: "crypto/aes: NewCipher"
    read_at: "2026-11-06"
    quote: "NewCipher creates and returns a new [cipher.Block]."
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "The fixed file reads the key from the environment; any key-management source that is not in the code would do."
