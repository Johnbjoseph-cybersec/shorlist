id: "SL-2500"
title: "PHP openssl_pkey_new with OPENSSL_KEYTYPE_RSA"
family: "RSA"
parameter_set: "2048"
role: "both"
form_kind: "api_call"
language_or_product: "PHP / ext/openssl"
negative: false
literal: "$key = openssl_pkey_new([\"private_key_type\" => OPENSSL_KEYTYPE_RSA, \"private_key_bits\" => 2048]);"
context_filename: "keys.php"
context_template: |
  <?php

  $key = openssl_pkey_new(["private_key_type" => OPENSSL_KEYTYPE_RSA, "private_key_bits" => 2048]);
