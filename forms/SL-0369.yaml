notes: "Static DH; the certificate is RSA-signed. The suite also names RSA. When a suite names two algorithms the row's family is the key-exchange half; a record of the other family on the same line does not change the outcome. The registry marks this entry Recommended: D; it stays in because deployed code still uses it."
