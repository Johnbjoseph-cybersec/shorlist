id: "SL-6004"
title: "JSSE: SSLContext.getInstance(\"TLSv1\")"
family: "TLS"
parameter_set: null
role: "n.a."
form_kind: "api_string"
language_or_product: "Java / JSSE"
negative: false
row_kind: "defect"
literal: "SSLContext ctx = SSLContext.getInstance(\"TLSv1\");"
context_filename: "Tls.java"
context_template: |
  import javax.net.ssl.SSLContext;

  public class Tls {
      static SSLContext context() throws Exception {
          SSLContext ctx = SSLContext.getInstance("TLSv1");
          ctx.init(null, null, null);
          return ctx;
      }
  }
right_template: |
  import javax.net.ssl.SSLContext;

  public class Tls {
      static SSLContext context() throws Exception {
          SSLContext ctx = SSLContext.getInstance("TLSv1.3");
          ctx.init(null, null, null);
          return ctx;
      }
  }
