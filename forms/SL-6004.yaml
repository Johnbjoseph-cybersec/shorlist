status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "Java has no row for an old protocol version (SL-5537/5543/5547/5549/5553 cover Go, .NET, Node, OpenSSL and Python). The JDK disables TLS 1.0 by default in jdk.tls.disabledAlgorithms; the line still asks for it, and a policy file that re-enables it makes it effective."
