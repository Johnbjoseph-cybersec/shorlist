id: "SL-4114"
title: "RustCrypto des: TdesEde3"
family: "3DES"
parameter_set: "three-key"
role: "encryption"
form_kind: "api_call"
language_or_product: "Rust / RustCrypto"
negative: false
literal: "let cipher = des::TdesEde3::new_from_slice(key).unwrap();"
context_filename: "main.rs"
context_template: |
  use des::cipher::KeyInit;

  fn run(key: &[u8]) {
      let cipher = des::TdesEde3::new_from_slice(key).unwrap();
      let _ = cipher;
  }

  fn main() {
      run(&[0u8; 24]);
  }
expected:
  family: "3DES"
  role: "encryption"
  size: "undetermined"
weakness:
  status: "disallowed"
  anchor: "NIST SP 800-131A Rev. 2, Section 2, Table 1: three-key TDEA encryption"
  quote: "After December 31, 2023, three-key TDEA is disallowed for encryption unless specifically allowed by other NIST guidance."
source:
