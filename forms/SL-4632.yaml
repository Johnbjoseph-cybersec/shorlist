id: "SL-4632"
title: "JCA: KeyPairGenerator DH initialised to 1024 bits"
family: "DH"
parameter_set: "1024"
role: "key_establishment"
form_kind: "api_call"
language_or_product: "Java / JCA"
negative: false
literal: "KeyPairGenerator kpg = KeyPairGenerator.getInstance(\"DH\"); kpg.initialize(1024);"
context_filename: "Keys.java"
context_template: |
  import java.security.KeyPair;
  import java.security.KeyPairGenerator;

  public class Keys {
      public static void main(String[] args) throws Exception {
          KeyPairGenerator kpg = KeyPairGenerator.getInstance("DH"); kpg.initialize(1024);
          KeyPair kp = kpg.generateKeyPair();
          System.out.println(kp.getPublic().getAlgorithm());
      }
  }
expected:
  family: "DH"
  role: "key_establishment"
  size: 1024
weakness:
  status: "disallowed"
  anchor: "NIST SP 800-131A Rev. 2, Section 5 (Table 4), non-compliant DH and MQV schemes using finite fields"
  quote: "The use of schemes that support a security strength less than 112 bits is disallowed, i.e., when using FIPS 186-type domain parameters where len(p) < 2048 or len(q) < 224."
source:
  - url: "https://docs.oracle.com/en/java/javase/24/docs/api/java.base/java/security/KeyPairGenerator.html"
    section: "KeyPairGenerator: initialize(int keysize)"
    read_at: "2026-11-06"
    quote: "Initializes the key pair generator for a certain keysize using"
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "getInstance and initialize stand on one line so that the line pins both the algorithm and the size. The quoted sentence speaks of FIPS 186-type domain parameters; these are generated safe-prime parameters. The same section accepts safe-prime groups only when they are the groups listed in Appendix D of SP 800-56A, and a freshly generated 1024-bit group is not one of them."
