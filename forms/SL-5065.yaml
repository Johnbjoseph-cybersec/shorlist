id: "SL-5065"
title: ".NET: ChaCha20Poly1305.Encrypt with an all-zero nonce"
family: "ChaCha20"
parameter_set: null
role: "encryption"
form_kind: "api_call"
language_or_product: "C# / .NET"
negative: false
row_kind: "defect"
literal: "chacha.Encrypt(new byte[12], data, ciphertext, tag);"
context_filename: "Enc.cs"
context_template: |
  using System.Security.Cryptography;

  static class Enc
  {
      public static byte[] Encrypt(byte[] key, byte[] data)
      {
          byte[] ciphertext = new byte[data.Length];
          byte[] tag = new byte[16];
          using ChaCha20Poly1305 chacha = new ChaCha20Poly1305(key);
          chacha.Encrypt(new byte[12], data, ciphertext, tag);
          return [.. ciphertext, .. tag];
      }
  }
right_template: |
  using System.Security.Cryptography;

  static class Enc
  {
      public static byte[] Encrypt(byte[] key, byte[] data)
      {
          byte[] nonce = RandomNumberGenerator.GetBytes(12);
          byte[] ciphertext = new byte[data.Length];
          byte[] tag = new byte[16];
          using ChaCha20Poly1305 chacha = new ChaCha20Poly1305(key);
          chacha.Encrypt(nonce, data, ciphertext, tag);
          return [.. nonce, .. ciphertext, .. tag];
      }
  }
expected:
  family: "ChaCha20"
  role: "encryption"
  size: "undetermined"
defect:
  cwe: "CWE-323"
source:
  - url: "https://cwe.mitre.org/data/definitions/323.html"
    section: "CWE-323 Reusing a Nonce, Key Pair in Encryption: Description"
    read_at: "2026-11-06"
    quote: "Nonces should be used for the present occasion and only once."
  - url: "https://learn.microsoft.com/en-us/dotnet/api/system.security.cryptography.chacha20poly1305.encrypt?view=net-10.0"
    section: "ChaCha20Poly1305.Encrypt(byte[], byte[], byte[], byte[], byte[])"
    read_at: "2026-11-06"
    quote: "public void Encrypt(byte[] nonce, byte[] plaintext, byte[] ciphertext, byte[] tag, byte[]? associatedData = default);"
  - url: "https://learn.microsoft.com/en-us/dotnet/api/system.security.cryptography.chacha20poly1305.encrypt?view=net-10.0"
    section: "ChaCha20Poly1305.Encrypt: Remarks"
    read_at: "2026-11-06"
    quote: "The security guarantees of the ChaCha20/Poly1305 algorithm mode require that the same nonce value is never used twice with the same key."
