id: "SL-4085"
title: "OpenSSL EVP_rc2_cbc() for encryption"
family: "RC2"
parameter_set: null
role: "encryption"
form_kind: "api_call"
language_or_product: "C / OpenSSL 3.5"
negative: false
literal: "return EVP_EncryptInit_ex(ctx, EVP_rc2_cbc(), NULL, key, iv);"
context_filename: "enc.c"
context_template: |
  #include <openssl/evp.h>

  int init(EVP_CIPHER_CTX *ctx, const unsigned char *key, const unsigned char *iv)
  {
      return EVP_EncryptInit_ex(ctx, EVP_rc2_cbc(), NULL, key, iv);
  }
expected:
  family: "RC2"
  role: "encryption"
  size: "undetermined"
weakness:
  status: "deprecated"
  anchor: "IETF RFC 8551 (S/MIME 4.0), Section 2.7.2 Choosing Weak Encryption"
  quote: "Algorithms such as RC2 are considered to be weak encryption algorithms."
source:
  - url: "https://docs.openssl.org/3.5/man3/EVP_rc2_cbc/"
    section: "EVP_rc2_cbc: SYNOPSIS/DESCRIPTION"
    read_at: "2026-11-06"
    quote: "const EVP_CIPHER *EVP_rc2_cbc(void);"
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "RC2 is named in none of SP 800-131A Rev. 2, ASVS 5.0 Appendix C or BSI TR-02102-1 (2026-01) (grep of the saved texts for 'RC2'); RFC 8551 calls it weak and never recommended but does not use the word 'disallowed', hence 'deprecated'. In OpenSSL 3 this algorithm lives in the legacy provider, which is not loaded by default; the line is still the form a developer writes."
