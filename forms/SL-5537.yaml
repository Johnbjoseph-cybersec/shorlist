id: "SL-5537"
title: "Go crypto/tls: tls.Config{MinVersion: tls.VersionTLS10}"
family: "TLS"
parameter_set: null
role: "n.a."
form_kind: "api_call"
language_or_product: "Go / stdlib"
row_kind: "defect"
negative: false
literal: "TLSClientConfig: &tls.Config{MinVersion: tls.VersionTLS10},"
context_filename: "client.go"
context_template: |
  package client

  import (
  	"crypto/tls"
  	"net/http"
  )

  func Client() *http.Client {
  	tr := &http.Transport{
  		TLSClientConfig: &tls.Config{MinVersion: tls.VersionTLS10},
  	}
  	return &http.Client{Transport: tr}
  }
right_template: |
  package client

  import (
  	"crypto/tls"
  	"net/http"
  )

  func Client() *http.Client {
  	tr := &http.Transport{
  		TLSClientConfig: &tls.Config{MinVersion: tls.VersionTLS12},
  	}
  	return &http.Client{Transport: tr}
  }
