id: "SL-4594"
title: "Decoy: hmac-sha1 MACs removed from the sshd defaults"
family: "SHA-1"
parameter_set: null
role: "n.a."
form_kind: "config_value"
language_or_product: "OpenSSH sshd"
negative: true
decoy_class: "removal_list"
literal: "MACs -hmac-sha1*"
context_filename: "sshd_config"
context_template: |
  Port 22
  MACs -hmac-sha1*
expected:
  family: "SHA-1"
  role: "mac"
  size: "undetermined"
weakness:
  status: "deprecated"
  anchor: "BSI TR-02102-4 (2026-01), Table 1: Document history, version 2020-01"
  quote: "2020-01 2020-01-31 Adjustment of the periods of use, discontinuation of HMAC-SHA-1"
source:
  - url: "https://man.openbsd.org/sshd_config"
    section: "MACs: the default (OpenBSD-current, October 30, 2026)"
    read_at: "2026-11-06"
    quote: "hmac-sha2-256,hmac-sha2-512,hmac-sha1"
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "The default MACs include hmac-sha1 and hmac-sha1-etm@openssh.com; a leading '-' with a wildcard removes them."
