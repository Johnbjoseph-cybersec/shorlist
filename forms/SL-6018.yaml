id: "SL-6018"
title: "Go golang-jwt: HS256 SignedString with a hard-coded key"
family: "HMAC"
parameter_set: null
role: "mac"
form_kind: "api_call"
language_or_product: "Go / github.com/golang-jwt/jwt/v5"
negative: false
row_kind: "defect"
literal: "return token.SignedString([]byte(\"secret\"))"
context_filename: "auth.go"
context_template: |
  package auth

  import "github.com/golang-jwt/jwt/v5"

  func Sign(claims jwt.MapClaims) (string, error) {
  	token := jwt.NewWithClaims(jwt.SigningMethodHS256, claims)
  	return token.SignedString([]byte("secret"))
  }
right_template: |
  package auth

  import (
  	"os"

  	"github.com/golang-jwt/jwt/v5"
  )

  func Sign(claims jwt.MapClaims) (string, error) {
  	token := jwt.NewWithClaims(jwt.SigningMethodHS256, claims)
  	return token.SignedString([]byte(os.Getenv("JWT_HMAC_KEY")))
  }
