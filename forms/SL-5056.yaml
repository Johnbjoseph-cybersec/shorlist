id: "SL-5056"
title: "Node: pbkdf2Sync with a constant salt"
family: "PBKDF2"
parameter_set: null
role: "n.a."
form_kind: "api_call"
language_or_product: "JavaScript / Node.js crypto"
negative: false
row_kind: "defect"
literal: "return crypto.pbkdf2Sync(password, 'static-salt-1234', 600000, 32, 'sha256');"
context_filename: "kdf.js"
context_template: |
  const crypto = require('node:crypto');

  function derive(password) {
    return crypto.pbkdf2Sync(password, 'static-salt-1234', 600000, 32, 'sha256');
  }

  module.exports = { derive };
right_template: |
  const crypto = require('node:crypto');

  function derive(password) {
    const salt = crypto.randomBytes(16);
    return { salt, key: crypto.pbkdf2Sync(password, salt, 600000, 32, 'sha256') };
  }

  module.exports = { derive };
