language_or_product: "C# / .NET System.Security.Cryptography"
row_kind: "defect"
negative: false
literal: "byte[] ct = rsa.Encrypt(data, RSAEncryptionPadding.Pkcs1);"
context_filename: "Wrap.cs"
context_template: |
  using System.Security.Cryptography;

  public static class Wrap
  {
      public static byte[] Encrypt(RSA rsa, byte[] data)
      {
          byte[] ct = rsa.Encrypt(data, RSAEncryptionPadding.Pkcs1);
          return ct;
      }
  }
right_template: |
  using System.Security.Cryptography;

  public static class Wrap
  {
      public static byte[] Encrypt(RSA rsa, byte[] data)
      {
          byte[] ct = rsa.Encrypt(data, RSAEncryptionPadding.OaepSHA256);
          return ct;
      }
  }
