id: "SL-4629"
title: "keytool: DSA key pair, -keysize 1024"
family: "DSA"
parameter_set: "1024"
role: "signature"
form_kind: "cli"
language_or_product: "Java / keytool (JDK 24)"
negative: false
literal: "keytool -keystore ks -storepass changeit -genkeypair -alias signer -keyalg DSA -keysize 1024 -dname CN=signer"
context_filename: "keystore.sh"
context_template: |
