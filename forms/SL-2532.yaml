source:
  - url: "https://docs.ruby-lang.org/en/3.4/OpenSSL/PKey.html"
    section: "OpenSSL::PKey.generate_key"
    read_at: "2026-11-05"
    quote: "If a String is given as the first argument, it generates a new random key for the algorithm specified by the name just as ::generate_parameters does."
  - url: "https://docs.ruby-lang.org/en/3.4/OpenSSL/PKey.html"
    section: "OpenSSL::PKey.generate_parameters"
    read_at: "2026-11-05"
    quote: "For the supported options, see the documentation for the ‘openssl genpkey’ utility command."
  - url: "https://docs.openssl.org/3.5/man1/openssl-genpkey/"
    section: "OPTIONS: -algorithm alg"
    read_at: "2026-11-05"
    quote: "Valid built-in algorithm names for private key generation are RSA, RSA-PSS, EC, X25519, X448, ED25519, ED448, ML-DSA and ML-KEM."
