id: "SL-5528"
title: "Decoy: Java log message rejecting RSA/ECB/PKCS1Padding"
family: "RSA"
parameter_set: null
role: "n.a."
form_kind: "api_string"
language_or_product: "Java / JCA"
row_kind: "defect"
negative: true
decoy_class: "log_string"
literal: "LOG.warning(\"refusing transformation RSA/ECB/PKCS1Padding; use OAEP\");"
context_filename: "Main.java"
context_template: |
  import java.util.logging.Logger;

  public class Main {
      private static final Logger LOG = Logger.getLogger("crypto");

      static void refuse() {
          LOG.warning("refusing transformation RSA/ECB/PKCS1Padding; use OAEP");
      }
  }
expected:
  family: "RSA"
  role: "encryption"
  size: "undetermined"
defect:
  cwe: "CWE-780"
source:
