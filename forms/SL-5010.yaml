id: "SL-5010"
title: "hashlib.sha256(password) used as a key"
family: "SHA-2"
parameter_set: null
role: "hash"
form_kind: "api_call"
language_or_product: "Python / stdlib"
negative: false
row_kind: "defect"
literal: "return hashlib.sha256(password).digest()"
context_filename: "kdf.py"
context_template: |
  import hashlib


  def derive_key(password):
      return hashlib.sha256(password).digest()
right_template: |
  import hashlib


  def derive_key(password, salt):
      return hashlib.pbkdf2_hmac("sha256", password, salt, 600_000)
expected:
  family: "SHA-2"
  role: "hash"
  size: "undetermined"
defect:
  cwe: "CWE-916"
source:
  - url: "https://cwe.mitre.org/data/definitions/916.html"
    section: "CWE-916 Use of Password Hash With Insufficient Computational Effort: Description"
    read_at: "2026-11-06"
    quote: "The product generates a hash for a password, but it uses a scheme that does not provide a sufficient level of computational effort that would make password cracking attacks infeasible or expensive."
  - url: "https://cwe.mitre.org/data/definitions/916.html"
    section: "CWE-916: Extended Description"
    read_at: "2026-11-06"
    quote: "Many hash algorithms are designed to execute quickly with minimal overhead, even cryptographic hashes."
  - url: "https://docs.python.org/3.14/library/hashlib.html"
    section: "Hash algorithms: named constructors"
    read_at: "2026-11-06"
    quote: "hashlib.sha256([data, ]*, usedforsecurity=True)"
  - url: "https://docs.python.org/3.14/library/hashlib.html"
    section: "Key derivation"
    read_at: "2026-11-06"
    quote: "Naive algorithms such as sha1(password) are not resistant against brute-force attacks."
  - url: "https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html"
    section: "OWASP Password Storage Cheat Sheet: Background"
    read_at: "2026-11-06"
    quote: "are not suitable for password storage because they allow attackers to perform large numbers of guesses quickly."
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "CWE-759 (one-way hash without a salt) also describes this line; CWE-916 is taken because its Description names the missing work factor, which a salt alone would not fix. The fixed file derives the key with PBKDF2-HMAC-SHA256, 600,000 iterations, salt from the caller."
