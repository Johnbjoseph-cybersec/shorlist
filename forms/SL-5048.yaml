id: "SL-5048"
title: "Go: math/rand.Uint64 for a token"
family: "RNG"
parameter_set: null
role: "n.a."
form_kind: "api_call"
language_or_product: "Go / stdlib"
negative: false
row_kind: "defect"
literal: "return strconv.FormatUint(rand.Uint64(), 36)"
context_filename: "tokens.go"
context_template: |
  package crypt

  import (
  	"math/rand"
  	"strconv"
  )

  func NewToken() string {
  	return strconv.FormatUint(rand.Uint64(), 36)
  }
right_template: |
  package crypt

  import (
  	"crypto/rand"
  	"encoding/hex"
  )

  func NewToken() string {
  	b := make([]byte, 16)
  	rand.Read(b)
  	return hex.EncodeToString(b)
  }
