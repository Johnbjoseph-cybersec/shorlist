id: "SL-2547"
title: "Android Keystore KeyPairGenerator with KeyProperties.KEY_ALGORITHM_ML_DSA"
family: "ML-DSA"
parameter_set: "ML-DSA-65"
role: "signature"
form_kind: "api_call"
language_or_product: "Kotlin / Android Keystore"
negative: false
literal: "val kpg = KeyPairGenerator.getInstance(KeyProperties.KEY_ALGORITHM_ML_DSA, \"AndroidKeyStore\")"
context_filename: "Keys.kt"
context_template: |
  import android.security.keystore.KeyProperties
  import java.security.KeyPairGenerator

  fun main() {
      val kpg = KeyPairGenerator.getInstance(KeyProperties.KEY_ALGORITHM_ML_DSA, "AndroidKeyStore")
  }
expected:
  family: "ML-DSA"
  role: "signature"
  size: "undetermined"
source:
  - url: "https://developer.android.com/reference/android/security/keystore/KeyProperties"
    section: "KeyProperties.KEY_ALGORITHM_ML_DSA"
    read_at: "2026-11-05"
    quote: "public static final String KEY_ALGORITHM_ML_DSA"
  - url: "https://developer.android.com/reference/android/security/keystore/KeyProperties"
    section: "KeyProperties.KEY_ALGORITHM_ML_DSA: description"
    read_at: "2026-11-05"
    quote: "Per https://openjdk.org/jeps/497, this defaults to the ML-DSA-65 variant."
  - url: "https://developer.android.com/reference/android/security/keystore/KeyGenParameterSpec"
    section: "Example: ML-DSA key pair for signing"
    read_at: "2026-11-05"
    quote: "The generated key pair will use the ML-DSA-65 parameter set if the KeyPairGenerator is instantiated with the family name \"ML-DSA\" or the parameter set name \"ML-DSA-65\"."
status: "verified-source"
