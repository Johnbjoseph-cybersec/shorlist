family: "RSA"
parameter_set: "2048"
role: "both"
form_kind: "api_call"
language_or_product: "C / OpenSSL 3.5"
negative: false
literal: "return RSA_generate_key_ex(rsa, 2048, e, NULL);"
context_filename: "rsagen.c"
context_template: |
  #include <openssl/rsa.h>

  int generate(RSA *rsa, BIGNUM *e)
  {
      return RSA_generate_key_ex(rsa, 2048, e, NULL);
  }
