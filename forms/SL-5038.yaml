id: "SL-5038"
title: "Go: cipher.NewCBCEncrypter with a zero IV"
family: "AES"
parameter_set: null
role: "encryption"
form_kind: "api_call"
language_or_product: "Go / stdlib"
negative: false
row_kind: "defect"
literal: "mode := cipher.NewCBCEncrypter(block, make([]byte, aes.BlockSize))"
context_filename: "enc.go"
context_template: |
  package crypt

  import (
  	"crypto/aes"
  	"crypto/cipher"
  )

  func Encrypt(key, padded []byte) ([]byte, error) {
  	block, err := aes.NewCipher(key)
  	if err != nil {
  		return nil, err
  	}
  	out := make([]byte, len(padded))
  	mode := cipher.NewCBCEncrypter(block, make([]byte, aes.BlockSize))
  	mode.CryptBlocks(out, padded)
  	return out, nil
  }
right_template: |
  package crypt

  import (
  	"crypto/aes"
  	"crypto/cipher"
  	"crypto/rand"
  )

  func Encrypt(key, padded []byte) ([]byte, error) {
  	block, err := aes.NewCipher(key)
  	if err != nil {
  		return nil, err
  	}
  	out := make([]byte, aes.BlockSize+len(padded))
  	iv := out[:aes.BlockSize]
  	rand.Read(iv)
  	mode := cipher.NewCBCEncrypter(block, iv)
  	mode.CryptBlocks(out[aes.BlockSize:], padded)
  	return out, nil
  }
expected:
  family: "AES"
  role: "encryption"
  size: "undetermined"
defect:
  cwe: "CWE-329"
  taxonomy:
    - "Go detectors study (Andersson & Monperrus): Static or predictable IV"
source:
  - url: "https://cwe.mitre.org/data/definitions/329.html"
    section: "CWE-329 Generation of Predictable IV with CBC Mode: Description"
    read_at: "2026-11-06"
    quote: "The product generates and uses a predictable initialization Vector (IV) with Cipher Block Chaining (CBC) Mode, which causes algorithms to be susceptible to dictionary attacks when they are encrypted under the same key."
  - url: "https://github.com/golang/go/blob/go1.25.0/src/crypto/cipher/cbc.go"
    section: "crypto/cipher: NewCBCEncrypter"
    read_at: "2026-11-06"
    quote: "NewCBCEncrypter returns a BlockMode which encrypts in cipher block chaining"
  - url: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-38a.pdf"
    section: "NIST SP 800-38A, Section 6.2 The Cipher Block Chaining Mode"
    read_at: "2026-11-06"
    quote: "The IV need not be secret, but it must be unpredictable; the generation of such IVs is discussed in Appendix C."
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
