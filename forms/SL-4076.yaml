id: "SL-4076"
title: "Node createDecipheriv('des-ede3-cbc')"
family: "3DES"
parameter_set: null
role: "encryption"
form_kind: "api_string"
language_or_product: "JavaScript / Node.js crypto"
negative: false
literal: "const c = crypto.createDecipheriv('des-ede3-cbc', key, iv);"
context_filename: "enc.js"
context_template: |
  const crypto = require('node:crypto');

  function run(key, iv, data) {
    const c = crypto.createDecipheriv('des-ede3-cbc', key, iv);
    return Buffer.concat([c.update(data), c.final()]);
  }

  module.exports = { run };
