id: "SL-3047"
title: "Decoy: IAM Deny on kms:CreateKey when kms:KeySpec is ECC_SECG_P256K1"
family: "ECDSA"
parameter_set: "secp256k1"
role: "n.a."
form_kind: "config_value"
language_or_product: "AWS IAM policy / kms condition keys"
negative: true
decoy_class: "ban_list"
literal: "          \"kms:KeySpec\": \"ECC_SECG_P256K1\""
context_filename: "deny-policy.json"
context_template: |
  {
    "Version": "2012-10-17",
    "Statement": [
      {
        "Effect": "Deny",
        "Action": "kms:CreateKey",
        "Resource": "*",
        "Condition": {
          "StringEquals": {
            "kms:KeySpec": "ECC_SECG_P256K1"
          }
        }
      }
    ]
  }
expected:
  family: "ECDSA"
  role: "signature"
  size: 256
source:
  - url: "https://docs.aws.amazon.com/kms/latest/developerguide/conditions-kms.html"
    section: "kms:KeySpec"
    read_at: "2026-11-05"
    quote: "The kms:KeySpec condition key controls access to operations based on the value of the KeySpec property of the KMS key that is created by or used in the operation."
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-05"
notes: "The statement forbids creating the key; it creates nothing."
