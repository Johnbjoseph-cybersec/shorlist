id: "SL-4630"
title: "JCA: KeyPairGenerator RSA initialised to 1024 bits"
family: "RSA"
parameter_set: "1024"
role: "both"
form_kind: "api_call"
language_or_product: "Java / JCA"
negative: false
literal: "KeyPairGenerator kpg = KeyPairGenerator.getInstance(\"RSA\"); kpg.initialize(1024);"
context_filename: "Keys.java"
context_template: |
  import java.security.KeyPair;
  import java.security.KeyPairGenerator;

  public class Keys {
      public static void main(String[] args) throws Exception {
          KeyPairGenerator kpg = KeyPairGenerator.getInstance("RSA"); kpg.initialize(1024);
          KeyPair kp = kpg.generateKeyPair();
          System.out.println(kp.getPublic().getAlgorithm());
      }
  }
expected:
  family: "RSA"
  role: "undetermined"
  size: 1024
weakness:
  status: "disallowed"
  anchor: "NIST SP 800-131A Rev. 2, Section 3 (Table 2), digital signature generation"
  quote: "RSA: The length of the modulus n shall be 2048 bits or more to meet the minimum security-strength requirement of 112 bits for Federal Government use."
