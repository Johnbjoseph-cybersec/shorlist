id: "SL-5068"
title: ".NET: Rfc2898DeriveBytes.Pbkdf2 with a constant salt"
family: "PBKDF2"
parameter_set: null
role: "n.a."
form_kind: "api_call"
language_or_product: "C# / .NET"
negative: false
row_kind: "defect"
literal: "return Rfc2898DeriveBytes.Pbkdf2(password, Encoding.UTF8.GetBytes(\"static-salt-1234\"), 600000, HashAlgorithmName.SHA256, 32);"
context_filename: "Kdf.cs"
context_template: |
  using System.Security.Cryptography;
  using System.Text;

  static class Kdf
  {
      public static byte[] Derive(string password)
      {
          return Rfc2898DeriveBytes.Pbkdf2(password, Encoding.UTF8.GetBytes("static-salt-1234"), 600000, HashAlgorithmName.SHA256, 32);
      }
  }
right_template: |
  using System.Security.Cryptography;

  static class Kdf
  {
      public static byte[] Derive(string password, out byte[] salt)
      {
          salt = RandomNumberGenerator.GetBytes(16);
          return Rfc2898DeriveBytes.Pbkdf2(password, salt, 600000, HashAlgorithmName.SHA256, 32);
      }
  }
expected:
  family: "PBKDF2"
  role: "undetermined"
  size: "undetermined"
defect:
  cwe: "CWE-760"
source:
  - url: "https://cwe.mitre.org/data/definitions/760.html"
    section: "CWE-760 Use of a One-Way Hash with a Predictable Salt: Description"
    read_at: "2026-11-06"
    quote: "The product uses a one-way cryptographic hash against an input that should not be reversible, such as a password, but the product uses a predictable salt as part of the input."
  - url: "https://learn.microsoft.com/en-us/dotnet/api/system.security.cryptography.rfc2898derivebytes.pbkdf2?view=net-10.0"
    section: "Rfc2898DeriveBytes.Pbkdf2(string, byte[], int, HashAlgorithmName, int)"
    read_at: "2026-11-06"
    quote: "public static byte[] Pbkdf2(string password, byte[] salt, int iterations, System.Security.Cryptography.HashAlgorithmName hashAlgorithm, int outputLength);"
  - url: "https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html"
    section: "OWASP Password Storage Cheat Sheet: Salting"
    read_at: "2026-11-06"
    quote: "A salt is a unique, randomly generated string that is added to each password as part of the hashing process."
