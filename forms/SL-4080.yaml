context_filename: "fp.c"
context_template: |
  #include <openssl/evp.h>

  int main(void)
  {
      EVP_MD_CTX *ctx = EVP_MD_CTX_new();
      EVP_DigestInit_ex(ctx, EVP_md4(), NULL);
      EVP_MD_CTX_free(ctx);
      return 0;
  }
