id: "SL-5539"
title: "Java JSSE: X509TrustManager whose checkServerTrusted accepts every chain"
family: "TLS"
parameter_set: null
role: "n.a."
form_kind: "api_call"
language_or_product: "Java / JSSE"
row_kind: "defect"
negative: false
literal: "public void checkServerTrusted(X509Certificate[] chain, String authType) {}"
context_filename: "Main.java"
context_template: |
  import java.security.cert.X509Certificate;
  import javax.net.ssl.SSLContext;
  import javax.net.ssl.TrustManager;
  import javax.net.ssl.X509TrustManager;

  public class Main {
      static SSLContext context() throws Exception {
          TrustManager[] trustAll = new TrustManager[] {
              new X509TrustManager() {
                  public void checkClientTrusted(X509Certificate[] chain, String authType) {}
                  public void checkServerTrusted(X509Certificate[] chain, String authType) {}
                  public X509Certificate[] getAcceptedIssuers() { return new X509Certificate[0]; }
              }
          };
          SSLContext ctx = SSLContext.getInstance("TLS");
          ctx.init(null, trustAll, null);
          return ctx;
      }
  }
right_template: |
  import javax.net.ssl.SSLContext;

  public class Main {
      static SSLContext context() throws Exception {
          SSLContext ctx = SSLContext.getInstance("TLS");
          ctx.init(null, null, null);
          return ctx;
      }
  }
