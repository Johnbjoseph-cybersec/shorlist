id: "SL-3203"
title: "Vault SSH CA generate_signing_key key_type=ec key_bits=384"
family: "ECDSA"
parameter_set: "P-384"
role: "signature"
form_kind: "cli"
language_or_product: "HashiCorp Vault v2.x / ssh"
negative: false
literal: "vault write ssh-client-signer/config/ca generate_signing_key=true key_type=ec key_bits=384"
context_filename: "ssh-ca.sh"
context_template: |
  #!/bin/sh
  vault write ssh-client-signer/config/ca generate_signing_key=true key_type=ec key_bits=384
expected:
  family: "ECDSA"
  role: "signature"
  size: 384
source:
  - url: "https://developer.hashicorp.com/vault/api-docs/secret/ssh"
    section: "Submit CA information: Parameters: key_type"
    read_at: "2026-11-05"
    quote: "Valid values are OpenSSH key type identifiers (ssh-rsa, ecdsa-sha2-nistp256, ecdsa-sha2-nistp384, ecdsa-sha2-nistp521, or ssh-ed25519) or an algorithm (rsa, ec, or ed25519)."
  - url: "https://developer.hashicorp.com/vault/api-docs/secret/ssh"
    section: "Submit CA information: Parameters: key_bits"
    read_at: "2026-11-05"
    quote: "in key_type (where the value of key_bits identifies which NIST P-curve to use; 256, 384, or 521, with the default 0 value resulting in a NIST P-256 key)."
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-05"
notes: "An SSH CA key is a signing key; key_bits picks the NIST P-curve."
