id: "SL-5021"
title: "PyCryptodome: AES.new with a hard-coded key"
family: "AES"
parameter_set: null
role: "encryption"
form_kind: "api_call"
language_or_product: "Python / PyCryptodome"
negative: false
row_kind: "defect"
literal: "cipher = AES.new(b\"0123456789abcdef\", AES.MODE_GCM)"
context_filename: "enc.py"
context_template: |
  import os

  from Crypto.Cipher import AES


  def encrypt(data):
      cipher = AES.new(b"0123456789abcdef", AES.MODE_GCM)
      ciphertext, tag = cipher.encrypt_and_digest(data)
      return cipher.nonce + ciphertext + tag
right_template: |
  import os

  from Crypto.Cipher import AES


  def encrypt(data):
      cipher = AES.new(bytes.fromhex(os.environ["DATA_KEY"]), AES.MODE_GCM)
      ciphertext, tag = cipher.encrypt_and_digest(data)
      return cipher.nonce + ciphertext + tag
