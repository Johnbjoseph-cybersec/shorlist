id: "SL-5013"
title: "random.choice() for a token"
family: "RNG"
parameter_set: null
role: "n.a."
form_kind: "api_call"
language_or_product: "Python / stdlib"
negative: false
row_kind: "defect"
literal: "return \"\".join(random.choice(ALPHABET) for _ in range(32))"
context_filename: "tokens.py"
context_template: |
  import random
  import string

  ALPHABET = string.ascii_letters + string.digits


  def new_token():
      return "".join(random.choice(ALPHABET) for _ in range(32))
right_template: |
  import secrets
  import string

  ALPHABET = string.ascii_letters + string.digits


  def new_token():
      return "".join(secrets.choice(ALPHABET) for _ in range(32))
