id: "SL-4088"
title: "OpenSSL EVP_MD_fetch \"SHA1\""
family: "SHA-1"
parameter_set: null
role: "hash"
form_kind: "api_string"
language_or_product: "C / OpenSSL 3.5"
negative: false
literal: "EVP_MD *md = EVP_MD_fetch(NULL, \"SHA1\", NULL);"
context_filename: "fp.c"
context_template: |
  #include <openssl/evp.h>

  int main(void)
  {
      EVP_MD *md = EVP_MD_fetch(NULL, "SHA1", NULL);
      EVP_MD_free(md);
      return 0;
  }
expected:
  family: "SHA-1"
  role: "hash"
  size: "undetermined"
weakness:
  status: "legacy_use"
  anchor: "OWASP ASVS 5.0.0, Appendix C, Hash Functions for General Use Cases: SHA-1 (L)"
  quote: "| SHA-1 | [RFC 3174](https://www.rfc-editor.org/info/rfc3174) & [RFC 6194](https://www.rfc-editor.org/info/rfc6194) | L | Not suitable for HMAC, KDF, RBG, digital signatures |"
source:
  - url: "https://docs.openssl.org/3.5/man3/EVP_DigestInit/"
    section: "EVP_MD_fetch: SYNOPSIS"
    read_at: "2026-11-06"
    quote: "EVP_MD *EVP_MD_fetch(OSSL_LIB_CTX *ctx, const char *algorithm, const char *properties);"
  - url: "https://github.com/openssl/openssl/blob/openssl-3.5.0/providers/implementations/include/prov/names.h"
    section: "providers/implementations/include/prov/names.h"
    read_at: "2026-11-06"
    quote: "#define PROV_NAMES_SHA1 \"SHA1:SHA-1:SSL3-SHA1:1.3.14.3.2.26\""
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "SHA-1 status: the form does not pin the use. SP 800-131A Rev. 2 Table 8 rates SHA-1 by use (signature generation disallowed, verification legacy use, non-signature applications acceptable) and has no general statement; ASVS 5.0 Appendix C rates SHA-1 as a whole L (legacy), which is the status taken here."
