id: "SL-3571"
title: "keytool: XDH key pair on x25519 (-groupname)"
family: "X25519"
parameter_set: "X25519"
role: "key_establishment"
form_kind: "cli"
language_or_product: "Java / keytool (JDK 24)"
negative: false
literal: "keytool -keystore ks -storepass changeit -genkeypair -alias kx -keyalg XDH -groupname x25519 -dname CN=kx -signer ca"
context_filename: "keystore.sh"
context_template: |
  #!/bin/sh
  keytool -keystore ks -storepass changeit -genkeypair -alias kx -keyalg XDH -groupname x25519 -dname CN=kx -signer ca
expected:
  family: "X25519"
  role: "key_establishment"
  size: "undetermined"
source:
  - url: "https://docs.oracle.com/en/java/javase/24/docs/specs/man/keytool.html"
    section: "keytool(1) JDK 24, Supported Named Extensions / Default Values: -keysize, -groupname"
    read_at: "2026-11-05"
    quote: "x25519 (when using -genkeypair and -keyalg is \"XDH\", key size is 255)"
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-05"
notes: "The CA entry named by -signer is assumed to exist in the keystore; its creation is left out so the template contains one form."
