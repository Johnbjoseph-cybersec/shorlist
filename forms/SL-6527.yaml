id: "SL-6527"
title: "Decoy: curve25519-sha256@libssh.org removed from sshd key exchange"
family: "X25519"
parameter_set: "curve25519-sha256@libssh.org"
role: "n.a."
form_kind: "config_value"
language_or_product: "OpenSSH sshd"
negative: true
decoy_class: "removal_list"
literal: "KexAlgorithms -curve25519-sha256@libssh.org"
