id: "SL-4626"
title: "openssl.cnf [ req ]: default_bits = 1024"
family: "RSA"
parameter_set: "1024"
role: "both"
form_kind: "config_value"
language_or_product: "OpenSSL 3.5 openssl.cnf"
negative: false
literal: "default_bits = 1024"
context_filename: "openssl.cnf"
context_template: |
  [ req ]
  default_bits = 1024
expected:
  family: "RSA"
  role: "undetermined"
  size: 1024
weakness:
  status: "disallowed"
  anchor: "NIST SP 800-131A Rev. 2, Section 3 (Table 2), digital signature generation"
  quote: "RSA: The length of the modulus n shall be 2048 bits or more to meet the minimum security-strength requirement of 112 bits for Federal Government use."
source:
  - url: "https://docs.openssl.org/3.5/man1/openssl-req/"
    section: "CONFIGURATION FILE FORMAT: default_bits"
    read_at: "2026-11-06"
    quote: "[rsa:]nbits generates an RSA key nbits in size. If nbits is omitted, i.e., -newkey rsa is specified, the default key size specified in the configuration file with the default_bits option is used if present, else 2048."
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "The RSA key size req uses for -newkey rsa when no size is given."
