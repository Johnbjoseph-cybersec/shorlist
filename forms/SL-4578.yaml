id: "SL-4578"
title: "Decoy: 3DES excluded in an nginx cipher string"
family: "3DES"
parameter_set: null
role: "n.a."
form_kind: "config_value"
language_or_product: "nginx"
negative: true
decoy_class: "ban_list"
literal: "ssl_ciphers HIGH:!aNULL:!3DES;"
context_filename: "nginx.conf"
context_template: |
  events {}

  http {
      server {
          listen 443 ssl;
          ssl_certificate     cert.pem;
          ssl_certificate_key key.pem;
          ssl_protocols TLSv1.2;
          ssl_ciphers HIGH:!aNULL:!3DES;
      }
  }
expected:
  family: "3DES"
  role: "encryption"
  size: "undetermined"
weakness:
  status: "disallowed"
  anchor: "NIST SP 800-52 Rev. 2, Section 3.3.1.1"
  quote: "Cipher suites that use the Triple Data Encryption Aglorithm (TDEA, also written as 3DES) are no longer allowed due to the limited amounts of data that can be processed under a single key."
source:
  - url: "https://nginx.org/en/docs/http/ngx_http_ssl_module.html"
    section: "ssl_ciphers"
    read_at: "2026-11-06"
    quote: "The ciphers are specified in the format understood by the OpenSSL library"
  - url: "https://docs.openssl.org/3.5/man1/openssl-ciphers/"
    section: "CIPHER LIST FORMAT ('!') and CIPHER STRINGS (3DES)"
    read_at: "2026-11-06"
    quote: "Cipher suites using triple DES."
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "3DES is named only after '!', i.e. removed. HIGH is a class, not a named algorithm."
