    section: "Schema: Optional"
    read_at: "2026-11-05"
    quote: "`ecdsa_curve` (String) When `algorithm` is `ECDSA`, the name of the elliptic curve to use. Currently-supported values are: `P224`, `P256`, `P384`, `P521`. (default: `P224`)."
