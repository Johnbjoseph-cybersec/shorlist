id: "SL-6005"
title: "JSSE: SSLSocket created without endpoint identification"
family: "TLS"
parameter_set: null
role: "n.a."
form_kind: "api_call"
language_or_product: "Java / JSSE"
negative: false
row_kind: "defect"
literal: "SSLSocket socket = (SSLSocket) SSLSocketFactory.getDefault().createSocket(host, 443);"
context_filename: "Client.java"
context_template: |
  import javax.net.ssl.SSLSocket;
  import javax.net.ssl.SSLSocketFactory;

  public class Client {
      static SSLSocket open(String host) throws Exception {
          SSLSocket socket = (SSLSocket) SSLSocketFactory.getDefault().createSocket(host, 443);
          socket.startHandshake();
          return socket;
      }
  }
right_template: |
  import javax.net.ssl.SSLParameters;
  import javax.net.ssl.SSLSocket;
  import javax.net.ssl.SSLSocketFactory;

  public class Client {
      static SSLSocket open(String host) throws Exception {
          SSLSocketFactory factory = (SSLSocketFactory) SSLSocketFactory.getDefault();
          SSLSocket socket = (SSLSocket) factory.createSocket(host, 443);
          SSLParameters params = socket.getSSLParameters();
          params.setEndpointIdentificationAlgorithm("HTTPS");
          socket.setSSLParameters(params);
          socket.startHandshake();
          return socket;
      }
  }
expected:
  family: "TLS"
  role: "undetermined"
  size: "undetermined"
defect:
  cwe: "CWE-297"
  taxonomy:
    - "CryptoGuard: Rule 6 Custom SSLSocketFactory w/o manual Hostname verification"
    - "CryptoAPI-Bench: SSL Socket"
    - "MASC: 44. SSLSocketFactory without verifying Hostname"
source:
  - url: "https://cwe.mitre.org/data/definitions/297.html"
    section: "CWE-297 Improper Validation of Certificate with Host Mismatch: Description"
    read_at: "2026-11-06"
    quote: "The product communicates with a host that provides a certificate, but the product does not properly ensure that the certificate is actually associated with that host."
  - url: "https://arxiv.org/pdf/1806.06881"
    section: "Rahaman et al. (CryptoGuard), Section 3 (Rule 6)"
    read_at: "2026-11-06"
