id: "SL-6020"
title: "MicroPython: cryptolib.aes CBC with an all-zero IV"
family: "AES"
parameter_set: null
role: "encryption"
form_kind: "api_call"
language_or_product: "Python / MicroPython cryptolib"
negative: false
row_kind: "defect"
literal: "cipher = cryptolib.aes(key, 2, b\"\\x00\" * 16)"
context_filename: "enc.py"
context_template: |
  import cryptolib


  def encrypt(key, padded):
      cipher = cryptolib.aes(key, 2, b"\x00" * 16)
      return cipher.encrypt(padded)
right_template: |
  import os

  import cryptolib


  def encrypt(key, padded):
      iv = os.urandom(16)
      cipher = cryptolib.aes(key, 2, iv)
      return iv + cipher.encrypt(padded)
expected:
  family: "AES"
  role: "encryption"
  size: "undetermined"
defect:
  cwe: "CWE-329"
  taxonomy:
    - "LICMA: §2"
    - "Egele et al. (CryptoLint): Rule 2 Do not use a non-random IV for CBC encryption"
source:
  - url: "https://cwe.mitre.org/data/definitions/329.html"
    section: "CWE-329 Generation of Predictable IV with CBC Mode: Description"
    read_at: "2026-11-06"
    quote: "The product generates and uses a predictable initialization Vector (IV) with Cipher Block Chaining (CBC) Mode, which causes algorithms to be susceptible to dictionary attacks when they are encrypted under the same key."
  - url: "https://arxiv.org/pdf/2109.01109"
    section: "Wickert et al. (LICMA), Table 1, rule §2"
    read_at: "2026-11-06"
    quote: "Do not use a non-random initiliazation vector (IV) for ciphertext block chaining (CBC) encryption."
  - url: "https://arxiv.org/pdf/2109.01109"
    section: "Wickert et al. (LICMA), Section 3.2 Implementation"
    read_at: "2026-11-06"
    quote: "LICMA supports only §3 and §4 for PyNaCl and only §1, §2 and §3 for ucryptolib."
  - url: "https://docs.micropython.org/en/latest/library/cryptolib.html"
    section: "class cryptolib.aes: __init__(key, mode[, IV])"
    read_at: "2026-11-06"
    quote: "2 (or cryptolib.MODE_CBC if it exists) for Cipher Block Chaining (CBC)."
