id: "SL-3199"
title: "Vault SSH CA generate_signing_key key_type=ecdsa-sha2-nistp256"
family: "ECDSA"
parameter_set: "P-256"
role: "signature"
form_kind: "cli"
language_or_product: "HashiCorp Vault v2.x / ssh"
negative: false
literal: "vault write ssh-client-signer/config/ca generate_signing_key=true key_type=ecdsa-sha2-nistp256"
context_filename: "ssh-ca.sh"
context_template: |
  #!/bin/sh
  vault write ssh-client-signer/config/ca generate_signing_key=true key_type=ecdsa-sha2-nistp256
expected:
  family: "ECDSA"
  role: "signature"
  size: 256
source:
