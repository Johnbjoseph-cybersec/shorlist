notes: "Deprecated in the enum, but still present in the staging trusted root that sigstore-python ships. Deprecation in the enum is not a classical weakness, so no weakness block; the key size is not pinned. The same object is the trustedRoot member of the client trust config that model_signing sign/verify take through --trust_config (README, Model Signing CLI). raw_bytes is optional in the message and is left out so that no encoded key stands in the template; the keyId is a placeholder."
