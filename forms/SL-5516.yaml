id: "SL-5516"
title: "Java JCA: RSAKeyGenParameterSpec(2048, RSAKeyGenParameterSpec.F0) (e = 3)"
family: "RSA"
parameter_set: "2048"
role: "both"
form_kind: "api_call"
language_or_product: "Java / JCA"
row_kind: "defect"
negative: false
literal: "kpg.initialize(new RSAKeyGenParameterSpec(2048, RSAKeyGenParameterSpec.F0));"
context_filename: "Main.java"
context_template: |
  import java.security.KeyPair;
  import java.security.KeyPairGenerator;
  import java.security.spec.RSAKeyGenParameterSpec;

  public class Main {
      static KeyPair generate() throws Exception {
          KeyPairGenerator kpg = KeyPairGenerator.getInstance("RSA");
          kpg.initialize(new RSAKeyGenParameterSpec(2048, RSAKeyGenParameterSpec.F0));
          return kpg.generateKeyPair();
      }
  }
right_template: |
  import java.security.KeyPair;
  import java.security.KeyPairGenerator;
  import java.security.spec.RSAKeyGenParameterSpec;

  public class Main {
      static KeyPair generate() throws Exception {
          KeyPairGenerator kpg = KeyPairGenerator.getInstance("RSA");
          kpg.initialize(new RSAKeyGenParameterSpec(2048, RSAKeyGenParameterSpec.F4));
          return kpg.generateKeyPair();
      }
  }
expected:
  family: "RSA"
  role: "undetermined"
  size: 2048
defect:
  cwe: "CWE-326"
source:
  - url: "https://cwe.mitre.org/data/definitions/326.html"
    section: "CWE-326, Description"
    read_at: "2026-11-06"
    quote: "The product stores or transmits sensitive data using an encryption scheme that is theoretically sound, but is not strong enough for the level of protection required."
  - url: "https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.186-5.pdf"
    section: "FIPS 186-5, Appendix A.1.1, criterion 1(b)"
    read_at: "2026-11-06"
    quote: "(b) The exponent e shall be an odd positive integer such that:"
  - url: "https://docs.oracle.com/en/java/javase/24/docs/api/java.base/java/security/spec/RSAKeyGenParameterSpec.html"
    section: "java.security.spec.RSAKeyGenParameterSpec (JDK 24), Field Details: F0"
    read_at: "2026-11-06"
    quote: "public static final BigInteger F0 The public-exponent value F0 = 3."
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "CWE-326 is the closest MITRE entry; its Description is generic (encryption not strong enough for the protection required) and names no exponent. The requirement itself is FIPS 186-5 A.1.1: 2^16 < e < 2^256."
