  import os
  from pathlib import Path

  from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

  private_key = Ed25519PrivateKey.from_private_bytes(Path(os.environ["ED25519_KEY_FILE"]).read_bytes())
