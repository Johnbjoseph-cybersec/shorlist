id: "SL-5027"
title: "JCA: AES/CTR with a constant counter block"
family: "AES"
parameter_set: null
role: "encryption"
form_kind: "api_call"
language_or_product: "Java / JCA"
negative: false
row_kind: "defect"
literal: "c.init(Cipher.ENCRYPT_MODE, key, new IvParameterSpec(\"fixed-counter-01\".getBytes(StandardCharsets.US_ASCII)));"
context_filename: "Enc.java"
context_template: |
  import java.nio.charset.StandardCharsets;
  import javax.crypto.Cipher;
  import javax.crypto.SecretKey;
  import javax.crypto.spec.IvParameterSpec;

  public class Enc {
      static byte[] encrypt(SecretKey key, byte[] data) throws Exception {
          Cipher c = Cipher.getInstance("AES/CTR/NoPadding");
          c.init(Cipher.ENCRYPT_MODE, key, new IvParameterSpec("fixed-counter-01".getBytes(StandardCharsets.US_ASCII)));
          return c.doFinal(data);
      }
  }
right_template: |
  import java.security.SecureRandom;
  import javax.crypto.Cipher;
  import javax.crypto.SecretKey;
  import javax.crypto.spec.IvParameterSpec;

  public class Enc {
      static byte[][] encrypt(SecretKey key, byte[] data) throws Exception {
          byte[] iv = new byte[16];
          new SecureRandom().nextBytes(iv);
          Cipher c = Cipher.getInstance("AES/CTR/NoPadding");
          c.init(Cipher.ENCRYPT_MODE, key, new IvParameterSpec(iv));
          return new byte[][] {iv, c.doFinal(data)};
      }
  }
expected:
