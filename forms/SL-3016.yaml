id: "SL-3016"
title: "Decoy: KMS KeySpec ECC_NIST_P256 commented out in a CloudFormation template"
family: "EC"
parameter_set: "P-256"
role: "n.a."
form_kind: "config_value"
language_or_product: "AWS CloudFormation / AWS::KMS::Key"
negative: true
decoy_class: "comment"
literal: "# KeySpec: ECC_NIST_P256"
context_filename: "template.yaml"
context_template: |
  AWSTemplateFormatVersion: "2010-09-09"
  # KeySpec: ECC_NIST_P256
  Resources:
    Topic:
      Type: AWS::SNS::Topic
expected:
  family: "EC"
  role: "undetermined"
  size: 256
source:
  - url: "https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-kms-key.html"
    section: "Properties: KeySpec"
    read_at: "2026-11-05"
    quote: "Allowed values: SYMMETRIC_DEFAULT | RSA_2048 | RSA_3072 | RSA_4096 | ECC_NIST_P256"
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-05"
notes: "The only resource is an SNS topic; the key spec is in a YAML comment."
