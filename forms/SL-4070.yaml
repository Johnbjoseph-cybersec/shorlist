id: "SL-4070"
title: "Node crypto.hash('sha1')"
family: "SHA-1"
parameter_set: null
role: "hash"
form_kind: "api_string"
language_or_product: "JavaScript / Node.js crypto"
negative: false
literal: "return crypto.hash('sha1', data);"
context_filename: "fp.js"
context_template: |
  const crypto = require('node:crypto');

  function run(data) {
    return crypto.hash('sha1', data);
  }

  module.exports = { run };
expected:
  family: "SHA-1"
  role: "hash"
  size: "undetermined"
weakness:
  status: "legacy_use"
  anchor: "OWASP ASVS 5.0.0, Appendix C, Hash Functions for General Use Cases: SHA-1 (L)"
  quote: "| SHA-1 | [RFC 3174](https://www.rfc-editor.org/info/rfc3174) & [RFC 6194](https://www.rfc-editor.org/info/rfc6194) | L | Not suitable for HMAC, KDF, RBG, digital signatures |"
source:
