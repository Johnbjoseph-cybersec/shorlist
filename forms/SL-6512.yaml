id: "SL-6512"
title: "Apache mod_ssl: SSLOpenSSLConfCmd Groups X25519MLKEM768"
family: "ML-KEM"
parameter_set: "X25519MLKEM768"
role: "key_establishment"
form_kind: "config_value"
language_or_product: "Apache httpd mod_ssl"
negative: false
literal: "SSLOpenSSLConfCmd Groups X25519MLKEM768"
context_filename: "httpd.conf"
context_template: |
  Listen 443
  <VirtualHost *:443>
      SSLEngine on
      SSLCertificateFile cert.pem
      SSLCertificateKeyFile key.pem
      SSLOpenSSLConfCmd Groups X25519MLKEM768
  </VirtualHost>
expected:
  family: "ML-KEM"
  role: "key_establishment"
  size: "undetermined"
source:
  - url: "https://arxiv.org/pdf/2605.17955"
    section: "Section V-C1, Hybrid PQC at the web server layer"
    read_at: "2026-11-06"
    quote: "The server was then configured to offer hybrid key exchange in TLS 1.3."
  - url: "https://httpd.apache.org/docs/2.4/mod/mod_ssl.html"
    section: "SSLOpenSSLConfCmd Directive"
    read_at: "2026-11-06"
    quote: "For a list of supported command names, see the section Supported configuration file commands in the SSL_CONF_cmd(3) manual page for OpenSSL."
  - url: "https://docs.openssl.org/3.5/man3/SSL_CONF_cmd/"
    section: "SUPPORTED CONFIGURATION FILE COMMANDS: Groups"
    read_at: "2026-11-06"
    quote: "This sets the supported groups."
  - url: "https://docs.openssl.org/3.5/man3/SSL_CTX_set1_curves/"
    section: "SSL_CTX_set1_groups_list: notes"
    read_at: "2026-11-06"
    quote: "OpenSSL 3.5 also introduces support for three hybrid ECDH PQ key exchange TLS groups: X25519MLKEM768, SecP256r1MLKEM768 and SecP384r1MLKEM1024."
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
