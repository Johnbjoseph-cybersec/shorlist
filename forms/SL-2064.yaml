form_kind: "api_string"
language_or_product: "C / OpenSSL 3.5"
negative: false
literal: "return SSL_CTX_set1_sigalgs_list(ctx, \"RSA+SHA256\");"
context_filename: "tls.c"
context_template: |
  #include <openssl/ssl.h>

  long sigalgs(SSL_CTX *ctx)
  {
      return SSL_CTX_set1_sigalgs_list(ctx, "RSA+SHA256");
  }
