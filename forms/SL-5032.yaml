id: "SL-5032"
title: "JCA: PBEKeySpec with a constant salt"
family: "PBKDF2"
parameter_set: null
role: "n.a."
form_kind: "api_call"
language_or_product: "Java / JCA"
negative: false
row_kind: "defect"
literal: "PBEKeySpec spec = new PBEKeySpec(password, \"static-salt-1234\".getBytes(StandardCharsets.UTF_8), 600000, 256);"
context_filename: "Kdf.java"
context_template: |
  import java.nio.charset.StandardCharsets;
  import javax.crypto.SecretKeyFactory;
  import javax.crypto.spec.PBEKeySpec;

  public class Kdf {
      static byte[] derive(char[] password) throws Exception {
          PBEKeySpec spec = new PBEKeySpec(password, "static-salt-1234".getBytes(StandardCharsets.UTF_8), 600000, 256);
          return SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256").generateSecret(spec).getEncoded();
      }
  }
right_template: |
  import java.security.SecureRandom;
  import javax.crypto.SecretKeyFactory;
  import javax.crypto.spec.PBEKeySpec;

  public class Kdf {
      static byte[][] derive(char[] password) throws Exception {
          byte[] salt = new byte[16];
          new SecureRandom().nextBytes(salt);
          PBEKeySpec spec = new PBEKeySpec(password, salt, 600000, 256);
          return new byte[][] {salt, SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256").generateSecret(spec).getEncoded()};
      }
  }
