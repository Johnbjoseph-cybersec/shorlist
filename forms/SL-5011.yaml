literal: "return hmac.new(b\"hardcoded-mac-key\", msg, hashlib.sha256).digest()"
context_filename: "mac.py"
context_template: |
  import hashlib
  import hmac


  def sign(msg):
      return hmac.new(b"hardcoded-mac-key", msg, hashlib.sha256).digest()
right_template: |
  import hashlib
  import hmac
  import os


  def sign(msg):
      return hmac.new(bytes.fromhex(os.environ["MAC_KEY"]), msg, hashlib.sha256).digest()
