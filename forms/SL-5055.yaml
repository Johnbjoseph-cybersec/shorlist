id: "SL-5055"
title: "Node: createHmac with a hard-coded key"
family: "HMAC"
parameter_set: null
role: "mac"
form_kind: "api_call"
language_or_product: "JavaScript / Node.js crypto"
negative: false
row_kind: "defect"
literal: "return crypto.createHmac('sha256', 'hardcoded-mac-key').update(data).digest();"
context_filename: "mac.js"
context_template: |
  const crypto = require('node:crypto');

  function sign(data) {
    return crypto.createHmac('sha256', 'hardcoded-mac-key').update(data).digest();
  }

  module.exports = { sign };
right_template: |
  const crypto = require('node:crypto');

  function sign(data) {
    return crypto.createHmac('sha256', process.env.MAC_KEY).update(data).digest();
  }

  module.exports = { sign };
