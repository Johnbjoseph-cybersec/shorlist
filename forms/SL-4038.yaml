id: "SL-4038"
title: "JCA Signature SHA1withECDSA (signing)"
family: "SHA-1"
parameter_set: null
role: "hash"
form_kind: "api_string"
language_or_product: "Java / JCA"
negative: false
literal: "Signature sig = Signature.getInstance(\"SHA1withECDSA\");"
context_filename: "Signer.java"
context_template: |
  import java.security.PrivateKey;
  import java.security.Signature;

  public class Signer {
      static byte[] sign(PrivateKey key, byte[] data) throws Exception {
          Signature sig = Signature.getInstance("SHA1withECDSA");
          sig.initSign(key);
          sig.update(data);
          return sig.sign();
      }
  }
expected:
  family: "SHA-1"
  role: "hash"
  size: "undetermined"
weakness:
