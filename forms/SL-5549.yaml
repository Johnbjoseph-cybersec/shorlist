id: "SL-5549"
title: "OpenSSL: SSL_CTX_set_min_proto_version(ctx, TLS1_VERSION)"
family: "TLS"
parameter_set: null
role: "n.a."
form_kind: "api_call"
language_or_product: "C / OpenSSL 3.5"
row_kind: "defect"
negative: false
literal: "SSL_CTX_set_min_proto_version(ctx, TLS1_VERSION);"
context_filename: "client.c"
context_template: |
  #include <openssl/ssl.h>

  SSL_CTX *client_ctx(void)
  {
      SSL_CTX *ctx = SSL_CTX_new(TLS_client_method());
      if (ctx == NULL)
          return NULL;
      SSL_CTX_set_min_proto_version(ctx, TLS1_VERSION);
      return ctx;
  }
right_template: |
  #include <openssl/ssl.h>

  SSL_CTX *client_ctx(void)
  {
      SSL_CTX *ctx = SSL_CTX_new(TLS_client_method());
      if (ctx == NULL)
          return NULL;
      SSL_CTX_set_min_proto_version(ctx, TLS1_2_VERSION);
      return ctx;
  }
expected:
  family: "TLS"
  role: "undetermined"
  size: "undetermined"
defect:
  cwe: "CWE-327"
source:
  - url: "https://cwe.mitre.org/data/definitions/327.html"
    section: "CWE-327, Description"
    read_at: "2026-11-06"
    quote: "The product uses a broken or risky cryptographic algorithm or protocol."
  - url: "https://www.rfc-editor.org/rfc/rfc8996.txt"
    section: "RFC 8996, Section 2"
    read_at: "2026-11-06"
    quote: "TLS 1.0 MUST NOT be used. Negotiation of TLS 1.0 from any version of TLS MUST NOT be permitted."
  - url: "https://docs.openssl.org/3.5/man3/SSL_CTX_set_min_proto_version/"
    section: "SSL_CTX_set_min_proto_version(3), DESCRIPTION"
    read_at: "2026-11-06"
    quote: "Currently supported versions are SSL3_VERSION, TLS1_VERSION, TLS1_1_VERSION, TLS1_2_VERSION, TLS1_3_VERSION for TLS and DTLS1_VERSION, DTLS1_2_VERSION for DTLS."
