status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-07"
notes: "A valid enum value that a private deployment's trusted root may carry; the registry and the enum both say ML-DSA is not yet fully functional in Sigstore (checked 2026-11-07), and sigstore-python v4.5.1 has no ML-DSA entry in its algorithm table. The row scores naming the form, not whether a client accepts it. The same object is the trustedRoot member of the client trust config that model_signing sign/verify take through --trust_config (README, Model Signing CLI). raw_bytes is optional in the message and is left out so that no encoded key stands in the template; the keyId is a placeholder."
