  - url: "https://github.com/sigstore/protobuf-specs/blob/v0.5.2/protos/sigstore_common.proto#L173"
    section: "message PublicKey"
    read_at: "2026-11-07"
    quote: "PublicKeyDetails key_details = 2;"
  - url: "https://github.com/sigstore/protobuf-specs/blob/v0.5.2/protos/sigstore_common.proto#L119"
    section: "enum PublicKeyDetails, ML-DSA comment"
    read_at: "2026-11-07"
    quote: "// they are not yet fully functional. This warning will be removed when "
  - url: "https://github.com/sigstore/architecture-docs/blob/60730f3251c28a96920c718bc65a59ad69ef2dc4/algorithm-registry.md"
    section: "Sigstore Algorithm Registry, Signature Algorithms (ML-DSA)"
    read_at: "2026-11-07"
