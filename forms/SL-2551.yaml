id: "SL-2551"
title: "Android KeyGenParameterSpec secp256r1 for key agreement"
family: "ECDH"
parameter_set: "P-256"
role: "key_establishment"
form_kind: "api_string"
language_or_product: "Kotlin / Android Keystore"
negative: false
literal: "val spec = KeyGenParameterSpec.Builder(\"key1\", KeyProperties.PURPOSE_AGREE_KEY).setAlgorithmParameterSpec(ECGenParameterSpec(\"secp256r1\")).build()"
context_filename: "Spec.kt"
context_template: |
  import android.security.keystore.KeyGenParameterSpec
  import android.security.keystore.KeyProperties
  import java.security.spec.ECGenParameterSpec

  fun main() {
      val spec = KeyGenParameterSpec.Builder("key1", KeyProperties.PURPOSE_AGREE_KEY).setAlgorithmParameterSpec(ECGenParameterSpec("secp256r1")).build()
  }
