id: "SL-5530"
title: "Decoy: Go comment forbidding rsa.EncryptPKCS1v15"
family: "RSA"
parameter_set: null
role: "n.a."
form_kind: "api_call"
language_or_product: "Go / stdlib"
row_kind: "defect"
