id: "SL-4069"
title: "Node createHash('md4')"
family: "MD4"
parameter_set: null
role: "hash"
form_kind: "api_string"
language_or_product: "JavaScript / Node.js crypto"
negative: false
literal: "const digest = crypto.createHash('md4').update(data).digest('hex');"
context_filename: "fp.js"
context_template: |
  const crypto = require('node:crypto');

  function run(data) {
    const digest = crypto.createHash('md4').update(data).digest('hex');
    return digest;
  }

  module.exports = { run };
