    section: "crypto.createHash(algorithm[, options])"
    read_at: "2026-11-06"
    quote: "The available algorithms depend on the version and configuration of OpenSSL on the platform."
  - url: "https://github.com/openssl/openssl/blob/openssl-3.5.0/providers/implementations/include/prov/names.h"
