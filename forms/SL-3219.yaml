id: "SL-3219"
title: "Decoy: cert-manager privateKey RSA in a YAML comment"
family: "RSA"
parameter_set: "4096"
role: "n.a."
form_kind: "config_value"
language_or_product: "cert-manager 1.21 / Certificate"
negative: true
decoy_class: "comment"
literal: "  # privateKey: {algorithm: RSA, size: 4096} until the HSM issuer supports ECDSA"
context_filename: "certificate.yaml"
context_template: |
  apiVersion: cert-manager.io/v1
  kind: Certificate
  metadata:
    name: web
  spec:
    secretName: web-tls
    # privateKey: {algorithm: RSA, size: 4096} until the HSM issuer supports ECDSA
    dnsNames:
      - example.com
    issuerRef:
      name: ca-issuer
expected:
  family: "RSA"
  role: "undetermined"
  size: 4096
source:
  - url: "https://github.com/cert-manager/cert-manager/blob/v1.21.3/pkg/apis/certmanager/v1/types_certificate.go"
    section: "CertificatePrivateKey.Algorithm"
    read_at: "2026-11-05"
    quote: "// If provided, allowed values are either `RSA`, `ECDSA` or `Ed25519`."
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-05"
notes: "The certificate has no privateKey block, so cert-manager's own default applies; the comment names RSA and ECDSA."
