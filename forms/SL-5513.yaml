id: "SL-5513"
title: "openssl pkeyutl -encrypt with -pkeyopt rsa_padding_mode:none"
family: "RSA"
parameter_set: null
role: "encryption"
form_kind: "cli"
language_or_product: "OpenSSL CLI 3.5"
row_kind: "defect"
negative: false
literal: "-pkeyopt rsa_padding_mode:none"
context_filename: "wrap.sh"
context_template: |
  #!/bin/sh
  set -e
  openssl pkeyutl -encrypt -pubin -inkey pub.pem -in session.key -out session.key.enc -pkeyopt rsa_padding_mode:none
right_template: |
  #!/bin/sh
  set -e
  openssl pkeyutl -encrypt -pubin -inkey pub.pem -in session.key -out session.key.enc -pkeyopt rsa_padding_mode:oaep
expected:
  family: "RSA"
  role: "encryption"
  size: "undetermined"
defect:
  cwe: "CWE-780"
source:
  - url: "https://cwe.mitre.org/data/definitions/780.html"
    section: "CWE-780, Description"
    read_at: "2026-11-06"
    quote: "The product uses the RSA algorithm but does not incorporate Optimal Asymmetric Encryption Padding (OAEP)."
  - url: "https://www.rfc-editor.org/rfc/rfc8017.txt"
    section: "RFC 8017, Section 7 (Encryption Schemes)"
    read_at: "2026-11-06"
    quote: "RSAES-OAEP is REQUIRED to be supported for new applications; RSAES-PKCS1-v1_5 is included only for compatibility with existing applications."
  - url: "https://docs.openssl.org/3.5/man1/openssl-pkeyutl/"
    section: "openssl-pkeyutl(1), RSA ALGORITHM: rsa_padding_mode:mode"
    read_at: "2026-11-06"
    quote: "rsa_padding_mode:mode This sets the RSA padding mode. Acceptable values for mode are pkcs1 for PKCS#1 padding, none for no padding, oaep for OAEP mode, x931 for X9.31 mode and pss for PSS."
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
