id: "SL-2090"
title: "BoringSSL TLS: group id SSL_GROUP_MLKEM1024"
family: "ML-KEM"
parameter_set: "ML-KEM-1024"
role: "key_establishment"
form_kind: "api_call"
language_or_product: "C / BoringSSL"
negative: false
literal: "static const uint16_t kGroups[] = {SSL_GROUP_MLKEM1024};"
context_filename: "tls.c"
context_template: |
  #include <openssl/base.h>
  #include <openssl/ssl.h>

  static const uint16_t kGroups[] = {SSL_GROUP_MLKEM1024};

  int groups(SSL_CTX *ctx)
  {
      return SSL_CTX_set1_group_ids(ctx, kGroups, 1);
  }
expected:
  family: "ML-KEM"
  role: "key_establishment"
  size: "undetermined"
source:
  - url: "https://github.com/google/boringssl/blob/0.20261020.0/include/openssl/ssl.h"
    section: "include/openssl/ssl.h: SSL_GROUP_MLKEM1024"
    read_at: "2026-11-05"
    quote: "#define SSL_GROUP_MLKEM1024 0x0202"
  - url: "https://github.com/google/boringssl/blob/0.20261020.0/include/openssl/ssl.h"
    section: "include/openssl/ssl.h: SSL_CTX_set1_group_ids"
    read_at: "2026-11-05"
    quote: "SSL_CTX_set1_group_ids sets the preferred groups for `ctx` to `group_ids`."
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-05"
notes: "openssl/base.h is BoringSSL's own header; with OpenSSL headers installed it is missing, so the syntax check falls back to delimiters instead of resolving SSL_GROUP_* against OpenSSL's ssl.h."
