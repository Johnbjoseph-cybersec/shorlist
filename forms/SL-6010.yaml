id: "SL-6010"
title: "Android Kotlin: PBEKeySpec with a constant salt"
family: "PBKDF2"
parameter_set: null
role: "n.a."
form_kind: "api_call"
language_or_product: "Kotlin / Android JCA"
negative: false
row_kind: "defect"
literal: "val spec = PBEKeySpec(password, \"static-salt-1234\".toByteArray(), 600000, 256)"
context_filename: "Kdf.kt"
context_template: |
  import javax.crypto.SecretKeyFactory
  import javax.crypto.spec.PBEKeySpec

  fun derive(password: CharArray): ByteArray {
      val spec = PBEKeySpec(password, "static-salt-1234".toByteArray(), 600000, 256)
      return SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256").generateSecret(spec).encoded
  }
right_template: |
  import java.security.SecureRandom
  import javax.crypto.SecretKeyFactory
  import javax.crypto.spec.PBEKeySpec

  fun derive(password: CharArray): Pair<ByteArray, ByteArray> {
      val salt = ByteArray(16).also { SecureRandom().nextBytes(it) }
      val spec = PBEKeySpec(password, salt, 600000, 256)
      return salt to SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256").generateSecret(spec).encoded
  }
