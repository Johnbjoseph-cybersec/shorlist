id: "SL-5504"
title: "Go crypto/rsa: rsa.EncryptPKCS1v15"
family: "RSA"
cyclonedx_family: "RSAES-PKCS1"
parameter_set: null
role: "encryption"
form_kind: "api_call"
language_or_product: "Go / stdlib"
row_kind: "defect"
negative: false
literal: "ciphertext, err := rsa.EncryptPKCS1v15(rand.Reader, pub, msg)"
context_filename: "wrap.go"
context_template: |
  package wrap

  import (
  	"crypto/rand"
  	"crypto/rsa"
  )

  func Wrap(pub *rsa.PublicKey, msg []byte) ([]byte, error) {
  	ciphertext, err := rsa.EncryptPKCS1v15(rand.Reader, pub, msg)
  	return ciphertext, err
  }
right_template: |
  package wrap

  import (
  	"crypto/sha256"
  	"crypto/rand"
  	"crypto/rsa"
  )

  func Wrap(pub *rsa.PublicKey, msg []byte) ([]byte, error) {
  	ciphertext, err := rsa.EncryptOAEP(sha256.New(), rand.Reader, pub, msg, nil)
  	return ciphertext, err
  }
