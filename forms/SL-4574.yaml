id: "SL-4574"
title: "Apache mod_ssl: SSLCipherSuite RC4-MD5 (RC4)"
family: "RC4"
parameter_set: null
role: "encryption"
form_kind: "config_value"
language_or_product: "Apache httpd mod_ssl"
negative: false
literal: "SSLCipherSuite RC4-MD5"
context_filename: "httpd.conf"
context_template: |
  Listen 443
  <VirtualHost *:443>
      SSLEngine on
      SSLCertificateFile cert.pem
      SSLCertificateKeyFile key.pem
      SSLCipherSuite RC4-MD5
  </VirtualHost>
expected:
  family: "RC4"
  role: "encryption"
  size: "undetermined"
weakness:
  status: "disallowed"
  anchor: "RFC 7465, Section 2"
  quote: "TLS servers MUST NOT select an RC4 cipher suite when a TLS client sends such a cipher suite in the ClientHello message."
source:
  - url: "https://httpd.apache.org/docs/2.4/mod/mod_ssl.html"
    section: "SSLCipherSuite Directive"
    read_at: "2026-11-06"
    quote: "Syntax: | SSLCipherSuite [protocol] cipher-spec"
  - url: "https://docs.openssl.org/3.5/man1/openssl-ciphers/"
    section: "CIPHER SUITE NAMES"
    read_at: "2026-11-06"
    quote: "TLS_RSA_WITH_RC4_128_MD5 RC4-MD5"
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "The OpenSSL name RC4-MD5 is TLS_RSA_WITH_RC4_128_MD5; its key exchange and authentication are on the quantum axis, this row is scored on RC4. OpenSSL 3.x builds RC4 suites only with enable-weak-ssl-ciphers; the configuration text is the form either way. The certificate file names are placeholders and carry no algorithm."
