id: "SL-5031"
title: "JCA: Mac.init with a hard-coded HmacSHA256 key"
family: "HMAC"
parameter_set: null
role: "mac"
form_kind: "api_call"
language_or_product: "Java / JCA"
negative: false
row_kind: "defect"
literal: "mac.init(new SecretKeySpec(\"hardcoded-mac-key\".getBytes(StandardCharsets.UTF_8), \"HmacSHA256\"));"
context_filename: "Sign.java"
context_template: |
  import java.nio.charset.StandardCharsets;
  import javax.crypto.Mac;
  import javax.crypto.spec.SecretKeySpec;

  public class Sign {
      static byte[] sign(byte[] msg) throws Exception {
          Mac mac = Mac.getInstance("HmacSHA256");
          mac.init(new SecretKeySpec("hardcoded-mac-key".getBytes(StandardCharsets.UTF_8), "HmacSHA256"));
          return mac.doFinal(msg);
      }
  }
right_template: |
  import java.util.Base64;
  import javax.crypto.Mac;
  import javax.crypto.spec.SecretKeySpec;

  public class Sign {
      static byte[] sign(byte[] msg) throws Exception {
          Mac mac = Mac.getInstance("HmacSHA256");
          mac.init(new SecretKeySpec(Base64.getDecoder().decode(System.getenv("MAC_KEY")), "HmacSHA256"));
          return mac.doFinal(msg);
      }
  }
expected:
