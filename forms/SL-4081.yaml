id: "SL-4081"
title: "OpenSSL EVP_des_ede3_cbc() for encryption"
family: "3DES"
parameter_set: "three-key"
role: "encryption"
form_kind: "api_call"
language_or_product: "C / OpenSSL 3.5"
negative: false
literal: "return EVP_EncryptInit_ex(ctx, EVP_des_ede3_cbc(), NULL, key, iv);"
context_filename: "enc.c"
context_template: |
  #include <openssl/evp.h>

  int init(EVP_CIPHER_CTX *ctx, const unsigned char *key, const unsigned char *iv)
  {
      return EVP_EncryptInit_ex(ctx, EVP_des_ede3_cbc(), NULL, key, iv);
  }
expected:
  family: "3DES"
  role: "encryption"
  size: "undetermined"
weakness:
  status: "disallowed"
  anchor: "NIST SP 800-131A Rev. 2, Section 2, Table 1: three-key TDEA encryption"
  quote: "After December 31, 2023, three-key TDEA is disallowed for encryption unless specifically allowed by other NIST guidance."
source:
  - url: "https://docs.openssl.org/3.5/man3/EVP_des_cbc/"
    section: "EVP_des_ede3_cbc: SYNOPSIS/DESCRIPTION"
    read_at: "2026-11-06"
    quote: "EVP_des_ede3(), EVP_des_ede3_cbc(), EVP_des_ede3_cfb()"
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "SP 800-131A Rev. 2 Table 1's encryption status is taken (decryption alone would be legacy use). Two-key TDEA encryption is disallowed as well, so the status holds whichever keying option the key length selects."
