id: "SL-5082"
title: "C: rand() for key bytes"
family: "RNG"
parameter_set: null
role: "n.a."
form_kind: "api_call"
language_or_product: "C / libc"
negative: false
row_kind: "defect"
literal: "key[i] = (unsigned char)rand();"
context_filename: "keys.c"
context_template: |
  #include <stdlib.h>

  void new_key(unsigned char key[32])
  {
      for (int i = 0; i < 32; i++)
          key[i] = (unsigned char)rand();
  }
right_template: |
  #include <openssl/rand.h>

  int new_key(unsigned char key[32])
  {
      return RAND_bytes(key, 32);
  }
