id: "SL-4636"
title: "Decoy: MD5withRSA in the JDK TLS ban list"
family: "MD5"
parameter_set: null
role: "n.a."
form_kind: "config_value"
language_or_product: "Java / java.security (JDK 24)"
negative: true
decoy_class: "ban_list"
literal: "jdk.tls.disabledAlgorithms=MD5withRSA"
context_filename: "java.security"
context_template: |
  # Site override of the JDK security properties.
  jdk.tls.disabledAlgorithms=MD5withRSA
expected:
  family: "MD5"
  role: "hash"
  size: "undetermined"
weakness:
  status: "disallowed"
  anchor: "RFC 6151, Section 2"
  quote: "MD5 is no longer acceptable where collision resistance is required such as digital signatures."
source:
  - url: "https://github.com/openjdk/jdk/blob/jdk-24-ga/src/java.base/share/conf/security/java.security"
    section: "conf/security/java.security (jdk-24-ga), default value"
    read_at: "2026-11-06"
    quote: "MD5withRSA, DH keySize < 1024, EC keySize < 224, 3DES_EDE_CBC, anon, NULL,"
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "A deny list: names MD5 only to forbid it. The value is part of the JDK 24 default, set on one line."
