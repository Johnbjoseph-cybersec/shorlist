id: "SL-4637"
title: "Decoy: SHA1 in the JDK certpath ban list"
family: "SHA-1"
parameter_set: null
role: "n.a."
form_kind: "config_value"
language_or_product: "Java / java.security (JDK 24)"
negative: true
decoy_class: "ban_list"
literal: "jdk.certpath.disabledAlgorithms=SHA1 jdkCA & usage TLSServer"
context_filename: "java.security"
context_template: |
  # Site override of the JDK security properties.
  jdk.certpath.disabledAlgorithms=SHA1 jdkCA & usage TLSServer
expected:
  family: "SHA-1"
  role: "hash"
  size: "undetermined"
weakness:
  status: "disallowed"
  anchor: "NIST SP 800-131A Rev. 2, Section 9 (Table 8), SHA-1 for digital signature generation"
  quote: "For all other applications, SHA-1 is disallowed for digital signature generation."
source:
  - url: "https://github.com/openjdk/jdk/blob/jdk-24-ga/src/java.base/share/conf/security/java.security"
    section: "conf/security/java.security (jdk-24-ga), default value"
    read_at: "2026-11-06"
    quote: "jdk.certpath.disabledAlgorithms=MD2, MD5, SHA1 jdkCA & usage TLSServer,"
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "A deny list: names SHA-1 only to forbid it. The value is part of the JDK 24 default, set on one line."
