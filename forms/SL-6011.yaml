id: "SL-6011"
title: "Android Kotlin: PBEKeySpec with 100 iterations"
family: "PBKDF2"
parameter_set: null
role: "n.a."
form_kind: "api_call"
language_or_product: "Kotlin / Android JCA"
negative: false
row_kind: "defect"
literal: "val spec = PBEKeySpec(password, salt, 100, 256)"
context_filename: "Kdf.kt"
context_template: |
  import javax.crypto.SecretKeyFactory
  import javax.crypto.spec.PBEKeySpec

  fun derive(password: CharArray, salt: ByteArray): ByteArray {
      val spec = PBEKeySpec(password, salt, 100, 256)
      return SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256").generateSecret(spec).encoded
  }
right_template: |
  import javax.crypto.SecretKeyFactory
  import javax.crypto.spec.PBEKeySpec

  fun derive(password: CharArray, salt: ByteArray): ByteArray {
      val spec = PBEKeySpec(password, salt, 600000, 256)
      return SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256").generateSecret(spec).encoded
  }
expected:
  family: "PBKDF2"
  role: "undetermined"
  size: "undetermined"
