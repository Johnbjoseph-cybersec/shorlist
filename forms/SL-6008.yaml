id: "SL-6008"
title: "Android Kotlin: AES/CBC with IvParameterSpec(ByteArray(16))"
family: "AES"
parameter_set: null
role: "encryption"
form_kind: "api_call"
language_or_product: "Kotlin / Android JCA"
negative: false
row_kind: "defect"
literal: "cipher.init(Cipher.ENCRYPT_MODE, key, IvParameterSpec(ByteArray(16)))"
context_filename: "Crypto.kt"
context_template: |
  import javax.crypto.Cipher
  import javax.crypto.SecretKey
  import javax.crypto.spec.IvParameterSpec

  fun encrypt(key: SecretKey, padded: ByteArray): ByteArray {
      val cipher = Cipher.getInstance("AES/CBC/PKCS5Padding")
      cipher.init(Cipher.ENCRYPT_MODE, key, IvParameterSpec(ByteArray(16)))
      return cipher.doFinal(padded)
  }
right_template: |
  import java.security.SecureRandom
  import javax.crypto.Cipher
  import javax.crypto.SecretKey
  import javax.crypto.spec.IvParameterSpec

  fun encrypt(key: SecretKey, padded: ByteArray): ByteArray {
      val cipher = Cipher.getInstance("AES/CBC/PKCS5Padding")
      val iv = ByteArray(16).also { SecureRandom().nextBytes(it) }
      cipher.init(Cipher.ENCRYPT_MODE, key, IvParameterSpec(iv))
      return iv + cipher.doFinal(padded)
  }
