id: "SL-4634"
title: "Decoy: DES in the JDK TLS ban list"
family: "DES"
parameter_set: null
role: "n.a."
form_kind: "config_value"
language_or_product: "Java / java.security (JDK 24)"
negative: true
decoy_class: "ban_list"
literal: "jdk.tls.disabledAlgorithms=DES"
context_filename: "java.security"
context_template: |
  # Site override of the JDK security properties.
  jdk.tls.disabledAlgorithms=DES
expected:
  family: "DES"
  role: "encryption"
  size: "undetermined"
weakness:
  status: "disallowed"
  anchor: "RFC 9325 (BCP 195), Section 4.1"
  quote: "Implementations MUST NOT negotiate cipher suites offering less than 112 bits of security, including so-called \"export-level\" encryption (which provides 40 or 56 bits of security)."
source:
  - url: "https://github.com/openjdk/jdk/blob/jdk-24-ga/src/java.base/share/conf/security/java.security"
    section: "conf/security/java.security (jdk-24-ga), default value"
    read_at: "2026-11-06"
    quote: "jdk.tls.disabledAlgorithms=SSLv3, TLSv1, TLSv1.1, DTLSv1.0, RC4, DES,"
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "A deny list: names DES only to forbid it. The value is part of the JDK 24 default, set on one line."
