id: "SL-5037"
title: "Go: block-by-block cipher.Block.Encrypt (ECB by hand)"
family: "AES"
parameter_set: null
role: "encryption"
form_kind: "api_call"
language_or_product: "Go / stdlib"
negative: false
row_kind: "defect"
literal: "block.Encrypt(out[i:i+aes.BlockSize], data[i:i+aes.BlockSize])"
context_filename: "enc.go"
context_template: |
  package crypt

  import "crypto/aes"

  func Encrypt(key, data []byte) ([]byte, error) {
  	block, err := aes.NewCipher(key)
  	if err != nil {
  		return nil, err
  	}
  	out := make([]byte, len(data))
  	for i := 0; i < len(data); i += aes.BlockSize {
  		block.Encrypt(out[i:i+aes.BlockSize], data[i:i+aes.BlockSize])
  	}
  	return out, nil
  }
right_template: |
  package crypt

  import (
  	"crypto/aes"
  	"crypto/cipher"
  	"crypto/rand"
  )

  func Encrypt(key, data []byte) ([]byte, error) {
  	block, err := aes.NewCipher(key)
  	if err != nil {
  		return nil, err
  	}
  	gcm, err := cipher.NewGCM(block)
  	if err != nil {
  		return nil, err
  	}
  	nonce := make([]byte, gcm.NonceSize())
  	rand.Read(nonce)
  	return gcm.Seal(nonce, nonce, data, nil), nil
  }
expected:
  family: "AES"
  role: "encryption"
  size: "undetermined"
defect:
  cwe: "CWE-327"
