id: "SL-5515"
title: "PyCryptodome: RSA.generate(2048, e=3)"
family: "RSA"
parameter_set: "2048"
role: "both"
form_kind: "api_call"
language_or_product: "Python / PyCryptodome"
row_kind: "defect"
negative: false
literal: "key = RSA.generate(2048, e=3)"
context_filename: "keygen.py"
context_template: |
  from Crypto.PublicKey import RSA

  key = RSA.generate(2048, e=3)
right_template: |
  from Crypto.PublicKey import RSA

  key = RSA.generate(2048)
expected:
  family: "RSA"
  role: "undetermined"
  size: 2048
defect:
  cwe: "CWE-326"
source:
  - url: "https://cwe.mitre.org/data/definitions/326.html"
    section: "CWE-326, Description"
    read_at: "2026-11-06"
    quote: "The product stores or transmits sensitive data using an encryption scheme that is theoretically sound, but is not strong enough for the level of protection required."
  - url: "https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.186-5.pdf"
    section: "FIPS 186-5, Appendix A.1.1, criterion 1(b)"
    read_at: "2026-11-06"
    quote: "(b) The exponent e shall be an odd positive integer such that:"
  - url: "https://www.pycryptodome.org/src/public_key/rsa.html"
    section: "Crypto.PublicKey.RSA.generate(bits, randfunc=None, e=65537)"
    read_at: "2026-11-06"
    quote: "e (integer) – Public RSA exponent. It must be an odd positive integer. It is typically a small number with very few ones in its binary representation. The FIPS standard requires the public exponent to be at least 65537 (the default)."
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-06"
notes: "CWE-326 is the closest MITRE entry; its Description is generic (encryption not strong enough for the protection required) and names no exponent. The requirement itself is FIPS 186-5 A.1.1: 2^16 < e < 2^256."
