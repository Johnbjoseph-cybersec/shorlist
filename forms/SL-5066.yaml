id: "SL-5066"
title: ".NET: SymmetricAlgorithm.Key from a string literal"
family: "AES"
parameter_set: null
role: "encryption"
form_kind: "api_call"
language_or_product: "C# / .NET"
negative: false
row_kind: "defect"
literal: "aes.Key = Encoding.UTF8.GetBytes(\"0123456789abcdef0123456789abcdef\");"
context_filename: "Enc.cs"
context_template: |
  using System.Security.Cryptography;
  using System.Text;

  static class Enc
  {
      public static byte[] Encrypt(byte[] data)
      {
          using Aes aes = Aes.Create();
          aes.Key = Encoding.UTF8.GetBytes("0123456789abcdef0123456789abcdef");
          byte[] iv = RandomNumberGenerator.GetBytes(16);
          return [.. iv, .. aes.EncryptCbc(data, iv, PaddingMode.PKCS7)];
      }
  }
right_template: |
  using System;
  using System.Security.Cryptography;

  static class Enc
  {
      public static byte[] Encrypt(byte[] data)
      {
          using Aes aes = Aes.Create();
          aes.Key = Convert.FromBase64String(Environment.GetEnvironmentVariable("DATA_KEY")!);
          byte[] iv = RandomNumberGenerator.GetBytes(16);
          return [.. iv, .. aes.EncryptCbc(data, iv, PaddingMode.PKCS7)];
      }
  }
expected:
  family: "AES"
  role: "encryption"
  size: "undetermined"
defect:
  cwe: "CWE-321"
source:
