id: "SL-4079"
title: "OpenSSL EVP_sha1()"
family: "SHA-1"
parameter_set: null
role: "hash"
form_kind: "api_call"
language_or_product: "C / OpenSSL 3.5"
negative: false
literal: "EVP_DigestInit_ex(ctx, EVP_sha1(), NULL);"
context_filename: "fp.c"
context_template: |
  #include <openssl/evp.h>

  int main(void)
  {
      EVP_MD_CTX *ctx = EVP_MD_CTX_new();
      EVP_DigestInit_ex(ctx, EVP_sha1(), NULL);
      EVP_MD_CTX_free(ctx);
      return 0;
  }
expected:
  family: "SHA-1"
  role: "hash"
  size: "undetermined"
weakness:
  status: "legacy_use"
  anchor: "OWASP ASVS 5.0.0, Appendix C, Hash Functions for General Use Cases: SHA-1 (L)"
  quote: "| SHA-1 | [RFC 3174](https://www.rfc-editor.org/info/rfc3174) & [RFC 6194](https://www.rfc-editor.org/info/rfc6194) | L | Not suitable for HMAC, KDF, RBG, digital signatures |"
source:
