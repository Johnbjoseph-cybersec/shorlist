id: "SL-2550"
title: "Android KeyGenParameterSpec secp256r1 for signing"
family: "ECDSA"
parameter_set: "P-256"
role: "signature"
form_kind: "api_string"
language_or_product: "Kotlin / Android Keystore"
negative: false
literal: "val spec = KeyGenParameterSpec.Builder(\"key1\", KeyProperties.PURPOSE_SIGN).setAlgorithmParameterSpec(ECGenParameterSpec(\"secp256r1\")).build()"
context_filename: "Spec.kt"
context_template: |
  import android.security.keystore.KeyGenParameterSpec
  import android.security.keystore.KeyProperties
  import java.security.spec.ECGenParameterSpec

  fun main() {
      val spec = KeyGenParameterSpec.Builder("key1", KeyProperties.PURPOSE_SIGN).setAlgorithmParameterSpec(ECGenParameterSpec("secp256r1")).build()
  }
expected:
  family: "ECDSA"
  role: "signature"
  size: 256
