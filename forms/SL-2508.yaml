id: "SL-2508"
title: "PHP openssl_pkey_new with the \"ec\" options array (secp384r1)"
family: "EC"
parameter_set: "P-384"
role: "both"
form_kind: "api_string"
language_or_product: "PHP / ext/openssl"
negative: false
literal: "$key = openssl_pkey_new([\"ec\" => [\"curve_name\" => \"secp384r1\"]]);"
context_filename: "keys.php"
context_template: |
  <?php

  $key = openssl_pkey_new(["ec" => ["curve_name" => "secp384r1"]]);
expected:
  family: "EC"
  role: "undetermined"
  size: 384
source:
