    section: "openssl_pkey_new(): Parameters (options), \"ec\" key for Elliptic curve parameters"
    read_at: "2026-11-05"
    quote: "\"ec\" key for Elliptic curve parameters"
  - url: "https://www.php.net/manual/en/function.openssl-get-curve-names.php"
    section: "openssl_get_curve_names(): Description"
    read_at: "2026-11-05"
