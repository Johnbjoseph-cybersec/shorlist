source:
  - url: "https://github.com/ossf/model-signing-spec/blob/91bf841e8ccf97a3ed97309387e9298d1ac18ba2/spec/v1.0.md#111-known-field-differences-across-versions-and-implementations"
    section: "OMS spec v1.0, Section 11.1 Known Field Differences"
    read_at: "2026-11-07"
    quote: "| `publicKey` | `{\"hint\": \"<fingerprint>\"}` | Pre-v1.1.0: `{\"rawBytes\": \"...\", \"keyDetails\": \"...\"}` | MUST accept either `hint` or `rawBytes` |"
  - url: "https://github.com/sigstore/model-transparency/blob/v1.0.0/src/model_signing/_signing/sign_ec_key.py#L135"
    section: "model_signing v1.0.0, Signer._get_verification_material (line 135)"
    read_at: "2026-11-07"
    quote: "key_details = common_pb.PublicKeyDetails.PKIX_ECDSA_P521_SHA_512"
  - url: "https://github.com/sigstore/protobuf-specs/blob/v0.5.2/protos/sigstore_common.proto#L85"
