status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-07"
notes: "Current OMS bundles (v1.1.0+) carry only publicKey.hint and pin no key algorithm; this field appears in bundles written by model_signing v0.3.1 to v1.0.0, which verifiers must still accept (Section 11.2). The template follows the spec's Appendix A placeholders. OMS Section 9 says the bundle SHOULD be named with a .sig extension; the .json suffix here is for the generator's syntax check."
