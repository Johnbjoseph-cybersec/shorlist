id: "SL-3098"
title: "Terraform google_kms_crypto_key algorithm RSA_DECRYPT_OAEP_2048_SHA1"
family: "RSA"
cyclonedx_family: "RSAES-OAEP"
parameter_set: "2048"
role: "key_establishment"
form_kind: "config_value"
language_or_product: "Terraform / hashicorp/google 8.10"
negative: false
literal: "    algorithm = \"RSA_DECRYPT_OAEP_2048_SHA1\""
context_filename: "main.tf"
context_template: |
  resource "google_kms_crypto_key" "key" {
    name     = "app-key"
    key_ring = "projects/example/locations/global/keyRings/app"
    purpose  = "ASYMMETRIC_DECRYPT"

    version_template {
      algorithm = "RSA_DECRYPT_OAEP_2048_SHA1"
    }
  }
expected:
  family: "RSA"
  role: "key_establishment"
  size: 2048
