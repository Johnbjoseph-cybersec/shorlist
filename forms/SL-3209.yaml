id: "SL-3209"
title: "cert-manager Certificate spec.privateKey RSA size 8192"
family: "RSA"
parameter_set: "8192"
role: "both"
form_kind: "config_value"
language_or_product: "cert-manager 1.21 / Certificate"
negative: false
literal: "    size: 8192"
context_filename: "certificate.yaml"
context_template: |
  apiVersion: cert-manager.io/v1
  kind: Certificate
  metadata:
    name: web
  spec:
    secretName: web-tls
    dnsNames:
      - example.com
    issuerRef:
      name: ca-issuer
    privateKey:
      algorithm: RSA
      size: 8192
expected:
  family: "RSA"
  role: "undetermined"
  size: 8192
source:
  - url: "https://github.com/cert-manager/cert-manager/blob/v1.21.3/pkg/apis/certmanager/v1/types_certificate.go"
    section: "CertificatePrivateKey.Size"
    read_at: "2026-11-05"
    quote: "// If `algorithm` is set to `RSA`, valid values are `2048`, `4096` or `8192`,"
status: "verified-source"
added_by: "Stanimir Tenev (Elkan Electronic)"
added_at: "2026-11-05"
notes: "The literal is the size line; algorithm: RSA on the line above sets what the size means."
