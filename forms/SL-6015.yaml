id: "SL-6015"
title: "Android Kotlin: X509TrustManager with an empty checkServerTrusted"
family: "TLS"
parameter_set: null
role: "n.a."
form_kind: "api_call"
language_or_product: "Kotlin / Android (javax.net.ssl)"
negative: false
row_kind: "defect"
literal: "override fun checkServerTrusted(chain: Array<X509Certificate>, authType: String) {}"
context_filename: "TrustAll.kt"
context_template: |
  import java.security.cert.X509Certificate
  import javax.net.ssl.X509TrustManager

  class TrustAll : X509TrustManager {
      override fun checkClientTrusted(chain: Array<X509Certificate>, authType: String) {
          throw UnsupportedOperationException()
      }

      override fun checkServerTrusted(chain: Array<X509Certificate>, authType: String) {}

      override fun getAcceptedIssuers(): Array<X509Certificate> = arrayOf()
  }
right_template: |
  import java.security.cert.X509Certificate
  import javax.net.ssl.X509TrustManager

  class Delegating(private val platform: X509TrustManager) : X509TrustManager {
      override fun checkClientTrusted(chain: Array<X509Certificate>, authType: String) {
          throw UnsupportedOperationException()
      }

      override fun checkServerTrusted(chain: Array<X509Certificate>, authType: String) {
          platform.checkServerTrusted(chain, authType)
      }

      override fun getAcceptedIssuers(): Array<X509Certificate> = arrayOf()
  }
