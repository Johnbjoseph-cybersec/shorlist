# Every code point and quote below is copied from the registry or name table named in `source`
# (read 2026-11-07), not typed by hand. forms/ is not changed by this file.
format: shorlist-wire/0.1
about: 'What a network scanner must see on the wire for each catalogue row whose product terminates a network protocol. Written from the IANA registries and the OpenSSL / OpenSSH name tables read on 2026-11-07;
  forms/ is not changed. `expect: seen` - the item must be reported; `expect: not_seen` - reporting it is a false alarm.'
sources:
  iana-tls-groups:
    title: IANA TLS Supported Groups registry
    url: https://www.iana.org/assignments/tls-parameters/tls-parameters.xhtml#tls-parameters-8
    csv: https://www.iana.org/assignments/tls-parameters/tls-parameters-8.csv
    date_read: '2026-11-07'
  iana-tls-ciphers:
    title: IANA TLS Cipher Suites registry
    url: https://www.iana.org/assignments/tls-parameters/tls-parameters.xhtml#tls-parameters-4
    csv: https://www.iana.org/assignments/tls-parameters/tls-parameters-4.csv
    date_read: '2026-11-07'
  iana-tls-sigschemes:
    title: IANA TLS SignatureScheme registry
    url: https://www.iana.org/assignments/tls-parameters/tls-parameters.xhtml#tls-signaturescheme
    csv: https://www.iana.org/assignments/tls-parameters/tls-signaturescheme.csv
    date_read: '2026-11-07'
  iana-ssh-kex:
    title: IANA SSH Key Exchange Method Names
    url: https://www.iana.org/assignments/ssh-parameters/ssh-parameters.xhtml#ssh-parameters-16
    csv: https://www.iana.org/assignments/ssh-parameters/ssh-parameters-16.csv
    date_read: '2026-11-07'
  iana-ssh-enc:
    title: IANA SSH Encryption Algorithm Names
    url: https://www.iana.org/assignments/ssh-parameters/ssh-parameters.xhtml#ssh-parameters-17
    csv: https://www.iana.org/assignments/ssh-parameters/ssh-parameters-17.csv
    date_read: '2026-11-07'
  iana-ssh-mac:
    title: IANA SSH MAC Algorithm Names
    url: https://www.iana.org/assignments/ssh-parameters/ssh-parameters.xhtml#ssh-parameters-18
    csv: https://www.iana.org/assignments/ssh-parameters/ssh-parameters-18.csv
    date_read: '2026-11-07'
  iana-ssh-pk:
    title: IANA SSH Public Key Algorithm Names
    url: https://www.iana.org/assignments/ssh-parameters/ssh-parameters.xhtml#ssh-parameters-19
    csv: https://www.iana.org/assignments/ssh-parameters/ssh-parameters-19.csv
    date_read: '2026-11-07'
  iana-ikev2-ke:
    title: IANA IKEv2 Transform Type 4 - Key Exchange Method Transform IDs
    url: https://www.iana.org/assignments/ikev2-parameters/ikev2-parameters.xhtml#ikev2-parameters-8
    csv: https://www.iana.org/assignments/ikev2-parameters/ikev2-parameters-8.csv
    date_read: '2026-11-07'
  openssl-ciphers-man:
    title: OpenSSL 3.5 openssl-ciphers(1), section CIPHER SUITE NAMES (OpenSSL name <-> standard name)
    url: https://docs.openssl.org/3.5/man1/openssl-ciphers/
    date_read: '2026-11-07'
  openssh-ssh-Q:
    title: OpenSSH_10.3p1 `ssh -Q kex|cipher|mac|HostKeyAlgorithms` in the harness image (names with @openssh.com / @libssh.org are vendor names, not in the IANA registry)
    url: https://man.openbsd.org/ssh#Q
    date_read: '2026-11-07'
  rfc8308:
    title: RFC 8308 section 3.1 server-sig-algs
    url: https://www.rfc-editor.org/rfc/rfc8308#section-3.1
    date_read: '2026-11-07'
    quote: This extension is sent by the server and contains a list of public key algorithms that the server is able to process as part of a "publickey" authentication request.
rows:
  SL-0011:
    product: nginx
    literal: ssl_ecdh_curve X25519MLKEM768;
    negative: false
    protocol: tls
    server: nginx
    planting: verbatim
    cert: rsa
    items:
    - kind: group
      code: '0x11EC'
      name: X25519MLKEM768
      aliases:
      - X25519MLKEM768
      expect: seen
      source: iana-tls-groups
      quote: 4588,X25519MLKEM768,Y,Y,[RFC 10024],Combining X25519 ECDH with ML-KEM-768
  SL-0012:
    product: nginx
    literal: ssl_ciphers AES128-GCM-SHA256;
    negative: false
    protocol: tls
    server: nginx
    planting: verbatim
    cert: rsa
    items:
    - kind: cipher_suite
      code: '0x009C'
      name: TLS_RSA_WITH_AES_128_GCM_SHA256
      aliases:
      - AES128-GCM-SHA256
      expect: seen
      source:
      - openssl-ciphers-man
      - iana-tls-ciphers
      quote:
      - TLS_RSA_WITH_AES_128_GCM_SHA256 AES128-GCM-SHA256
      - '"0x00,0x9C",TLS_RSA_WITH_AES_128_GCM_SHA256,Y,D,[RFC 5288]; [RFC 10015],'
  SL-0013:
    product: OpenSSH sshd
    literal: HostKeyAlgorithms rsa-sha2-512
    negative: false
    protocol: ssh
    server: openssh
    planting: verbatim+hostkeys
    items:
    - kind: hostkey
      name: rsa-sha2-512
      expect: seen
      source: iana-ssh-pk
      quote: rsa-sha2-512,ssh-rsa,[RFC 8332],Section 3
  SL-0014:
    product: OpenSSH sshd
    literal: PubkeyAcceptedAlgorithms ecdsa-sha2-nistp256
    negative: false
    protocol: ssh
    server: openssh
    planting: verbatim+hostkeys
    note: PubkeyAcceptedAlgorithms is not in KEXINIT; OpenSSH announces it in the server-sig-algs extension (RFC 8308), sent encrypted after key exchange. A scanner sees it only if it completes key exchange
      and reports EXT_INFO.
    items:
    - kind: server_sig_alg
      name: ecdsa-sha2-nistp256
      expect: seen
      source:
      - iana-ssh-pk
      - rfc8308
      quote: ecdsa-sha2-*,ecdsa-sha2-*,[RFC 5656],
  SL-0015:
