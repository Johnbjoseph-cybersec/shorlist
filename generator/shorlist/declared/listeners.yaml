# The live listeners whose accepted sets are the observations of this axis. Each is planted from the
# network axis's server images (servers.py), probed by declared/probe.py, and the result is written to
# observations/<id>.json by `python -m shorlist declared --capture`. Several rows share one listener.
# A listener is configured to be a plausible product listener; the rows' declarations, not these
# configurations, carry the decoys. Nothing here is a catalogue row and forms/ is not changed.
format: shorlist-declared-listeners/0.1
listeners:

  L-NGX-1:
    about: nginx, TLS 1.3 only, hybrid ML-KEM group first, two AES-GCM suites
    server: nginx
    cert: rsa
    config: |
      events {}

      http {
          server {
              listen 443 ssl;
              ssl_certificate     cert.pem;
              ssl_certificate_key key.pem;
              ssl_protocols TLSv1.3;
              ssl_ecdh_curve X25519MLKEM768:x25519;
              ssl_conf_command Ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384;
          }
      }

  L-NGX-2:
    about: nginx, TLS 1.2 and 1.3, ECDHE-RSA AES-GCM for 1.2, three groups
    server: nginx
    cert: rsa
    config: |
      events {}

      http {
          server {
              listen 443 ssl;
              ssl_certificate     cert.pem;
              ssl_certificate_key key.pem;
              ssl_protocols TLSv1.2 TLSv1.3;
              ssl_ecdh_curve X25519MLKEM768:x25519:secp256r1;
              ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
              ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384;
          }
      }

  L-NGX-3:
    about: nginx, TLS 1.2 only, P-384 only (RSA certificate; see probe.py on ECDSA certificates in TLS 1.2)
    server: nginx
    cert: rsa
    config: |
      events {}

      http {
          server {
              listen 443 ssl;
              ssl_certificate     cert.pem;
              ssl_certificate_key key.pem;
              ssl_protocols TLSv1.2;
              ssl_ecdh_curve secp384r1;
              ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256;
          }
      }

  L-NGX-4:
    about: nginx, TLS 1.3 only, NIST-curve hybrids plus P-384
    server: nginx
    cert: rsa
    config: |
      events {}

      http {
          server {
              listen 443 ssl;
              ssl_certificate     cert.pem;
              ssl_certificate_key key.pem;
              ssl_protocols TLSv1.3;
              ssl_ecdh_curve SecP256r1MLKEM768:SecP384r1MLKEM1024:secp384r1;
          }
      }

  L-APA-1:
    about: Apache httpd, TLS 1.3 only, hybrid + P-256, AES-256 and ChaCha20
    server: apache
    cert: rsa
    config: |
      Listen 443
      <VirtualHost *:443>
          SSLEngine on
          SSLCertificateFile cert.pem
          SSLCertificateKeyFile key.pem
          SSLProtocol -all +TLSv1.3
          SSLOpenSSLConfCmd Groups X25519MLKEM768:secp256r1
          SSLCipherSuite TLSv1.3 TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
      </VirtualHost>

  L-APA-2:
    about: Apache httpd, TLS 1.2 only, ECDHE / DHE / static-RSA AES-128-GCM
    server: apache
    cert: rsa
    config: |
      Listen 443
      <VirtualHost *:443>
          SSLEngine on
          SSLCertificateFile cert.pem
          SSLCertificateKeyFile key.pem
          SSLProtocol -all +TLSv1.2
          SSLOpenSSLConfCmd Groups x25519:secp256r1
          SSLCipherSuite ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES128-GCM-SHA256:AES128-GCM-SHA256
      </VirtualHost>

  L-APA-3:
    about: Apache httpd, TLS 1.2 and 1.3, pure ML-KEM-768 next to x25519
    server: apache
    cert: rsa
    config: |
      Listen 443
      <VirtualHost *:443>
          SSLEngine on
          SSLCertificateFile cert.pem
          SSLCertificateKeyFile key.pem
          SSLProtocol -all +TLSv1.2 +TLSv1.3
          SSLOpenSSLConfCmd Groups MLKEM768:x25519
          SSLCipherSuite ECDHE-RSA-AES256-GCM-SHA384
          SSLCipherSuite TLSv1.3 TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
      </VirtualHost>

  L-SSV-1:
    about: openssl s_server, TLS 1.3 only, pure ML-KEM-768 and ML-KEM-1024
    server: s_server
    cert: rsa
    args: [-tls1_3, -groups, 'MLKEM768:MLKEM1024', -ciphersuites, 'TLS_AES_256_GCM_SHA384']

  L-SSV-2:
    about: openssl s_server, TLS 1.3 only, x25519 / x448 / ffdhe2048
    server: s_server
    cert: rsa
    args: [-tls1_3, -groups, 'x25519:x448:ffdhe2048', -ciphersuites, 'TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256']

  L-SSV-3:
    about: openssl s_server, TLS 1.2 only, P-521 and P-256, ECDHE-RSA with ChaCha20 and AES-128-GCM
    server: s_server
    cert: rsa
    args: [-tls1_2, -groups, 'secp521r1:secp256r1', -cipher, 'ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256']

  L-SSV-4:
    about: openssl s_server, TLS 1.2 and 1.3, all three standard hybrids, ECDSA certificate
    server: s_server
    cert: ecdsa
    args: [-groups, 'X25519MLKEM768:SecP256r1MLKEM768:SecP384r1MLKEM1024:secp256r1', -cipher, 'ECDHE-ECDSA-AES128-GCM-SHA256', -ciphersuites, 'TLS_AES_128_GCM_SHA256']

  L-SSV-5:
    about: openssl s_server, TLS 1.2 only, legacy CBC and DHE suites next to AES-GCM
    server: s_server
    cert: rsa
    args: [-tls1_2, -groups, 'secp256r1', -cipher, 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-SHA:AES128-SHA:DHE-RSA-AES256-GCM-SHA384']
