id: SLD-0009
title: TLS 1.2 suites declared by OpenSSL name, and by OpenSSL name + bytes
verdict: consistent
decoy_class: identifier_spelling
compare:
  protocol: tls
  category: cipher_suite
listener: L-NGX-2
listener_url: tls://srv:443
focus: null
expected_report: no discrepancy in cipher_suite
false_alarm_if: any undeclared, overclaimed or parameter_mismatch cipher_suite is reported
why: nginx is configured with OpenSSL names (ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256); a vendor copies them. The wire and
  the IANA registry use TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256 / 0xC02F.
declaration:
  bomFormat: CycloneDX
  specVersion: '1.7'
  version: 1
  metadata:
    component:
      type: application
      name: example-gateway
      version: '4.2'
      bom-ref: product
    supplier:
      name: Example Vendor
  components:
  - type: cryptographic-asset
    name: TLSv1.3
    bom-ref: proto/tls13
    cryptoProperties:
      assetType: protocol
      protocolProperties:
        type: tls
        version: '1.3'
        cipherSuites:
        - name: TLS_AES_256_GCM_SHA384
          identifiers:
          - 0x13,0x02
  - type: cryptographic-asset
    name: TLSv1.2
    bom-ref: proto/tls12
    cryptoProperties:
      assetType: protocol
      protocolProperties:
        type: tls
        version: '1.2'
        cipherSuites:
        - name: ECDHE-RSA-AES128-GCM-SHA256
        - name: ECDHE-RSA-AES256-GCM-SHA384
          identifiers:
          - '0xC0'
          - '0x30'
resolves_to:
- spelled: '[''0x13,0x02'']'
  code: '0x1302'
  source: iana-tls-ciphers
  quote: '"0x13,0x02",TLS_AES_256_GCM_SHA384,Y,Y,[RFC 9846],'
  at: proto/tls13 cipherSuites[0]
- spelled: ECDHE-RSA-AES128-GCM-SHA256
  code: '0xC02F'
  source:
  - iana-tls-ciphers
  - openssl-ciphers-V
  quote:
  - '"0xC0,0x2F",TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,Y,Y,[RFC 5289],'
  - 0xC0,0x2F - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256         - ECDHE-RSA-AES128-GCM-SHA256    TLSv1.2 Kx=ECDH     Au=RSA   Enc=AESGCM(128)            Mac=AEAD
  at: proto/tls12 cipherSuites[0]
- spelled: ECDHE-RSA-AES256-GCM-SHA384 / ['0xC0','0x30']
  code: '0xC030'
  source:
  - iana-tls-ciphers
  - openssl-ciphers-V
  quote:
  - '"0xC0,0x30",TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,Y,Y,[RFC 5289],'
  - 0xC0,0x30 - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384         - ECDHE-RSA-AES256-GCM-SHA384    TLSv1.2 Kx=ECDH     Au=RSA   Enc=AESGCM(256)            Mac=AEAD
  at: proto/tls12 cipherSuites[1]
