candidate_reason: "KeyStore password: no family in schema/families.yaml fits this class, and the schema may not be edited in this wave (a PKCS12 store derives its keys with PBKDF2 or PBES1 depending on how it was written, so no single family is pinned by the line). PBKDF2 is a placeholder."
