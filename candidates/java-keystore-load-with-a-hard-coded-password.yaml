    section: "CWE-259 Use of Hard-coded Password: Description"
    read_at: "2026-11-06"
    quote: "The product contains a hard-coded password, which it uses for its own inbound authentication or for outbound authentication to external components."
  - url: "https://yaogroup.cs.vt.edu/papers/IEEE_SecDev19_CryptoAPI-Bench.pdf"
    section: "Afrose et al., SecDev 2019, Section II.3 Passwords in KeyStore"
