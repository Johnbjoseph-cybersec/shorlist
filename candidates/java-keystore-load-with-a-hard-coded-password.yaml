id: "candidate"
title: "Java: KeyStore.load with a hard-coded password"
family: "PBKDF2"
parameter_set: null
role: "n.a."
form_kind: "api_call"
language_or_product: "Java / JCA"
negative: false
row_kind: "defect"
literal: "ks.load(in, \"changeit\".toCharArray());"
context_filename: "Store.java"
context_template: |
  import java.io.InputStream;
  import java.security.KeyStore;

  public class Store {
      static KeyStore open(InputStream in) throws Exception {
          KeyStore ks = KeyStore.getInstance("PKCS12");
          ks.load(in, "changeit".toCharArray());
          return ks;
      }
  }
expected:
  family: "PBKDF2"
  role: "undetermined"
  size: "undetermined"
defect:
  cwe: "CWE-259"
  taxonomy:
    - "CryptoAPI-Bench: Password in KeyStore"
    - "CryptoGuard: Rule 3 Predictable/constant passwords for KeyStore"
    - "MASC: 37. Constant password for android keystore"
source:
