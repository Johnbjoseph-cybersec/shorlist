candidate_reason: "Not a defect on its own line: a PBEWith* cipher takes the salt from PBEParameterSpec at Cipher.init (or generates one), and the PBKDF2 SecretKeyFactory rejects a spec without a salt. Whether the line is a misuse depends on code elsewhere; unverified which SunJCE paths accept it."
