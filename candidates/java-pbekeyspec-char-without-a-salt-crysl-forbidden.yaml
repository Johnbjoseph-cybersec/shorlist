context_filename: "Kdf.java"
context_template: |
  import javax.crypto.SecretKeyFactory;
  import javax.crypto.spec.PBEKeySpec;

  public class Kdf {
      static byte[] derive(char[] password) throws Exception {
          PBEKeySpec spec = new PBEKeySpec(password);
          return SecretKeyFactory.getInstance("PBEWithHmacSHA256AndAES_256").generateSecret(spec).getEncoded();
      }
  }
